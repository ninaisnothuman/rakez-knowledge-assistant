    setup: ['setup', 'formation', 'incorporation', 'registration'],
    closure: ['deregistration', 'strike', 'closing', 'closure'],
    amendment: ['amendment', 'amend', 'transfer', 'change', 'changing']
  };

  var FACET_TOPICS = {
    cost: ['cost', 'aed', 'cheap', 'cheapest', 'budget', 'quotation', 'quote'],
    timeline: ['duration', 'day', 'days', 'week', 'weeks', 'month', 'months', 'year', 'years',
               'deadline', 'period', 'when', 'grace', 'expiry', 'immediately', 'instant'],
    documents: ['document', 'passport', 'photo', 'attested', 'certificate', 'checklist', 'noc',
                'copy', 'copies', 'form', 'contract']
  };

  // Stemmed once at load, so the tables above can stay written in English.
  function stemTopicTable(table) {
    var out = {};
    Object.keys(table).forEach(function (topic) {
      var set = {};
      table[topic].forEach(function (w) { set[stem(w)] = 1; });
      out[topic] = set;
    });
    return out;
  }
  var SUBJECTS = null, FACETS = null, ACTIONS = null;

  // Which topics does this bag of stems carry? Returned as a set, not a single
  // label — real questions belong to more than one ("visa renewal cost").
  function topicsOf(stems, table) {
    var found = {};
    Object.keys(table).forEach(function (topic) {
      var markers = table[topic];
      for (var i = 0; i < stems.length; i++) {
        if (markers[stems[i]]) { found[topic] = (found[topic] || 0) + 1; }
      }
    });
    return found;
  }

  function keysOf(o) { return Object.keys(o || {}); }

  // The one topic a bag of words is MAINLY about, or null if it is a tie. Used on an
  // entry's title (what it is for) and on the question (what was asked), so that
  // "renew my licence" and "renew my visa" pull apart instead of both landing on
  // whichever renewal entry happens to score highest.
  function primaryTopic(counts) {
    var best = null, bestN = 0, tie = false;
    Object.keys(counts || {}).forEach(function (k) {
      if (counts[k] > bestN) { best = k; bestN = counts[k]; tie = false; }
      else if (counts[k] === bestN) { tie = true; }
    });
    return (best && !tie) ? best : null;
  }

  // How much of what the QUESTION is about does this entry cover? Deliberately not a
  // Jaccard: an entry that spans several topics is not worse for it, and punishing
  // breadth sent "where do i do my biometrics" to the medical test because the
  // Emirates ID entry also happens to mention fees. Covering none of the query's
  // topics is what costs an entry — that is the visa/licence confusion the product
  // owner hit, and it is now decided rather than left to luck.
  function topicMultiplier(qt, dt, mismatch, boost) {
    var qk = keysOf(qt), dk = keysOf(dt);
    if (!qk.length || !dk.length) return 1;           // no opinion either side: no opinion here
    var shared = 0;
    for (var i = 0; i < qk.length; i++) if (dt[qk[i]]) shared++;
    var cover = shared / qk.length;
    return mismatch + (1 + boost - mismatch) * cover;
  }

  // ===========================================================================
  // 2c. THE DOMAIN GATE — "is this question ours at all?"
  //
  // ADDED 2026-09-11, after verification found "how do i renew my passport" coming
  // back as `strong`, with the line "It costs AED 1,999 and takes 3 to 5 working
  // days", eight bullets, a fact card and a source line under it. Quoting a price
  // at someone who asked about a passport is the exact failure this project exists
  // to prevent.
  //
  // The previous build had ONE decision — how well did the best entry score — and
  // one set of thresholds controlling it. That is why the two live defects pulled
  // against each other: raising the bar to keep passports out also pushed honest
  // rephrasings of the assistant's OWN suggested questions into the fallback, and
  // lowering it to let those through let the passport back in. A single knob cannot
  // do both jobs because they are not the same job.
  //
  // So there are now two decisions:
  //
  //   (a) IS THIS IN OUR DOMAIN?  Decided here, from the question alone, before any
  //       score is looked at. Out-of-domain questions never reach scoring, so
  //       nothing done to recall inside the domain can leak out of it.
  //   (b) WHICH ENTRY IS IT?      Decided by the scoring below, which can now afford
  //       to be generous about paraphrase, because (a) is holding the line.
  //
  // The trap this has to survive is exactly "how do i renew my passport": "renew" is
  // strong RAKEZ vocabulary and "passport" is all over the corpus as a DOCUMENT
  // requirement, so token overlap alone looks domain-ish. Counting words the corpus
  // has seen is therefore not enough. What matters is what the question is ABOUT —
  // its head subject — and whether RAKEZ has entries about that thing. RAKEZ issues
  // licences and visas; it does not issue passports. "Passport" appears in the
  // corpus the way "photograph" does: as something you hand in, never as a thing
  // you can ask about.
  //
  // Three tests, each a veto and never a promotion. A question only has to fail one
  // to be out of scope, and being in scope proves nothing about which entry wins.
  //
  //   1. ALIEN VOCABULARY  — most of what was typed is words the knowledge base has
  //      never seen anywhere ("what is the capital of FRANCE").
  //   2. THE PREDICATE     — the verb the question turns on is one the knowledge
  //      base never uses ("how do i CLAIM on my medical insurance", "can you BOOK
  //      me a flight"). RAKEZ answers are written about the things RAKEZ does.
  //   3. THE HEAD SUBJECT  — the thing the question is about is not something the
  //      knowledge base has entries about ("renew my PASSPORT", "your wifi
  //      PASSWORD", "renew my tenancy CONTRACT").
  //
  // A question of one content word ("tabby", "strike off") is exempt from 2 and 3:
  // there is no predicate and no object, it is a lookup, and the vocabulary test is
  // the honest one to apply to it.
  // ===========================================================================

  // The words that mark the start of a noun phrase. "renew my PASSPORT" and "the
  // trade LICENCE" — whatever follows one of these, up to the next filler, is a
  // thing the question is about, and its last word is that thing's head.
  var DETERMINERS = {
    my: 1, our: 1, your: 1, the: 1, a: 1, an: 1, this: 1, that: 1, these: 1,
    those: 1, his: 1, her: 1, its: 1, their: 1, another: 1, any: 1, some: 1,
    each: 1, every: 1, no: 1, new: 1, more: 1
  };

  // Facet and action vocabulary: cost, duration, documents, and the verbs for the
  // things RAKEZ does. These are DOMAIN words, but they never say what a question
  // is about — "how much" and "renew" are as true of a passport as of a licence.
  // They are therefore neutral in the gate: they cannot make a question ours and
  // they cannot make it not ours. This is the distinction the passport case turns
  // on, so the list stays deliberately abstract: no concrete nouns.
  var SUPPORT_WORDS = [
    'cost', 'price', 'fee', 'charge', 'duration', 'time', 'deadline', 'period',
    'document', 'documents', 'requirement', 'required', 'paperwork', 'when',
    'need', 'needed', 'get', 'got', 'apply', 'application', 'applying', 'process',
    'procedure', 'step', 'steps', 'take', 'takes', 'use', 'using', 'online',
    'before', 'after', 'start', 'starting', 'submit', 'submitting', 'provide',
    'give', 'send', 'pay', 'paid', 'paying', 'issue', 'issued', 'valid',
    'validity', 'rule', 'rules', 'option', 'options', 'type', 'types', 'kind',
    'available', 'possible', 'eligible', 'eligibility', 'allowed', 'change',
    'update', 'updating', 'help', 'work', 'works', 'happen', 'happens'
  ];

  // Everything the knowledge base has entries ABOUT, assembled at index time from
  // the entries' own titles, the persona labels and the curated subject tables.
  // Titles are the right source: a title is the one place the knowledge base says
  // what an entry is FOR. Keyword lists are not — they are deliberately broad for
  // recall and they are exactly where "passport" lives.
  function buildSubjectStems(entries, personas) {
    var out = {};
    function add(text) {
      tokenise(normalise(text || '')).forEach(function (t) { if (t && !NOISE[t]) out[t] = 1; });
    }
    (entries || []).forEach(function (e) { add(e.title); });
    (personas || []).forEach(function (p) { add(p.label); });
    // The curated subject tables (visa / licence / company / payment) name the
    // domain's own vocabulary, and they are already stemmed with this stemmer.
    [SUBJECTS].forEach(function (table) {
      Object.keys(table || {}).forEach(function (topic) {
        Object.keys(table[topic]).forEach(function (t) { out[t] = 1; });
      });
    });
    ['rakez', 'free zone', 'freezone', 'uae', 'ras al khaimah'].forEach(add);
    return out;
  }

  function buildSupportStems() {
    var out = {};
    SUPPORT_WORDS.forEach(function (w) { out[stem(normalise(w))] = 1; });
    Object.keys(ACTIONS || {}).forEach(function (topic) {
      Object.keys(ACTIONS[topic]).forEach(function (t) { out[t] = 1; });
    });
    Object.keys(FACETS || {}).forEach(function (topic) {
      // Only the abstract facet words. FACET_TOPICS.documents lists concrete nouns
      // — passport, photo, certificate — and those are precisely the words that
      // must stay eligible to be a head subject and fail test 3.
      if (topic === 'documents') return;
      Object.keys(FACETS[topic]).forEach(function (t) { out[t] = 1; });
    });
    return out;
  }

  // Every content word of every noun phrase the question introduces with a
  // determiner, grouped by phrase. "what documents do i need to renew my passport"
  // -> [["passport"]]. "my residence visa runs out in a few weeks" ->
  // [["residence","visa"]] ("a few weeks" collapses to nothing once filler is
  // dropped, which is right: it qualifies the question, it is not what the question
  // is about).
  function determinerPhrases(pairs) {
    var out = [], i = 0;
    while (i < pairs.length) {
      if (!DETERMINERS[pairs[i].word]) { i++; continue; }
      var j = i + 1, phrase = [];
      while (j < pairs.length && !DETERMINERS[pairs[j].word] && !NOISE[pairs[j].stem]) {
        phrase.push(pairs[j]);
        j++;
      }
      if (phrase.length) out.push(phrase);
      i = (j > i + 1) ? j : i + 1;
    }
    return out;
  }

  // Is this stem something the knowledge base has entries about, or domain-neutral
  // scaffolding? Either is enough; only a word that is neither counts against a
  // question.
  function isSubjectStem(t, index) { return !!index.subjectStems[t]; }
  function isSupportStem(t, index) { return !!index.supportStems[t]; }
  function isOurs(t, index) { return !!(index.subjectStems[t] || index.supportStems[t]); }

  // Has the knowledge base ever written this exact word, in any of its text?
  function corpusKnowsWord(w, index) {
    return !!(index.vocab[w] || (index.textWords && index.textWords[w]));
  }

  // The gate itself. Returns { inDomain, reason }, never an answer — what to DO
  // about an out-of-domain question is decide()'s business, and the answer is
  // always the friendly fallback, never a dead end and never "I don't know".
  function domainCheck(q, index, persona) {
    if (!CFG.GATE_ON) return { inDomain: true, reason: 'gate off' };

    var content = [], pos = {};
    q.pairs.forEach(function (pr, i) { if (!NOISE[pr.stem]) { content.push(pr); pos[content.length - 1] = i; } });
    if (!content.length) return { inDomain: true, reason: 'nothing but filler — handled elsewhere' };

    // --- 1. alien vocabulary -------------------------------------------------
    if ((q.unknownShare || 0) >= CFG.GATE_ALIEN) {
      return {
        inDomain: false, test: 'vocabulary',
        reason: 'most of this question is vocabulary the knowledge base has never seen',
        alienShare: q.unknownShare
      };
    }

    // A one-word question is a lookup. There is no verb to judge and no object to
    // judge it against, so the vocabulary test above is the only fair one.
    if (content.length < 2) return { inDomain: true, reason: 'single-term lookup' };

    // --- 2. the predicate ----------------------------------------------------
    // Once the "how do i / can you / please" scaffolding is trimmed, the first
    // content word of a question is usually what it asks to DO. If the knowledge
    // base has never indexed that word as something an entry is about, it is not
    // describing that action: "how do i CLAIM on my medical insurance", "can you
    // BOOK me a flight", "RECOMMEND a good school". Skipped when that word sits
    // inside a noun phrase instead ("do i get any BREATHING room…"), where it is
    // an adjective and not the verb at all.
    var firstIdx = pos[0];
    var precededByDeterminer = firstIdx > 0 && DETERMINERS[q.pairs[firstIdx - 1].word];
    var first = content[0];
    if (!precededByDeterminer && !isOurs(first.stem, index) && index.idf[first.stem] === undefined) {
      return {
        inDomain: false, test: 'predicate',
        reason: 'nothing in this knowledge base is about "' + first.word + '"',
        predicate: first.word
      };
    }

    // --- 3. the head subject -------------------------------------------------
    // What is the question ABOUT? Whatever follows "my", "your", "the", "a". At
    // least one of those noun phrases has to name something RAKEZ has entries
    // about. This is the passport test: "renew my PASSPORT" offers exactly one
    // noun phrase and RAKEZ does not issue passports, whereas "renew my trade
    // LICENCE" and "renew my residence VISA" both do.
    var phrases = determinerPhrases(q.pairs);
    if (phrases.length) {
      var found = null;
      for (var a = 0; a < phrases.length && !found; a++) {
        for (var b = 0; b < phrases[a].length; b++) {
          if (isOurs(phrases[a][b].stem, index)) { found = phrases[a][b]; break; }
        }
      }
      if (!found) {
        var last = phrases[phrases.length - 1];
        // How far out of scope? There are two different situations here and they
        // deserve different answers.
        //
        //   "renew my PASSPORT", "your wifi PASSWORD", "do i need an AUDITOR" —
        //   words this knowledge base does use, just never as the subject of an
        //   entry. The honest answer is a hedge: say plainly that this is not
        //   something it answers, and offer the nearest entry as something to tap.
        //   That is `soft`.
        //
        //   "my TENANCY CONTRACT with my LANDLORD", "a FLIGHT to Dubai", "my CAR
        //   REGISTRATION" — words it has never written at all. There is nothing to
        //   offer, so the answer is the generic fallback: what it can cover, the
        //   nearest personas, and the RAKEZ hotline.
        var everyWordIndexed = true;
        phrases.forEach(function (ph) {
          ph.forEach(function (pr) { if (index.idf[pr.stem] === undefined) everyWordIndexed = false; });
        });
        return {
          inDomain: false, test: 'subject', soft: everyWordIndexed,
          reason: 'RAKEZ has nothing on "' + last.map(function (x) { return x.word; }).join(' ') + '"',
          head: last[last.length - 1].word
        };
      }
    } else {
      // No determiner anywhere: "do you accept apple pay", "free zone verses
      // mainland", "e wallet top up". These read as compound nouns, so the word in
      // front of the last one is the modifier that decides whose question it is.
      // Checked against the corpus's own SPELLING rather than its stems, because
      // "apple" and "apply" stem to the same thing and only one of them has ever
      // been written here.
      var head = content[content.length - 1];
      var modifier = content[content.length - 2];
      // Deliberately NOT softened by isOurs(modifier.stem): the stem is exactly what
      // collides. "apple" stems to "appl", which is also the stem of "apply", a word
      // this knowledge base uses constantly — so on stems "apple pay" reads as a
      // RAKEZ payment question. On spelling it does not.
      if (modifier && !corpusKnowsWord(modifier.word, index)) {
        return {
          inDomain: false, test: 'compound',
          reason: 'RAKEZ has nothing on "' + modifier.word + ' ' + head.word + '"',
          head: modifier.word + ' ' + head.word
        };
      }
    }

    // --- 4. the balance of evidence ------------------------------------------
    // Everything above is structural. This one is about weight: how much of what
    // was typed is domain subject matter, against how much of it is specific
    // vocabulary the knowledge base has nothing on. "apply for SCHOOL ADMISSION
    // for my son" passes tests 2 and 3 — "apply" is a RAKEZ verb and "family" is a
    // RAKEZ subject — and still fails here, because school admission is carrying
    // the question and the knowledge base has never heard of it. Measured as idf
    // mass, not as a count, so one stray word cannot sink a real question.
    var subjectMass = 0, outsiderMass = 0, outsiders = [];
    var seen = {};
    content.forEach(function (pr) {
      if (seen[pr.stem]) return;
      seen[pr.stem] = 1;
      var w = idfOf(pr.stem, index);
      if (isOurs(pr.stem, index)) { if (isSubjectStem(pr.stem, index)) subjectMass += w; return; }
      // Indexed as an entry's keyword or question: the knowledge base knows this
      // word even if no entry is titled after it. Half credit, not a mark against.
      if (index.idf[pr.stem] !== undefined) { subjectMass += w * 0.5; return; }
      outsiderMass += w;
      outsiders.push(pr.word);
    });
    if (outsiderMass > 0 && outsiderMass > subjectMass * CFG.GATE_BALANCE) {
      return {
        inDomain: false, test: 'balance',
        reason: 'the knowledge base has nothing about ' +
          outsiders.slice(0, 3).map(function (w) { return '"' + w + '"'; }).join(' or '),
        outsiders: outsiders, subjectMass: round(subjectMass), outsiderMass: round(outsiderMass)
      };
    }

    return { inDomain: true, reason: 'in scope', subjectMass: round(subjectMass), outsiderMass: round(outsiderMass) };
  }

  // --- 3. Repair: typos, and what a speech recogniser hands you -------------

  // Damerau-Levenshtein with an early exit, so a 68-entry vocabulary scan is cheap.
  function editDistance(a, b, max) {
    var la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return max + 1;
    var prev2 = null, prev = [], cur, i, j;
    for (j = 0; j <= lb; j++) prev.push(j);
    for (i = 1; i <= la; i++) {
      cur = [i];
      var best = i;
      for (j = 1; j <= lb; j++) {
        var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        var v = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
        if (prev2 && i > 1 && j > 1 &&
            a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
          v = Math.min(v, prev2[j - 2] + 1);          // transposition: "mcuh" -> "much"
        }
        cur[j] = v;
        if (v < best) best = v;
      }
      if (best > max) return max + 1;
      prev2 = prev; prev = cur;
    }
    return prev[lb];
  }

  // The nearest word in the knowledge base's OWN vocabulary. Deliberately strict:
  // the first letter must match and the lengths must be close, so a word the corpus
  // has genuinely never met ("france", "poland", "mosque") stays unmatched and keeps
  // dragging the score down, which is the whole point of the unknown-word signal.
  // Repair results are cached per word. The knowledge base does not change under us,
  // so the answer for a given word never changes either, and follow-up chips re-ask
  // the same strings hundreds of times over a run.
  var REPAIR_CACHE = {};

  function nearestVocab(w, index, cap) {
    if (!index || !index.vocab || w.length < CFG.REPAIR_MIN_LEN) return null;
    if (index.vocab[w]) return w;
    var ck = w + '|' + (cap === undefined ? '-' : cap);
    if (REPAIR_CACHE[ck] !== undefined) return REPAIR_CACHE[ck];
    var max = w.length >= CFG.REPAIR_LONG ? 2 : 1;
    if (cap !== undefined && cap < max) max = cap;
    var list = index.vocabByFirst[w.charAt(0)] || [];
    var best = null, bestD = 99;
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (v.length < 4) continue;              // the CANDIDATE only has to be a real
                                               // word; the minimum length rule is
                                               // about what we are willing to change,
                                               // not what we are willing to change it
                                               // into ("rackez" -> "rakez").
      if (Math.abs(v.length - w.length) > max) continue;
      var d = editDistance(w, v, max);
      if (d < bestD) { best = v; bestD = d; }
    }
    var answer = bestD <= max ? best : null;
    REPAIR_CACHE[ck] = answer;
    return answer;
  }

  // Dictation splits words that belong together ("e mirates", "gold en visa",
  // "share holder", "rack ez"). Try gluing each adjacent pair back together and keep
  // the result only if the knowledge base recognises it. Two words that the corpus
  // already knows separately are left alone, so "free zone" never becomes "freezone".
  // Particles that turn a verb into a different verb. "set up", "hand over",
  // "top up" and "sign out" are two words doing one job; gluing them produces a
  // NOUN the corpus happens to know ("setup") and silently changes what the
  // sentence is about — "once I am set up" started scoring as a company-formation
  // question. Dictation never splits a word INTO one of these, so refusing to glue
  // them costs nothing. ADDED 2026-09-11.
  var NEVER_GLUE = {
    up: 1, out: 1, off: 1, over: 1, down: 1, through: 1, back: 1, away: 1,
    along: 1, round: 1, aside: 1, apart: 1, ahead: 1, together: 1
  };

  function glue(words, index, trace) {
    var out = [], i = 0;
    while (i < words.length) {
      var w = words[i], nxt = words[i + 1];
      if (nxt) {
        var joined = w + nxt;
        // Never glue a single letter on ("after i" must not become "after"), never
        // glue two words the corpus already knows separately ("free zone" must not
        // become "freezone"), and never accept a result that is not longer than both
        // halves — that would be deleting a word, not repairing one.
        var mayGlue = nxt.length >= 2 && !NOISE[stem(nxt)] && !NEVER_GLUE[nxt] &&
                      (!index.vocab[w] || !index.vocab[nxt] || nxt.length <= 3);
        if (mayGlue && joined.length >= 5) {
          var fix = index.vocab[joined] ? joined : nearestVocab(joined, index, 1);
          if (fix && fix.length > w.length && fix.length > nxt.length) {
            out.push(fix);
            if (trace) trace.repairs.push(w + ' ' + nxt + ' -> ' + fix);
            i += 2;
            continue;
          }
        }
      }
      out.push(w);
      i++;
    }
    return out;
  }

  function repair(s, trace) {
    var index = INDEX;
    if (!index || !index.vocab) return s;            // building the index: nothing to repair against
    var words = glue(s.split(' ').filter(Boolean), index, trace);
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (index.vocab[w] || NOISE[stem(w)]) continue;
      // FIXED 2026-09-11. A word the knowledge base writes SOMEWHERE — in an answer,
      // a bullet, a fact — is a real word, whether or not any entry lists it as a
      // keyword. Repair used to ignore that and "corrected" perfectly good English
      // into the nearest keyword: "what CHARGES apply for licence renewal" became
      // "what CHANGES apply…", one edit away and a different question, which is how
      // a cost question came back as a documents answer.
      if (index.textWords && index.textWords[w]) continue;
      if (SYNONYM_WORDS[w]) continue;
      var fix = nearestVocab(w, index);
      if (fix && fix !== w) {
        if (trace) trace.repairs.push(w + ' -> ' + fix);
        words[i] = fix;
      }
    }
    return words.join(' ');
  }

  // A deliberately small, readable stemmer. Its job is only to make the two sides of
  // a comparison agree: it is applied to the knowledge base and to the query with the
  // same code, so an over-eager rule ("portal" -> "port") costs nothing.
  function stem(t) {
    if (t.length <= 3 || /^\d+$/.test(t)) return t;
    if (/ies$/.test(t)) t = t.slice(0, -3) + 'y';
    else if (/(ss|us|is)$/.test(t)) { /* keep */ }
    else if (/s$/.test(t)) t = t.slice(0, -1);
    if (t.length > 6 && /ation$/.test(t)) t = t.slice(0, -5);
    else if (t.length > 6 && /ement$/.test(t)) t = t.slice(0, -5);
    else if (t.length > 5 && /ing$/.test(t)) t = t.slice(0, -3);
    else if (t.length > 5 && /ed$/.test(t)) t = t.slice(0, -2);
    if (t.length > 6 && /al$/.test(t)) t = t.slice(0, -2);
    if (t.length > 4 && /y$/.test(t)) t = t.slice(0, -1);
    if (t.length > 3 && /(bb|dd|ff|gg|ll|mm|nn|pp|rr|tt|zz)$/.test(t)) t = t.slice(0, -1);
    if (t.length > 4 && /e$/.test(t)) t = t.slice(0, -1);
    return t;
  }

  // `opts.query` turns on repair (typos, mis-hearings). The knowledge base's own text
  // is clean and is indexed without it — which also means repair always has a fixed
  // vocabulary to aim at rather than chasing its own output.
  // `opts.trace` collects what fired, for explain().
  function normalise(raw, opts) {
    opts = opts || {};
    var s = String(raw == null ? '' : raw).toLowerCase();
    for (var i = 0; i < PHRASE_FIXES.length; i++) s = s.replace(PHRASE_FIXES[i][0], PHRASE_FIXES[i][1]);
    s = s.replace(/'/g, '');                 // visa's -> visas, don't -> dont
    s = s.replace(/[^a-z0-9\s]+/g, ' ');     // everything else becomes a gap
    s = s.replace(/\s+/g, ' ').trim();
    // Put split-apart dictation back together before anything else looks at the words,
    // so "gold en visa" is repaired to "golden visa" and not to two unknown tokens.
    if (opts.query) s = repair(s, opts.trace);
    // Correct the shorthand BEFORE trimming filler, so "hw do i renew" loses the same
    // opening as "how do i renew" and the two end up identical.
    s = s.split(' ').map(function (w) { return SPELLING[w] || w; }).join(' ');
    // A second repair pass: the spelling table may have handed us a new word, and a
    // typo can hide behind a correction ("mcuh" -> "much" only helps once "how much"
    // can then collapse to the cost class below).
    if (opts.query) s = repair(s, opts.trace);
    // Collapse the ways people say one concept into one concept. Applied to BOTH
    // sides of every comparison — the knowledge base goes through this too.
    s = applySynonyms(s, opts.trace);
    // trim filler, repeatedly, until nothing more comes off
    var before;
    do {
      before = s;
      for (var f = 0; f < FILLERS.length; f++) s = s.replace(FILLERS[f], '');
      for (var t = 0; t < TAIL_FILLERS.length; t++) s = s.replace(TAIL_FILLERS[t], '');
      s = s.replace(/\s+/g, ' ').trim();
    } while (s !== before && s.length);
    if (!s) s = String(raw == null ? '' : raw).toLowerCase().replace(/[^a-z0-9\s]+/g, ' ').replace(/\s+/g, ' ').trim();
    return s;
  }

  function tokenise(normText) {
    return tokenisePairs(normText).map(function (p) { return p.stem; });
  }

  // Stem plus the word the person actually typed, so an unmatched word can be quoted
  // back to them in their own spelling rather than as a stem.
  function tokenisePairs(normText) {
    var out = [], parts = normText ? normText.split(' ') : [];
    for (var i = 0; i < parts.length; i++) {
      var w = parts[i];
      if (!w) continue;
      var fixed = SPELLING[w] || w;
      var st = stem(fixed);
      if (st) out.push({ stem: st, word: w });
    }
    return out;
  }

  function bigrams(tokens) {
    var out = [];
    for (var i = 0; i + 1 < tokens.length; i++) out.push(tokens[i] + ' ' + tokens[i + 1]);
    return out;
  }

  // A phrase, prepared once, ready to be compared.
  function prepare(raw, opts) {
    opts = opts || {};
    var norm = normalise(raw, opts);
    var pairs = tokenisePairs(norm);
    var tokens = pairs.map(function (p) { return p.stem; });
    return {
      raw: raw,
      norm: norm,
      pairs: pairs,
      tokens: tokens,
      key: tokens.join(' '),
      set: toSet(tokens),
      bigrams: bigrams(tokens),
      trace: opts.trace || null
    };
  }

  // What a person typed, as opposed to what the knowledge base says: repaired, and
  // carrying a record of every class and correction that fired.
  var QUERY_CACHE = {};

  function prepareQuery(raw) {
    var key = String(raw == null ? '' : raw);
    if (QUERY_CACHE[key]) return QUERY_CACHE[key];
    var out = prepare(raw, { query: true, trace: { classes: [], repairs: [] } });
    QUERY_CACHE[key] = out;
    return out;
  }

  function toSet(arr) {
    var s = {};
    for (var i = 0; i < arr.length; i++) s[arr[i]] = 1;
    return s;
  }

  // ===========================================================================
  // 3. THE INDEX — built once, lazily, from knowledge.json
  // ===========================================================================

  var KB = null;     // the raw knowledge object
  var INDEX = null;  // the derived index

  function resolveKnowledge() {
    if (VKB.knowledge) return VKB.knowledge;
    if (global.KNOWLEDGE) return global.KNOWLEDGE;
    if (global.RAKEZ_KNOWLEDGE) return global.RAKEZ_KNOWLEDGE;
    // Node (the test harness) — the browser build inlines the JSON instead.
    if (typeof module !== 'undefined' && module.exports && typeof require === 'function') {
      try { return require('../data/knowledge.json'); } catch (e) { /* not available */ }
    }
    return null;
  }

  function build(knowledge) {
    KB = knowledge;
    REPAIR_CACHE = {};
    QUERY_CACHE = {};
    RANK_CACHE = {};
    var entries = (knowledge && knowledge.entries) || [];
    var df = {}, N = entries.length || 1;

    SUBJECTS = SUBJECTS || stemTopicTable(SUBJECT_TOPICS);
    FACETS = FACETS || stemTopicTable(FACET_TOPICS);
    ACTIONS = ACTIONS || stemTopicTable(ACTION_TOPICS);

    // The knowledge base's own vocabulary, in the spelling it uses AFTER normalising
    // but BEFORE stemming. This is what typo repair aims at: a word is only ever
    // "corrected" into something the corpus actually contains.
    var vocab = {};
    function learn(normText) {
      String(normText || '').split(' ').forEach(function (w) { if (w) vocab[w] = 1; });
    }

    // A SECOND, wider vocabulary: every word the knowledge base says anywhere,
    // including inside answers, bullets and facts. Scoring still only looks at
    // questions, keywords and titles — but "is this a word the knowledge base has
    // never heard of" is a question about the whole knowledge base, not about its
    // keyword lists. Without this, "Ras Al Khaimah" read as alien vocabulary purely
    // because no entry happened to list it as a keyword.
    var textStems = {};
    // The same thing again at WORD level, unstemmed. The domain gate needs it
    // because stemming collides in exactly the place it hurts: "apple" and "apply"
    // both stem to "appl", and this knowledge base has written one of them a
    // hundred times and the other never. ADDED 2026-09-11.
    var textWords = {};
    function learnText(raw) {
      var n = normalise(raw || '');
      n.split(' ').forEach(function (w) { if (w) textWords[w] = 1; });
      tokenise(n).forEach(function (t) { textStems[t] = 1; });
    }

    var docs = entries.map(function (e) {
      var questions = (e.questions || []).map(function (q) { return prepare(q); });
      var kwTokens = [], kwWords = [];
      (e.keywords || []).forEach(function (k) {
        var n = normalise(k);
        learn(n);
        kwWords = kwWords.concat(n.split(' '));
        kwTokens = kwTokens.concat(tokenise(n));
      });
      var titleNorm = normalise(e.title || '');
      learn(titleNorm);
      learnText(e.title);
      learnText(e.answer);
      (e.bullets || []).forEach(learnText);
      (e.facts || []).forEach(function (f) { learnText(f.label); learnText(f.value); });
      (e.followUps || []).forEach(learnText);
      kwWords.forEach(function (w) { if (w) textStems[stem(w)] = 1; });
      var titleTokens = tokenise(titleNorm);
      var qTokens = [];
      questions.forEach(function (q) { learn(q.norm); qTokens = qTokens.concat(q.tokens); });

      var all = toSet(kwTokens.concat(titleTokens).concat(qTokens));
      Object.keys(all).forEach(function (t) { df[t] = (df[t] || 0) + 1; });

      // An entry's topics come from its own title and its own questions — what it is
      // FOR — not from its keyword list. Keyword lists are deliberately broad for
      // recall, and reading topics off them made a single entry look like it was
      // about visas, licences, companies and payments all at once, which is the same
      // as having no topic at all.
      var topicStems = Object.keys(toSet(titleTokens.concat(qTokens)));
      return {
        entry: e,
        id: e.id,
        questions: questions,
        kwSet: toSet(kwTokens),
        qSet: toSet(qTokens),
        titleSet: toSet(titleTokens),
        subjects: topicsOf(topicStems, SUBJECTS),
        facets: topicsOf(topicStems, FACETS),
        primarySubject: primaryTopic(topicsOf(titleTokens, SUBJECTS)),
        actions: topicsOf(titleTokens, ACTIONS),
        personas: e.persona || []
      };
    });

    var idf = {}, maxIdf = 0;
    Object.keys(df).forEach(function (t) {
      idf[t] = Math.log(1 + N / (1 + df[t]));
      if (idf[t] > maxIdf) maxIdf = idf[t];
    });
    // A token the knowledge base has never seen ("weather") is treated as rare, which
    // drags the coverage score down. It is also counted separately in rank(), where it
    // scales the whole score and gets named back to the person in the answer.
    var unknownIdf = CFG.UNKNOWN_IDF * maxIdf;

    // Bucketed by first letter: typo repair only ever considers words that start the
    // same way, which keeps it fast and keeps it from inventing matches.
    var vocabByFirst = {};
    Object.keys(vocab).forEach(function (w) {
      var c = w.charAt(0);
      (vocabByFirst[c] = vocabByFirst[c] || []).push(w);
    });

    var index = {
      docs: docs,
      idf: idf,
      maxIdf: maxIdf,
      unknownIdf: unknownIdf,
      vocab: vocab,
      textStems: textStems,
      textWords: textWords,
      vocabByFirst: vocabByFirst,
      byId: {},
      personas: (knowledge && knowledge.personas) || []
    };
    docs.forEach(function (d) { index.byId[d.id] = d; });

    // Pre-compute idf mass for every prepared phrase now the idf table exists.
    docs.forEach(function (d) {
      d.questions.forEach(function (q) { q.mass = mass(q.tokens, index); });
    });

    // What each persona is about, derived from its own label and starters. Used only
    // when the question names no subject of its own: "how much does it cost" means
    // something different on the licence-renewal path than on the company-setup path,
    // and the persona is the only thing that says which. Requires a clear majority,
    // so a catch-all persona ("General questions") contributes nothing.
    index.personaSubject = {};
    (index.personas || []).forEach(function (pp) {
      var text = (pp.label || '') + ' ' + ((pp.starters || []).join(' '));
      var counts = topicsOf(tokenise(normalise(text)), SUBJECTS);
      var top = primaryTopic(counts);
      if (top && counts[top] >= 3) index.personaSubject[pp.id] = top;
    });

    // What the knowledge base has entries ABOUT, and what is merely domain
    // scaffolding. The domain gate (section 2c) is built on this distinction.
    index.subjectStems = buildSubjectStems(entries, index.personas);
    index.supportStems = buildSupportStems();

    index.contact = findContact(index);
    index.disputes = findDisputes(docs);
    return index;
  }

  function idfOf(t, index) {
    var v = index.idf[t];
    if (v !== undefined) return v;
    // Said somewhere in the knowledge base but never indexed: rare, not alien.
    if (index.textStems && index.textStems[t]) return index.maxIdf;
    return index.unknownIdf;
  }

  // "The knowledge base has never heard this word" — the signal that decides whether
  // the engine has any business answering at all.
  function isUnknown(t, index) {
    return index.idf[t] === undefined && !(index.textStems && index.textStems[t]);
  }

  // Said somewhere in the knowledge base but never indexed as something an entry is
  // ABOUT. "Parents" is mentioned in passing; no entry answers a question about them.
  // Half-unknown, and worth saying so.
  function isThin(t, index) {
    return index.idf[t] === undefined && !!(index.textStems && index.textStems[t]);
  }

  function mass(tokens, index) {
    var m = 0, seen = {};
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (seen[t]) continue;
      seen[t] = 1;
      m += NOISE[t] ? idfOf(t, index) * 0.15 : idfOf(t, index);
    }
    return m;
  }

  function ensure() {
    if (INDEX) return INDEX;
    var k = resolveKnowledge();
    if (!k) return null;
    INDEX = build(k);
    return INDEX;
  }

  // ===========================================================================
  // 4. SCORING
  // ===========================================================================

  // idf-weighted overlap of two token sets, normalised by the heavier side so that
  // extra words on EITHER side cost you. Keeps "visa" from matching a 12-word entry.
  function overlapScore(a, b, index) {
    var shared = 0, seen = {};
    for (var i = 0; i < a.tokens.length; i++) {
      var t = a.tokens[i];
      if (seen[t] || !b.set[t]) continue;
      seen[t] = 1;
      shared += NOISE[t] ? idfOf(t, index) * 0.15 : idfOf(t, index);
    }
    var denom = Math.max(a.mass || mass(a.tokens, index), b.mass || mass(b.tokens, index));
    return denom > 0 ? shared / denom : 0;
  }

  // Word-order overlap, weighted by how informative the pair is. Unweighted, the
  // bigrams "what do" and "do i" made every question look like every other question.
  function bigramWeight(bg, index) {
    var parts = bg.split(' ');
    var w = 0;
    for (var i = 0; i < parts.length; i++) {
      w += NOISE[parts[i]] ? idfOf(parts[i], index) * 0.15 : idfOf(parts[i], index);
    }
    return w / 2;
  }

  function bigramScore(a, b, index) {
    if (!a.bigrams.length || !b.bigrams.length) return 0;
    var set = toSet(b.bigrams), hit = 0, massA = 0, massB = 0, i;
    for (i = 0; i < a.bigrams.length; i++) {
      var w = bigramWeight(a.bigrams[i], index);
      massA += w;
      if (set[a.bigrams[i]]) hit += w;
    }
    for (i = 0; i < b.bigrams.length; i++) massB += bigramWeight(b.bigrams[i], index);
    var denom = Math.min(massA, massB);
    if (denom <= 0) return 0;
    var s = hit / denom;
    return s > 1 ? 1 : s;
  }

  // How close is the typed phrase to one of the entry's own questions?
  function phraseSim(q, kq, index) {
    if (!q.key || !kq.key) return 0;
    if (q.key === kq.key) return 1;
    var sim = CFG.W_COVER * overlapScore(q, kq, index) + CFG.W_BIGRAM * bigramScore(q, kq, index);
    // One phrase sitting inside the other ("visa cost" inside "employee visa cost")
    // is a strong signal; scale it by how much of the longer phrase it covers.
    if (q.key.length >= 6 && (kq.key.indexOf(q.key) >= 0 || q.key.indexOf(kq.key) >= 0)) {
      var ratio = Math.min(q.key.length, kq.key.length) / Math.max(q.key.length, kq.key.length);
      sim = Math.max(sim, 0.76 + 0.22 * ratio);
    }
    return sim > 1 ? 1 : sim;
  }

  // idf-weighted coverage of the query by one entry's fields.
  function fieldCoverage(q, doc, index) {
    var hit = 0, total = 0, seen = {};
    for (var i = 0; i < q.tokens.length; i++) {
      var t = q.tokens[i];
      if (seen[t]) continue;
      seen[t] = 1;
      var w = NOISE[t] ? idfOf(t, index) * 0.15 : idfOf(t, index);
      total += w;
      var f = doc.kwSet[t] ? CFG.HIT_KEYWORD
            : doc.qSet[t] ? CFG.HIT_QUESTION
            : doc.titleSet[t] ? CFG.HIT_TITLE
            : 0;
      hit += w * f;
    }
    return total > 0 ? hit / total : 0;
  }

  function titleCoverage(q, doc, index) {
    var hit = 0, total = 0, seen = {};
    for (var i = 0; i < q.tokens.length; i++) {
      var t = q.tokens[i];
      if (seen[t]) continue;
      seen[t] = 1;
      var w = NOISE[t] ? idfOf(t, index) * 0.15 : idfOf(t, index);
      total += w;
      if (doc.titleSet[t]) hit += w;
    }
    return total > 0 ? hit / total : 0;
  }

  // Ranking is a pure function of (query, persona) and the knowledge base does not
  // change under us, so the result is cached. Follow-up chips re-rank the same
  // strings hundreds of times over a session; without this the engine spends most of
  // its time answering questions it has already answered.
  var RANK_CACHE = {};

  // Does the winning entry cover what the question asked to DO? The gate (section
  // 2c) asks whether the knowledge base uses the question's verb at all; this asks
  // the narrower question of whether THIS entry does. "How do I CLAIM on my medical
  // insurance" matches the health-insurance entry strongly on "medical insurance"
  // and that entry says nothing whatever about claiming — so the answer is offered,
  // openly hedged, rather than asserted with a fact card and a price under it.
  // ADDED 2026-09-11.
  function coversPredicate(cand, q, index) {
    if (!cand || !cand.doc || !q || !q.pairs || !q.pairs.length) return true;
    var content = [], at = -1;
    q.pairs.forEach(function (pr, i) { if (!NOISE[pr.stem]) { content.push(pr); if (at < 0) at = i; } });
    if (content.length < 2) return true;
    // Same guard as the gate's predicate test: a first content word sitting inside
    // a noun phrase ("do i get any BREATHING room…") is an adjective, not the verb.
    if (at > 0 && DETERMINERS[q.pairs[at - 1].word]) return true;
    var verb = content[0];
    // Support vocabulary ("cost", "need", "documents", "when") is not a predicate
    // any entry has to name, and a subject in first position is not a verb at all.
    if (isOurs(verb.stem, index)) return true;
    var doc = cand.doc;
    return !!(doc.kwSet[verb.stem] || doc.qSet[verb.stem] || doc.titleSet[verb.stem]);
  }

  // Rank every entry. Pure function of (query, persona) — no state, no surprises.
  function rank(queryText, context) {
    var ckey = String(queryText) + '\u0000' + ((context && context.persona) || '');
    if (RANK_CACHE[ckey]) return RANK_CACHE[ckey];
    var ranked = rankUncached(queryText, context);
    RANK_CACHE[ckey] = ranked;
    return ranked;
  }

  function rankUncached(queryText, context) {
    var index = ensure();
    if (!index) return { query: queryText, candidates: [], q: prepare(queryText) };
    var persona = context && context.persona;
    var q = prepareQuery(queryText);
    q.mass = mass(q.tokens, index);
    q.unknown = uniq(q.pairs.filter(function (pr) {
      return !NOISE[pr.stem] && isUnknown(pr.stem, index);
    }).map(function (pr) { return pr.word; }));

    // How much of what was typed is vocabulary the knowledge base has never seen,
    // measured as idf mass rather than counted. "Capital of FRANCE" is half unknown;
    // "annual leave ENTITLEMENT" is one word in three with the meaning carried by the
    // other two. Treating those the same is what let the France answer through.
    var unkMass = 0, totMass = 0;
    q.pairs.forEach(function (pr) {
      if (NOISE[pr.stem]) return;
      var w = idfOf(pr.stem, index);
      totMass += w;
      if (isUnknown(pr.stem, index)) unkMass += w;
      else if (isThin(pr.stem, index)) unkMass += 0.5 * w;
    });
    q.unknownShare = totMass > 0 ? round(unkMass / totMass) : 0;
    var unknownFactor = Math.max(0.15, 1 - CFG.UNKNOWN_WEIGHT * q.unknownShare);

    q.subjects = topicsOf(q.tokens, SUBJECTS || stemTopicTable(SUBJECT_TOPICS));
    q.facets = topicsOf(q.tokens, FACETS || stemTopicTable(FACET_TOPICS));
    q.primarySubject = primaryTopic(q.subjects);
    q.actions = topicsOf(q.tokens, ACTIONS || stemTopicTable(ACTION_TOPICS));
    // The domain gate runs here, on the question alone, so that explain() can show
    // it and decide() can consult it without re-deriving anything.
    q.domain = domainCheck(q, index, persona);

    q.subjectFromPersona = false;
    if (!keysOf(q.subjects).length && persona && index.personaSubject && index.personaSubject[persona]) {
      var ps = index.personaSubject[persona];
      q.subjects = {}; q.subjects[ps] = 1;
      q.primarySubject = ps;
      q.subjectFromPersona = true;
    }

    var out = index.docs.map(function (doc) {
      var best = 0, bestQ = null;
      for (var i = 0; i < doc.questions.length; i++) {
        var s = phraseSim(q, doc.questions[i], index);
        if (s > best) { best = s; bestQ = doc.questions[i].raw; }
      }
      var kw = fieldCoverage(q, doc, index);
      var ti = titleCoverage(q, doc, index);
      // The topic layer. Subject disagreement is the expensive one — "my licence is
      // expiring" and "my visa is expiring" are decided here rather than by luck.
      var subjMult = topicMultiplier(q.subjects, doc.subjects, CFG.SUBJECT_MISMATCH, CFG.SUBJECT_BOOST);
      if (q.primarySubject && doc.primarySubject && q.primarySubject !== doc.primarySubject) {
        subjMult *= CFG.SUBJECT_CLASH;
      }
      // Skipped when the subject came from the persona rather than from the question:
      // a question that says nothing at all should not be judged on the actions it
      // failed to name.
      if (!q.subjectFromPersona && keysOf(doc.actions).length) {
        var qa = keysOf(q.actions), shares = false;
        for (var a = 0; a < qa.length; a++) if (doc.actions[qa[a]]) { shares = true; break; }
        if (!shares) subjMult *= CFG.ACTION_MISMATCH;
      }
      var facetMult = topicMultiplier(q.facets, doc.facets, CFG.FACET_MISMATCH, CFG.FACET_BOOST);
      var base = (CFG.W_PHRASE * best + CFG.W_KEYWORD * kw + CFG.W_TITLE * ti) *
                 unknownFactor * subjMult * facetMult;
      var boosted = base;
      var personaHit = !!(persona && doc.personas.indexOf(persona) >= 0);
      if (personaHit) boosted = base * (1 + CFG.PERSONA_BOOST);
      // The words this particular entry has no claim on: not in its keywords, not in
      // its questions, not in its title, and not indexed anywhere else either. This
      // is what separates "the nearest entry" from "the answer".
      var unindexed = [];
      q.pairs.forEach(function (pr) {
        if (NOISE[pr.stem]) return;
        if (doc.kwSet[pr.stem] || doc.qSet[pr.stem] || doc.titleSet[pr.stem]) return;
        if (isUnknown(pr.stem, index) || isThin(pr.stem, index)) unindexed.push(pr.word);
      });

      return {
        entryId: doc.id,
        title: doc.entry.title,
        total: round(boosted),
        unindexed: uniq(unindexed),
        subjects: keysOf(doc.subjects),
        facets: keysOf(doc.facets),
        subjectMult: round(subjMult),
        facetMult: round(facetMult),
        phrase: round(best),
        keyword: round(kw),
        titleScore: round(ti),
        persona: personaHit ? round(boosted - base) : 0,
        bestQuestion: bestQ,
        explained: round(kw),
        unknownWords: q.unknown,
        doc: doc
      };
    });

    out.sort(function (a, b) { return b.total - a.total; });
    return { query: queryText, q: q, candidates: out };
  }

  function round(n) { return Math.round(n * 1000) / 1000; }

  // FIXED 2026-09-11 (UX audit finding 1).
  //
  // The old rule had two doors into `strong`: clearing the absolute bar with a
  // margin, OR clearing twice the margin at 90% of the bar. The second door is how
  // "what is the capital of France" came back as a confident answer about minimum
  // share capital at 0.382, well under the engine's own 0.42 — a lone candidate was
  // promoted on margin alone, and a margin over nothing is not confidence.
  //
  // Confidence is now conjunctive. `strong` requires all three:
  //   - the absolute score clears STRONG;
  //   - it is clear of the runner-up by MARGIN;
  //   - the knowledge base has vocabulary for most of what was typed.
  // Failing the third alone gives `tentative`: the entry is probably right but the
  // question is partly about something not in here, so it is offered, not asserted.
  // Failing on score gives `ambiguous` (several plausible) or `tentative` (one).
  // Knowing almost none of the words gives `weak` — the honest fallback.
  function decide(candidates, q) {
    var top = candidates[0], second = candidates[1];
    var share = (q && q.unknownShare) || 0;

    // (a) IS THIS QUESTION OURS AT ALL? Asked first, answered from the question
    // itself (section 2c), and never from how well anything scored. An out-of-scope
    // question goes to the friendly fallback no matter what the ranking says, which
    // is what makes it safe to be generous below.
    if (q && q.domain && !q.domain.inDomain) {
      // `soft` means the question is built out of words this knowledge base uses
      // but is not about anything it has an entry for. Rather than a bare fallback
      // it offers the nearest entry, openly hedged and with its bullets, fact card
      // and source line withheld — never asserted, never a price under a question
      // about a passport. Anything harder than that gets the generic fallback.
      if (q.domain.soft && top && top.total >= CFG.FLOOR) {
        top.outOfScope = true;
        return 'tentative';
      }
      return 'weak';
    }

    if (!top || top.total < CFG.FLOOR) return 'weak';
    if (share >= CFG.BLIND_SHARE) return 'weak';
    var gap = top.total - (second ? second.total : 0);

    // (b) GIVEN THAT IT IS OURS, WHICH ENTRY IS IT? Three doors into `strong`, all
    // of which only open for a question the gate has already passed:
    //
    //   1. THE ORDINARY BAR — a good absolute score, clear of the runner-up. This
    //      is the pre-existing rule and it is unchanged.
    //   2. A VERBATIM QUESTION — what was typed is, to within a couple of words,
    //      one of the entry's own listed questions. Second place is then beside the
    //      point. Kept deliberately strict (EXACT_PHRASE), because several entries
    //      wording a question almost identically is a reason to ask which one was
    //      meant, not a reason to pick one.
    //   3. A CLEAR WINNER AT A LOW SCORE — the runner-up is well behind either in
    //      relative total (DOMINANCE) or in how well it matched its own wording
    //      (PHRASE_LEAD). This is the shape a paraphrase of a suggested question
    //      takes: nothing scores high, but one entry is plainly the one meant.
    //      "My residence visa runs out in a few weeks, what should I do" sits 0.032
    //      above second place on total and 0.155 above it on phrasing — offering a
    //      did-you-mean there helps nobody.
    //
    // Door 3 is the "promoted on margin alone" shape that shipped the France
    // answer, and it would still be unsafe on its own. It is safe here only because
    // a question that is not ours never reaches this line.
    //
    // Any of the three can still be pulled back to `tentative`: by vocabulary the
    // knowledge base mostly does not have (HEDGE_SHARE), or by a winner that says
    // nothing about what the question asked to DO. That flag travels with the
    // candidate so answerFromEntry() knows to withhold the bullets, the fact card
    // and the source line rather than dress a hedge up as an answer.
    top.predicateMiss = !coversPredicate(top, q, ensure());
    var hedged = share >= CFG.HEDGE_SHARE || top.predicateMiss;
    var exact = top.phrase >= CFG.EXACT_PHRASE;
    var dominant = second ? (second.total <= top.total * CFG.DOMINANCE) : true;
    var leads = second ? (top.phrase - second.phrase) >= CFG.PHRASE_LEAD : true;

    if (exact && top.total >= CFG.FLOOR) return hedged ? 'tentative' : 'strong';
    if (top.total >= CFG.STRONG && gap >= CFG.MARGIN) return hedged ? 'tentative' : 'strong';
    if (top.total >= CFG.STRONG_MIN && (dominant || leads)) return hedged ? 'tentative' : 'strong';

    return 'ambiguous';
  }

  // ===========================================================================
  // 5. THE CONFIDENCE LAYER — honesty rules 3 and 4, driven entirely by the data
  // ===========================================================================

  // Every AED figure mentioned in a piece of text, as plain digit strings.
  function figuresIn(text) {
    var out = [], m, re = /aed\s*(\d+)/gi;
    var s = String(text || '').replace(/(\d),(\d)/g, '$1$2');
    while ((m = re.exec(s)) !== null) out.push(m[1]);
    return out;
  }

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  function money(n) {
    return 'AED ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // Does this fact record two official pages disagreeing, as opposed to a genuine
  // "it depends"? Decided from the text, not from a list of known prices, so a fixed
  // knowledge.json fixes the behaviour with no code change here.
  var DISAGREE_RE = /(disagree|different figure|says aed[\s\S]*?(?:lists|quotes|per the)|;\s*(?:aed|the\b)|\bvs\b|quoted on the|also lists|page lists|per the faq|reads lower|not legible|sits above)/i;

  function analyseFact(fact) {
    var f = {
      label: fact.label,
      value: fact.value,
      confidence: fact.confidence
    };
    var figs = uniq(figuresIn(fact.value));
    f.figures = figs;
    if (fact.confidence === 'varies') {
      f.disputed = figs.length >= 2 || DISAGREE_RE.test(fact.value);
      if (figs.length === 2) {
        var a = parseInt(figs[0], 10), b = parseInt(figs[1], 10);
        f.range = money(Math.min(a, b)) + ' to ' + money(Math.max(a, b));
      }
      f.caution = f.disputed
        ? 'Official RAKEZ pages do not agree on this — both are quoted above, neither is presented as the price.'
        : 'This varies by case — treat it as a range or a "depends", not a fixed figure.';
    } else if (fact.confidence === 'unconfirmed') {
      f.disputed = false;
      f.caution = 'Not confirmed on an official source. Not stated here as fact — check it with RAKEZ.';
    } else {
      f.disputed = false;
    }
    return f;
  }

  // Build the whole-knowledge-base view of which figures are contested, so a bullet
  // that quotes one side of a contested pair can be flagged wherever it appears.
  function findDisputes(docs) {
    var byEntry = {};
    docs.forEach(function (d) {
      var figs = [];
      (d.entry.facts || []).forEach(function (fact) {
        if (fact.confidence !== 'varies') return;
        var a = analyseFact(fact);
        if (a.disputed) figs = figs.concat(a.figures);
      });
      byEntry[d.id] = toSet(figs);
    });
    return byEntry;
  }

  var HEDGED_RE = /(confirm|disput|varies|depends|not published|not stated|not legible|ask rakez|quote|per the faq|promotions page|getting started)/i;

  // A bullet that states one side of a contested figure gets marked, unless it already
  // hedges. The marker points at the note that carries the full ambiguity.
  function annotateBullets(entry, disputedFigs) {
    var keys = Object.keys(disputedFigs || {});
    return (entry.bullets || []).map(function (b) {
      if (!keys.length) return b;
      if (HEDGED_RE.test(b)) return b;
      var figs = figuresIn(b);
      for (var i = 0; i < figs.length; i++) {
        if (disputedFigs[figs[i]]) return b + ' — figure disputed, see the note below';
      }
      return b;
    });
  }

  // The RAKEZ contact route, read out of the knowledge base rather than hardcoded.
  function findContact(index) {
    var best = null;
    index.docs.forEach(function (d) {
      var kw = d.kwSet;
      var score = (kw[stem('contact')] ? 2 : 0) + (kw[stem('phone')] ? 2 : 0) +
                  (kw[stem('email')] ? 1 : 0) + (kw[stem('number')] ? 1 : 0);
      if (score >= 4 && (!best || score > best.score)) best = { doc: d, score: score };
    });
    if (!best) return null;
    var e = best.doc.entry, phone = null, email = null;
    (e.facts || []).forEach(function (f) {
      if (!phone && /exist|customer|hotline|support/i.test(f.label) && /\d/.test(f.value)) phone = f.value.trim();
    });
    if (!phone) {
      (e.facts || []).forEach(function (f) { if (!phone && /\d{3}/.test(f.value)) phone = f.value.trim(); });
    }
    (e.bullets || []).concat([e.answer || '']).forEach(function (b) {
      var m = String(b).match(/[\w.+-]+@[\w.-]+\.\w+/);
      if (!email && m) {
        // prefer the customer service address if the entry lists more than one
        if (/customerservice/i.test(m[0]) || !email) email = m[0];
      }
    });
    (e.bullets || []).forEach(function (b) {
      var m = String(b).match(/customerservice@[\w.-]+\.\w+/i);
      if (m) email = m[0];
    });
    return { entryId: e.id, entry: e, doc: best.doc, phone: phone, email: email, source: e.source };
  }

  function contactLine(index) {
    var c = index.contact;
    if (!c) return 'Contact RAKEZ to confirm.';
    var bits = [];
    if (c.phone) bits.push('call ' + c.phone);
    if (c.email) bits.push('email ' + c.email);
    return bits.length ? 'To confirm, ' + bits.join(' or ') + '.' : 'Contact RAKEZ to confirm.';
  }

  // The notes appended to an answer because of what the confidence flags say.
  function buildNotes(facts, index, lead) {
    var notes = lead ? [lead] : [];
    facts.forEach(function (f) {
      if (f.confidence === 'confirmed') return;
      if (f.confidence === 'varies' && f.disputed) {
        if (f.range) {
          notes.push('"' + f.label + '" is disputed: RAKEZ\'s own pages give different figures, so treat it as a range — ' +
            f.range + ' — not a single price.');
        } else {
          notes.push('"' + f.label + '" is disputed: RAKEZ\'s own pages do not agree, so both are quoted above rather than one picked as the answer.');
        }
      } else if (f.confidence === 'varies') {
        notes.push(f.figures && f.figures.length
          ? '"' + f.label + '" varies — the figure above is what the official source states, not a fixed number to rely on without checking it.'
          : '"' + f.label + '" varies by case — the official source says it depends, so it is not a fixed rule for you.');
      } else if (f.confidence === 'unconfirmed') {
        notes.push('"' + f.label + '" is not confirmed on an official RAKEZ page, so it is not stated here as fact.');
      }
    });
    if (notes.length > CFG.NOTE_MAX + (lead ? 1 : 0)) {
      notes = notes.slice(0, CFG.NOTE_MAX + (lead ? 1 : 0));
    }
    if (notes.length) notes.push(contactLine(index));
    return notes;
  }

  // ===========================================================================
  // 6. CHIPS
  // ===========================================================================

  var ACRONYMS = { rakez: 'RAKEZ', uae: 'UAE', vat: 'VAT', kyc: 'KYC', 'e-kyc': 'e-KYC',
    ekyc: 'e-KYC', id: 'ID', vip: 'VIP', noc: 'NOC', sme: 'SME', ded: 'DED',
    fta: 'FTA', moi: 'MOI', llc: 'LLC', fzllc: 'FZ-LLC', ejari: 'Ejari' };

  function sentence(s) {
    s = String(s || '').trim();
    if (!s) return s;
    s = s.replace(/[a-z0-9'\-]+/g, function (w) {
      if (w === 'i') return 'I';
      return ACRONYMS[w] || w;
    });
    var out = s.charAt(0).toUpperCase() + s.slice(1);
    if (!/[?.!]$/.test(out)) out += /^(what|how|when|where|which|who|why|can|do|does|is|are|should|will|could|would)\b/i.test(out) ? '?' : '';
    return out;
  }

  // Follow-ups resolved against the matcher, so a chip only offers something the
  // knowledge base can actually answer.
  function followUpChips(entry, index, context) {
    var chips = [];
    (entry.followUps || []).forEach(function (f) {
      if (chips.length >= CFG.CHIP_MAX) return;
      var r = rank(f, context);
      var top = r.candidates[0];
      // A chip that lands on the fallback is a dead end with a button on it. Drop it.
      if (!top || top.total < CFG.FLOOR) return;
      var resolved = top.entryId;
      if (resolved === entry.id && r.candidates[1] && r.candidates[1].total >= CFG.FLOOR) {
        resolved = r.candidates[1].entryId;   // don't loop a chip back to the same answer
      }
      chips.push({ label: sentence(f), value: f, entryId: resolved });
    });
    return chips;
  }

  function contactChip(index) {
    var c = index.contact;
    if (!c) return null;
    var q = (c.entry.questions && c.entry.questions[0]) || 'how do i contact rakez';
    return { label: sentence(q), value: q, entryId: c.entryId };
  }

  function hasChip(chips, entryId) {
    for (var i = 0; i < chips.length; i++) if (chips[i].entryId === entryId) return true;
    return false;
  }

  // ===========================================================================
  // 7. ANSWER BUILDERS
  // ===========================================================================

  // Is the winning entry actually answering what was typed, or just the nearest thing
  // in the same topic? If a chunk of the question is unexplained, the answer is still
  // given — never a dead end — but it says plainly that it is the closest match.
  function isPartial(cand) {
    if (!cand) return false;
    if (cand.outOfScope) return true;
    if (cand.predicateMiss) return true;
    if (cand.unknownWords && cand.unknownWords.length) return true;
    if (cand.unindexed && cand.unindexed.length) return true;
    return (cand.explained !== undefined && cand.explained < CFG.EXPLAINED_MIN);
  }

  // Everything about the question this entry cannot speak to, in the person's own
  // spelling, for quoting back to them.
  function unexplainedWords(cand) {
    return uniq([].concat(cand.unknownWords || []).concat(cand.unindexed || []));
  }

  function quoteList(words) {
    var q = words.map(function (w) { return '"' + w + '"'; });
    if (q.length === 1) return q[0];
    return q.slice(0, -1).join(', ') + ' or ' + q[q.length - 1];
  }

  // Says exactly which words of the question the knowledge base has nothing on, rather
  // than disowning an answer that is probably right.
  function partialNote(cand) {
    var missing = unexplainedWords(cand);
    if (missing.length) {
      return 'There is nothing in this knowledge base about ' + quoteList(missing.slice(0, 3)) +
        ', so that part of your question is not covered above.';
    }
    return 'That is the closest thing the knowledge base has to what you asked, rather than an exact answer to it.';
  }

  // ADDED 2026-09-11 (UX audit finding 1). A low-confidence answer has to LOOK
  // low-confidence. The old build buried "there is nothing in this knowledge base
  // about 'france'" as the third sentence, under a confident opening line, eleven
  // AED figures and a fact card — by the time the message settled, the hedge had
  // scrolled off the top of the screen and what the reader saw was a wall of
  // authoritative money.
  //
  // So the order is inverted: the uncertainty first, the route to a human second,
  // and the content offered as something to tap rather than rendered as an answer.
  // This is not "I don't know" and it is not a dead end — it names what it has, it
  // gives a real next step, and the entry is one tap away.
  function hedgeLead(cand, index, blind) {
    var bits = [];
    var missing = unexplainedWords(cand);
    if (blind && missing.length) {
      bits.push('I am not confident about this one. There is nothing in this knowledge base about ' +
        quoteList(missing.slice(0, 3)) + ', so I may have the wrong end of your question entirely.');
    } else if (blind) {
      bits.push('I am not confident about this one. That is the closest thing the knowledge base has ' +
        'to what you asked, rather than an answer to it.');
    } else {
      bits.push('I am not certain this is what you meant — it is the closest match I have, ' +
        'not a confident answer, so treat it that way.');
    }
    var c = index.contact;
    if (c) {
      bits.push('The route I would trust for this is RAKEZ themselves — ' +
        (c.phone ? c.phone : 'see the contact details below') +
        (c.email ? ' or ' + c.email : '') + '.');
    }
    bits.push(blind
      ? 'If "' + cand.title + '" is what you were after, tap it below and I will give you that in full.'
      : 'For what it is worth, here is "' + cand.title + '".');
    return bits.join(' ');
  }

  function answerFromEntry(cand, index, context, matchType) {
    matchType = matchType || 'strong';
    var entry = cand.doc.entry;
    var tentative = matchType === 'tentative';
    var partial = isPartial(cand);
    // Tentative AND partly about words the knowledge base has never seen: no fact
    // card, no bullets, no source line dressed up as provenance for an answer that
    // was never asked for. The entry becomes a chip instead.
    var blind = tentative && partial;

    var facts = blind ? [] : (entry.facts || []).map(analyseFact);
    var notes = blind ? [] : buildNotes(facts, index, (!tentative && partial) ? partialNote(cand) : null);
    var bullets = blind ? [] : annotateBullets(entry, index.disputes[entry.id]);
    var chips = followUpChips(entry, index, context);

    if (blind) {
      chips.unshift({
        label: entry.title,
        value: (entry.questions || [])[0] || entry.title,
        entryId: entry.id
      });
    }

    // Anything hedged, or only partly answered, gets a route to a human.
    if ((notes.length || partial || tentative) && index.contact && !hasChip(chips, index.contact.entryId)) {
      var cc = contactChip(index);
      if (cc) { if (chips.length >= CFG.CHIP_MAX) chips.pop(); chips.push(cc); }
    }
    if (chips.length > CFG.CHIP_MAX) chips = chips.slice(0, CFG.CHIP_MAX);

    var text;
    if (tentative) {
      text = hedgeLead(cand, index, blind);
      if (!blind) {
        text += '\n\n' + (entry.answer || '');
        if (notes.length) text += '\n\n' + notes.join(' ');
      }
    } else {
      text = entry.answer || '';
      if (notes.length) text += '\n\n' + notes.join(' ');
    }

    return {
      matchType: matchType,
      partial: !!partial,
      hedged: tentative,
      suppressed: blind,          // the fact card and bullets were deliberately withheld
      unexplained: unexplainedWords(cand),
      entryId: entry.id,
      title: entry.title,
      text: text,
      answer: tentative ? text : (entry.answer || ''),
      bullets: bullets,
      facts: facts,
      notes: notes,                 // already appended to `text`; separate for styling
      chips: chips,
      // No source line on a suppressed answer: a citation under a hedge reads as
      // provenance for something the engine did not actually assert.
      source: blind ? null : (entry.source || null),
      confidence: worstConfidence(facts),
      score: cand.total,
      personaId: (entry.persona && entry.persona[0]) || null
    };
  }

  function worstConfidence(facts) {
    var worst = 'confirmed';
    facts.forEach(function (f) {
      if (f.confidence === 'unconfirmed') worst = 'unconfirmed';
      else if (f.confidence === 'varies' && worst !== 'unconfirmed') worst = 'varies';
    });
    return worst;
  }

  function ambiguousAnswer(cands, index, context) {
    var options = cands.slice(0, CFG.AMBIG_MAX);
    var chips = options.map(function (c) {
      // The chip's value is the entry's own best-matching question, so clicking it
      // lands on that entry with a near-exact phrase match.
      var v = c.bestQuestion || (c.doc.entry.questions || [])[0] || c.title;
      return { label: c.doc.entry.title, value: v, entryId: c.entryId };
    });
    // FIXED 2026-09-11 — this used to ALSO return the three titles as
    // `bullets`, so the bubble listed the candidates as prose bullets and then
    // the very same three appeared immediately underneath as the numbered
    // options. The answer said everything twice. The options ARE the list; the
    // prose is only the question. `bullets` is deliberately empty here.
    var text = 'I can answer any of these — which one did you mean?';
    return {
      matchType: 'ambiguous',
      entryId: null,
      title: 'Did you mean',
      text: text,
      answer: text,
      bullets: [],
      facts: [],
      notes: [],
      chips: chips,
      candidates: options.map(function (c) { return { entryId: c.entryId, title: c.title, score: c.total }; }),
      source: null,
      confidence: 'confirmed',
      score: cands[0] ? cands[0].total : 0,
      personaId: null
    };
  }

  // Rule 2. Never "I don't know", never a dead end: say what it can do, offer the
  // nearest real entries, and hand over a real next step.
  function weakAnswer(rankResult, index, context) {
    // Only offer a nearest entry if it is at least in the right neighbourhood.
    // Otherwise the chips are noise and the persona routes are more use.
    var cands = rankResult.candidates.filter(function (c) { return c.total >= CFG.NEAR_MIN; }).slice(0, CFG.CHIP_MAX - 1);
    var areas = (index.personas || []).map(function (p) { return p.label; });

    var text = 'I can only answer from the RAKEZ knowledge base behind this demo, and I have not got a sourced answer to that one — so I am not going to guess at it.';
    if (areas.length) text += ' What I can cover: ' + areas.join(', ') + '.';

    var chips = cands.map(function (c) {
      var v = c.bestQuestion || (c.doc.entry.questions || [])[0] || c.title;
      return { label: c.doc.entry.title, value: v, entryId: c.entryId };
    });
    if (!chips.length) {
      chips = (index.personas || []).map(function (p) {
        return { label: p.label, value: p.id, entryId: null, personaId: p.id };
      });
    }

    var facts = [], source = null, bullets = [];
    if (index.contact) {
      var ce = index.contact.entry;
      facts = (ce.facts || []).map(analyseFact);
      bullets = (ce.bullets || []).slice(0, 4);
      source = ce.source || null;
      text += ' RAKEZ can answer it directly — ' + (index.contact.phone ? index.contact.phone : 'see the contact details below') +
              (index.contact.email ? ' or ' + index.contact.email : '') + '.';
      var cc = contactChip(index);
      if (cc && !hasChip(chips, cc.entryId)) chips.push(cc);
    }

    return {
      matchType: 'weak',
      entryId: null,
      title: 'Not in the knowledge base',
      text: text,
      answer: text,
      bullets: bullets,
      facts: facts,
      notes: [],
      chips: chips,
      nearest: rankResult.candidates.slice(0, 3).map(function (c) {
        return { entryId: c.entryId, title: c.title, score: c.total };
      }),
      source: source,
      confidence: 'confirmed',
      score: rankResult.candidates[0] ? rankResult.candidates[0].total : 0,
      personaId: null
    };
  }

  function personaAnswer(persona, index) {
    var chips = (persona.starters || []).slice(0, 4).map(function (s) {
      var r = rank(s, { persona: persona.id });
      var top = r.candidates[0];
      return { label: sentence(s), value: s, entryId: top && top.total >= CFG.FLOOR ? top.entryId : null };
    });
    return {
      matchType: 'persona',
      entryId: null,
      title: persona.label,
      text: (persona.blurb || '') + '\n\nWhat would you like to know about?',
      answer: persona.blurb || '',
      bullets: [],
      facts: [],
      notes: [],
      chips: chips,
      source: null,
      confidence: 'confirmed',
      score: 1,
      personaId: persona.id
    };
  }

  // A persona chip identifies itself exactly: its id, or its label as written. It is
  // NOT matched through the synonym layer — once "set up a business" collapses to
  // "setup company", a person typing "I want to register a company in Ras Al Khaimah"
  // would otherwise be handed the persona menu instead of an answer.
  function flatten(t) {
    return String(t == null ? '' : t).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function findPersona(index, text) {
    var key = flatten(text);
    if (!key) return null;
    for (var i = 0; i < index.personas.length; i++) {
      var p = index.personas[i];
      if (!p) continue;
      if (p.id === text) return p;
      if (key === flatten(p.id) || key === flatten(p.label)) return p;
    }
    return null;
  }

  function emptyAnswer(index) {
    var chips = (index.personas || []).map(function (p) {
      return { label: p.label, value: p.id, entryId: null, personaId: p.id };
    });
    return {
      matchType: 'persona',
      entryId: null,
      title: 'What can I help with?',
      text: 'Ask me anything about RAKEZ visas, licence renewals, setting up a company, or dealing with RAKEZ day to day. Every answer here comes from a fixed knowledge base with a source, so if something is not in it I will say so rather than guess.',
      answer: '',
      bullets: [],
      facts: [],
      notes: [],
      chips: chips,
      source: null,
      confidence: 'confirmed',
      score: 0,
      personaId: null
    };
  }

  function noKnowledge() {
    return {
      matchType: 'weak',
      entryId: null,
      title: 'Knowledge base not loaded',
      text: 'The knowledge base has not loaded, so I cannot answer anything yet. Reload the page, and if it keeps happening contact RAKEZ directly.',
      answer: '',
      bullets: [], facts: [], notes: [], chips: [],
      source: null, confidence: 'unconfirmed', score: 0, personaId: null
    };
  }

  // ===========================================================================
  // 8. PUBLIC API
  // ===========================================================================

  function ask(query, context) {
    var index = ensure();
    if (!index) return noKnowledge();
    context = context || {};

    var raw = String(query == null ? '' : query).trim();
    if (!raw) return emptyAnswer(index);

    // A persona chip from the opening screen.
    var persona = findPersona(index, raw);
    if (persona) return personaAnswer(persona, index);

    // A chip can name the entry outright; honour it without re-matching.
    if (context.entryId && index.byId[context.entryId]) {
      var doc = index.byId[context.entryId];
      return answerFromEntry({ doc: doc, entryId: doc.id, total: 1 }, index, context, 'strong');

  // Escapes anything that could have come from a person's keyboard before it
  // goes near innerHTML. Used on EVERY interpolated value below without
  // exception, including knowledge.json strings — a data file is still data.
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')

  // "01:39 PM" — the format Figma uses on every timestamp node.
  function fmtTime(ts) {

    var h = d.getHours();
    var m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
  }

    return host.replace(/^www\./i, '');
  }

  // ---------------------------------------------------------------------
  VKB.render.actions = function (m) {

    // so assistive tech had no way to read back that the vote registered. The
    // header speaker toggle already does this correctly; same pattern here.
    function btn(act, icon, label, cls, on, pressable) {
      return '<button type="button" class="msg__act ' + cls + (on ? ' is-on' : '') +
             '" data-act="' + act + '" data-id="' + id + '"' +
             (pressable ? ' aria-pressed="' + (on ? 'true' : 'false') + '"' : '') +
             ' aria-label="' + esc(label) + '" title="' + esc(label) + '">' + icon + '</button>';
    }
    return (
      '<div class="msg__meta">' +
        '<span class="msg__time">' + esc(fmtTime(m.ts)) + '</span>' +
        btn('like',       ic('thumbUp'),   'Helpful',          'msg__act--like',    m.vote === 'up',   true) +
        btn('dislike',    ic('thumbDown'), 'Not helpful',      'msg__act--dislike', m.vote === 'down', true) +
        btn('regenerate', ic('refresh'),   'Ask again',        'msg__act--again',   false, false) +
        btn('share',      ic('share'),     'Share conversation', 'msg__act--share', false, false) +
        btn('copy',       ic('copy'),      'Copy answer',      'msg__act--copy',    false, false) +
        // UX AUDIT finding 8 — copy fed back with ~1s of icon tint and nothing
        // else, which your thumb covers. The share dialog's "Link copied" is

        // screens.copiedFeedback() fills this in; it is empty the rest of the

        '<span class="msg__copied" role="status" aria-live="polite"></span>' +

  // followed by a 1px rule. Used for the persona choice, for engine
  // disambiguation, and for follow-ups — one treatment, three jobs.

  //   items : array of strings, or of { label, value }

  //             label  — the lead line. Pass null for no lead line.
  //                      Defaults to VKB.copy.optionsLabel.

  // Every row is  data-act="chip"  data-value="<the value>".
  // Persona rows carry the value  "persona:<id>"  so the orchestrator can tell
  // a persona pick from a typed question without a second interaction name.
  // ---------------------------------------------------------------------
  VKB.render.chips = function (items, opts) {

    opts = opts || {};
    var start = typeof opts.start === 'number' ? opts.start : 1;
    var label = Object.prototype.hasOwnProperty.call(opts, 'label')
      ? opts.label
      : VKB.copy.optionsLabel;

    var rows = '';

      var it = items[i];

  //

  // flattening them into "• " text would destroy the one thing CONTRACT.md

      var f = facts[i] || {};
      var conf = String(f.confidence || 'confirmed').toLowerCase();
      var note = '';
      if (conf === 'varies')      note = VKB.copy.noteVaries;
      if (conf === 'unconfirmed') note = VKB.copy.noteUnconfirmed;

            ? '<span class="msg__fact-note">' + ic('info') + '<span>' + esc(note) + '</span></span>'

  // render.message(m) — one message, from
  //   { who, text, bullets, facts, chips, source, id, ts, vote }

  // older one, so scrolling back shows the answers without a wall of stale,

  // ---------------------------------------------------------------------
  VKB.render.message = function (m, opts) {

    opts = opts || {};
    var showChips = opts.showChips !== false;
    var id = esc(m.id || '');

    // ---- user -----------------------------------------------------------
    if (m.who === 'user') {
      return (
        '<div class="msg msg--user" data-id="' + id + '">' +
          '<div class="msg__user-wrap">' +
            '<div class="msg__bubble">' + esc(m.text) + '</div>' +
            '<span class="msg__time">' + esc(fmtTime(m.ts)) + '</span>' +
          '</div>' +
        '</div>'
      );
    }

    // ---- assistant ------------------------------------------------------
    var body = '';

    // UX AUDIT finding 14 — a string `m.text` became exactly one <p>, however
    // many blank lines it contained. The disputed-price caution is written as a
    // second paragraph in knowledge.json and was reading as a continuation of
    // the price sentence. Blank lines now break paragraphs and a single
    // newline becomes a <br>, both after escaping.
    var paras = isArr(m.text) ? m.text : (m.text ? [m.text] : []);
    for (var p = 0; p < paras.length; p++) {

      for (var c = 0; c < chunks.length; c++) {
