/* ===== base.css ===== */
/* =========================================================================
   RAKEZ Video KYC — app.css
   Owner: Agent A. Plain CSS only. No preprocessor, no framework.

   Source of truth: Figma file DQdpkmPRGakXxi3IvCy9mj, section 75:2108.
   Values below were pulled live via get_design_context on:
     75:2114 (review)            74:315  (upload passport)
     75:877  (passport uploaded) 75:1048 (Emirates ID upload — complete step)
     75:5126 (success)
   on 2026-09-11. Where a node gave a sub-pixel value (e.g. 15.997px) it is
   rounded to the nearest whole pixel per instructions. Anything not
   derivable from those five nodes (camera overlay geometry, the two net-new
   screens) is called out in a comment at the point of use — see the build
   report for the full list.

   COLOUR DISCREPANCY (per CONTRACT.md / PRD §7.1): the Figma file uses BOTH
   #05A8A8 (review screen, success screen, T&C link) and #00ABAB (both
   buttons on the two upload/dropzone screens, 74:315 and 75:1048) for what
   is clearly meant to be the same brand teal. Standardised on #05A8A8
   everywhere per instructions — --mint below is #05A8A8, not #00ABAB.
   ========================================================================= */

/* ---------------------------------------------------------------------
   TOKENS
   --------------------------------------------------------------------- */
:root {
  /* Brand + neutrals — pulled from Figma "Colour styles" on the nodes above */
  --mint:        #05A8A8; /* Mint/100 — primary fill, links, active accents */
  --mint-dark:   #048f8f; /* DERIVED: not present in any pulled node (no hover/pressed
                              swatch exists in the file). ~12% darker than --mint for
                              :hover/:active on primary controls. */
  --white:       #FFFFFF; /* Neutral/0 */
  --n8:          #EBEBEB; /* Neutral/8  — borders, dividers, inactive stepper ring */
  --n20:         #CCCCCC; /* Neutral/20 — secondary borders, focus/hover accents */
  --n32:         #ADADAD; /* Neutral/32 — placeholder/helper text, inactive stepper text */
  --n52:         #7A7A7A; /* Neutral/52 — secondary labels, active stepper circle fill */
  --n72:         #474747; /* Neutral/72 — primary text */
  --surface:     #F5F5F5; /* Surface/grey — info card + dropzone fill */
  --dash:        #DDDDDD; /* Dropzone border colour, 2px dashed */
  --success-bg:  rgba(39, 190, 54, 0.12); /* pulled from 75:877 banner fill */
  --success-fg:  #27BE36;                 /* pulled from 75:877 banner text/check */
  --danger:      #FF3B30; /* "Colors/Red" — pulled from 75:877's style list (file-card delete) */
  --radius:      8px;     /* buttons, header buttons, cards, T&C box */
  --radius-lg:   12px;    /* dropzone, file card, "Completed" pill */

  /* Not in the original CONTRACT.md token list — added because the stepper's
     "complete" state and the success checklist's "Completed" pill both need
     them. PRD §7.3 guessed "mint ring with mint check" for the complete
     stepper state; the real pulled value is blue, not mint, and there is no
     check glyph — it's still the step number. Figma wins over the PRD's
     guess here.
     RECONCILIATION 2026-09-11: this is one finding confirmed independently
     from two sources on the same node (75:1048) — Agent A pulled it first
     and named it --info-bg/--info-fg; Agent B pulled it again for the
     CONTRACT.md addendum and named it --blue-12/--blue-100. Same colours,
     same node. --blue-100/--blue-12 are now the canonical names (matching
     CONTRACT.md and whatever Agent B's screens already reference);
     --info-bg/--info-fg are kept as aliases so nothing that already
     consumes them breaks. */
  --blue-100: #1EB0DD; /* Blue/100 — complete-step circle border / number */
  --blue-12:  #E4F5FB; /* Blue/12  — complete-step circle fill */
  --info-fg: var(--blue-100); /* alias — Agent A's original name for the same finding */
  --info-bg: var(--blue-12);  /* alias — Agent A's original name for the same finding */

  /* Type stacks. Roboto Condensed / Roboto load via <link> in index.html
     (orchestrator-owned) — real fallbacks only, no @import here. */
  --font-cond: 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-base: 'Roboto', system-ui, sans-serif;
  --font-num:  'Helvetica Neue', Arial, sans-serif; /* stepper digit, per PRD §7.2 */
}

/* ---------------------------------------------------------------------
   BASE / RESET
   --------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--white);
  color: var(--n72);
  font-family: var(--font-cond);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

/* No horizontal scroll anywhere except .step (see Stepper section) */
html, body { overflow-x: hidden; }

button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
ul, ol { margin: 0; padding: 0; list-style: none; }
p, h1, h2, h3 { margin: 0; }

:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
}

/* ---------------------------------------------------------------------
   LAYOUT — phone frame, screen body, main content well
   --------------------------------------------------------------------- */

/* Design canvas is 412×756. Build fluid: full width up to 480px, centred,
   412 as the reference scale (per CONTRACT.md Layout rules / PRD §9.4). */
.phone {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: var(--white);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Per-screen root the orchestrator mounts a render function's .html into,
   below the header/stepper it supplies. */
.screen {
  display: flex;
  flex-direction: column;
  flex: 1;
  width: 100%;
  background: var(--white);
}

/* Camera screens: no header, no padding, true full-bleed, 100dvh so mobile
   browser chrome never clips the shutter (CONTRACT.md Layout rules). */
.screen--fullbleed {
  flex: 1;
  width: 100%;
  height: 100dvh;
  padding: 0;
  position: relative;
  overflow: hidden;
  background: #000;
}

/* Main content well — PRD §7.3 "Main content": starts at y=60 (below the
   60px header), 32px top / 16px sides / 16–24px bottom, 24px gap between
   blocks. Confirmed by the 24px block gap seen on 75:2114 and 74:315. */
.main {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 32px 16px 24px;
}

/* DERIVED: not a literal Figma value — a denser variant of .main for screens
   that don't need the full 32px top breathing room (e.g. content stacked
   directly under a visible page title with no stepper above it, or a modal-
   like sub-screen). Reduces top padding only; everything else matches .main. */
.main--tight {
  padding-top: 16px;
}

/* ---------------------------------------------------------------------
   CHROME — header
   PRD §7.3 "Header": 412×60, white, 1px bottom border #EBEBEB,
   drop-shadow(0 4px 4px rgba(0,0,0,0.08)), padding 0 16px, gap 20px.
   Pulled again on every one of the 5 nodes fetched — identical across all.
   --------------------------------------------------------------------- */
.hdr {
  display: flex;
  align-items: center;
  gap: 20px;
  height: 60px;
  width: 100%;
  padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--n8);
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.08));
  position: sticky;
  top: 0;
  z-index: 20;
  flex-shrink: 0;
}

.hdr__btn {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  border: 1px solid var(--n8);
  border-radius: var(--radius);
}

.hdr__btn svg,
.hdr__btn img {
  width: 20px;
  height: 20px;
}

.hdr__title {
  flex: 1;
  min-width: 0;
  font: 500 20px/normal var(--font-base);
  color: var(--n72);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* S02 (75:2114) renders the title node with opacity 0 — space reserved,
   text invisible — rather than removing it, so header height never shifts. */
.hdr__title--hidden {
  opacity: 0;
}

/* ---------------------------------------------------------------------
   CHROME — stepper
   PRD §7.3 "Stepper": 60px row, 12px vertical padding, 32px gap, 1px bottom
   border #EBEBEB, horizontally scrollable — the one permitted scroller.
   Pulled from 74:315 (active/inactive) and 75:1048 (complete).
   --------------------------------------------------------------------- */
.step {
  display: flex;
  align-items: center;
  gap: 32px;
  height: 60px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--n8);
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
}
.step::-webkit-scrollbar { display: none; }

.step__item {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 200px;
  flex-shrink: 0;
}

.step__circle {
  width: 32px;
  height: 32px;
  border-radius: 50%; /* Figma uses radius 40 on a 32px box — 50% renders an
                          identical circle, not a value substitution. */
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font: 500 14px/20px var(--font-num);
}

.step__label {
  font: 500 14px/16px var(--font-cond);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Inactive — white circle, 1px #EBEBEB ring, #ADADAD number/label */
.step__circle.is-inactive,
.step__item.is-inactive .step__circle {
  background: var(--white);
  border: 1px solid var(--n8);
  color: var(--n32);
}
.step__label.is-inactive,
.step__item.is-inactive .step__label {
  color: var(--n32);
}

/* Active — #7A7A7A fill, white number, #474747 label */
.step__circle.is-active,
.step__item.is-active .step__circle {
  background: var(--n52);
  border: none;
  color: var(--white);
}
.step__label.is-active,
.step__item.is-active .step__label {
  color: var(--n72);
}

/* Complete — pulled live from 75:1048: Blue/12 fill, 1px Blue/100 border,
   Blue/100 number (still the digit, not a check glyph). Label stays #474747,
   same as active. See --info-bg/--info-fg comment above re: PRD vs Figma. */
.step__circle.is-complete,
.step__item.is-complete .step__circle {
  background: var(--blue-12);
  border: 1px solid var(--blue-100);
  color: var(--blue-100);
}
.step__label.is-complete,
.step__item.is-complete .step__label {
  color: var(--n72);
}

/* ---------------------------------------------------------------------
   CONTENT — title / subtitle
   PRD §7.2: title Roboto Condensed Medium 22px #474747; subtitle Roboto
   Condensed Regular 14px, line-height 1.5, letter-spacing -0.154px, #474747;
   upload-screen subtitle is Italic. Pulled again on 74:315 / 75:1048
   ("gap-[4px]" between title and subtitle).
   --------------------------------------------------------------------- */
.title {
  font: 500 22px/normal var(--font-cond);
  color: var(--n72);
  margin-bottom: 4px;
}

/* INTEGRATION FIX (orchestrator, 2026-09-11): `.title` is a wrapper div, so a
   bare <h1>/<h2> inside it was falling back to the UA default (2em bold) and
   rendering ~40px instead of the design's 22px. Verified in a real render, not
   assumed. Headings inside .title inherit the wrapper's type. */
.title > h1,
.title > h2,
.title > p:first-child {
  font: inherit;
  color: inherit;
  margin: 0;
}

.subtitle {
  font: 400 14px/1.5 var(--font-cond);
  letter-spacing: -0.154px;
  color: var(--n72);
}

.subtitle--italic {
  font-style: italic;
}

/* ---------------------------------------------------------------------
   CONTENT — info card (review screen, 75:2114)
   Card bg #F5F5F5, radius 8, padding ~16px (pulled 15.997px, rounded).
   Rows are 20px tall; pulled row top-offsets (0 / 27.5 / 55.5 / 83.5) give
   an exact 27.5px stride, i.e. 7.5px gap between 20px-tall rows — kept
   exact rather than rounded up to the PRD's approximate "28px apart".
   --------------------------------------------------------------------- */
.card {
  width: 100%;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 7.5px;
}

.card__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 20px;
}

.card__label {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 14px/20px var(--font-cond);
  letter-spacing: -0.1504px;
  color: var(--n72);
}

.card__value {
  font: 500 14px/20px var(--font-cond);
  letter-spacing: -0.1504px;
  color: var(--n72);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-left: 12px;
}

.card__icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ---------------------------------------------------------------------
   CONTENT — T&C box (75:2114)
   2px border #EBEBEB, radius 8, padding 12px, text 14px #474747, link mint
   underlined. Pulled text is leading-[16px] (not the 1.5 used by .subtitle).
   --------------------------------------------------------------------- */
.terms {
  width: 100%;
  border: 2px solid var(--n8);
  border-radius: var(--radius);
  padding: 12px;
  font: 500 14px/16px var(--font-cond);
  color: var(--n72);
}

.terms a {
  color: var(--mint);
  text-decoration: underline;
  text-underline-offset: 1px;
}

/* ---------------------------------------------------------------------
   BUTTONS
   PRD §7.3: Primary — fill mint, height 44, radius 8, padding 0 20, label
   16px white centred, full width. Secondary — white fill, 2px mint border,
   height 44, radius 8, label 16px mint centred, full width. Pulled on
   every node; both upload screens (74:315, 75:1048) render these in
   #00ABAB — standardised to --mint per the documented discrepancy.
   --------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius);
  font: 500 16px/16px var(--font-cond);
  text-align: center;
  border: none;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.btn--block {
  width: 100%;
  display: flex;
}

.btn--primary {
  background: var(--mint);
  color: var(--white);
}
.btn--primary:hover  { background: var(--mint-dark); }
.btn--primary:active { background: var(--mint-dark); }

.btn--secondary {
  background: var(--white);
  border: 2px solid var(--mint);
  color: var(--mint);
  padding: 0 18px; /* 20px minus the 2px border already pulled into height */
}
.btn--secondary:hover  { background: var(--surface); }

/* ---------------------------------------------------------------------
   UPLOAD — dropzone
   PRD §7.3: #F5F5F5, 2px dashed #DDDDDD, radius 12, padding 24, gap 24.
   Row of four 20px file-type icons, 8px gaps. Helper text centred, "OR"
   divider with 1px rules + 24px gaps either side. Pulled from 74:315 /
   75:1048 (both upload-copy screens render this identically).
   --------------------------------------------------------------------- */
.drop {
  width: 100%;
  background: var(--surface);
  border: 2px dashed var(--dash);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.drop__types {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.drop__types svg,
.drop__types img {
  width: 20px;
  height: 20px;
}

.drop__hint {
  width: 100%;
  text-align: center;
  font: 400 14px/normal var(--font-cond);
  color: var(--n32);
}

/* "OR" row: rule / label / rule, 24px gaps. Divider colour not explicitly
   named in the pulled node (it's an exported line asset, not a text-styled
   node) — DERIVED as --n8, matching every other hairline in the file. */
.drop__or {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 24px;
  font: 400 14px/normal var(--font-cond);
  color: var(--n32);
}
.drop__or::before,
.drop__or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--n8);
}

/* ---------------------------------------------------------------------
   UPLOAD — file card (75:877 "Passport uploaded")
   Pulled values: white bg, 2px border #EBEBEB (not the PRD's approximate
   1px), radius 12 (not 8 — matches the dropzone's --radius-lg, not the
   general --radius), padding 24px/12px. Filename is 16px (PRD said 14px;
   Figma's actual value is 16px and wins). Meta line 12px #ADADAD.
   --------------------------------------------------------------------- */
.filecard {
  width: 100%;
  background: var(--white);
  border: 2px solid var(--n8);
  border-radius: var(--radius-lg);
  padding: 24px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.filecard__name {
  font: 500 16px/normal var(--font-cond);
  color: var(--n72);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filecard__meta {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  font: 500 12px/21px var(--font-cond);
  color: var(--n32);
}

/* Delete icon slot — the pulled node shows a file-type icon here, not a
   trash glyph, but --danger (#FF3B30, "Colors/Red") is a colour style used
   elsewhere on this exact node, so it is the correct colour for the trash
   icon the contract calls for (icon asset itself is Agent D's). */
.filecard__del {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  color: var(--danger);
  cursor: pointer;
}

/* ---------------------------------------------------------------------
   FEEDBACK — success banner (75:877, 75:5126)
   Light green fill rgba(39,190,54,.12), radius 8, message left in
   #27BE36, dismiss/check icon right. Padding pulled as 12px/24px.
   --------------------------------------------------------------------- */
.banner {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-radius: var(--radius);
  padding: 12px 24px;
}

.banner--success {
  background: var(--success-bg);
  color: var(--success-fg);
}
.banner--success .banner {
  padding: 0;
}
.banner--success {
  font: 400 14px/normal var(--font-cond);
}

.banner__x {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  color: inherit;
  cursor: pointer;
}

/* ---------------------------------------------------------------------
   CAMERA OVERLAYS
   Not derivable from get_design_context on the happy-path nodes — these are
   photographic mockups in Figma. Originally built from PRD §7.3 "Camera
   overlay (document)" / "(face)": full-bleed video, dark scrim
   rgba(0,0,0,.55), a transparent cut-out (rect+brackets or oval), a dark
   translucent instruction pill, bottom controls.

   RECONCILED 2026-09-11 against Agent C's CONTRACT.md addendum, who pulled
   real numbers via get_design_context on 75:2485 / 55:3907 and
   get_screenshot on 75:2430 / 48:4546 (412×756 canvas) — their pulled
   values replace what were previously eyeballed guesses:
     - .cam__cut--rect is 348×245 (aspect ≈1.42), radius 16, centered.
     - .cam__cut--oval is 312×436 (aspect ≈0.7156) at left:50/top:160 of the
       412×756 canvas — which is exactly centered both ways (50+312+50=412,
       160+436+160=756), so the existing flex-center on .cam__scrim already
       places it correctly; only the size/aspect-ratio needed to change.
     - The captured-state pill (.cam__pill--ok) is genuinely
       flex-direction:column with a 24×24 green check *below* the text
       (10px gap), background rgba(255,255,255,0.16) — not the base pill's
       row layout / rgba(0,0,0,.55). Agent C sizes the 24px icon inline in
       their markup (`.card__icon` is fixed at 16px, wrong for this), so
       this stylesheet only needs to fix `.cam__pill--ok`'s own layout and
       background, not add an icon-size class.
   Bracket length/offset, the base (non-"ok") pill's position, and the
   bottom controls layout are still DERIVED — proportioned by eye — no live
   node covers them; comments below say so at each point.

   Technique: .cam__cut is the transparent window. Its box-shadow spread
   (0 0 0 9999px scrim-colour) IS the dark scrim — the only reliable
   CSS-only way to punch a genuinely see-through hole in an overlay without
   canvas/SVG masking two independently-sized elements in sync. .cam__scrim
   is therefore an inert full-bleed positioning wrapper (no fill of its
   own) that hosts .cam__cut centred within it; keep that nesting in the
   markup (.cam__scrim > .cam__cut > .cam__bracket × 4).
   --------------------------------------------------------------------- */
.cam {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 100dvh;
  overflow: hidden;
  background: #000;
}

.cam__video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Full-bleed wrapper — intentionally no background; see technique note above. */
.cam__scrim {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.cam__cut {
  position: relative;
  background: transparent;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); /* PRD §7.3 exact scrim value */
}

.cam__cut--rect {
  width: 84.5%;      /* 348 / 412 canvas width, pulled — see reconciliation note above */
  max-width: 348px;
  aspect-ratio: 348 / 245; /* pulled, ≈1.42 — was a derived 16/10.2 guess */
  border-radius: 16px;    /* pulled — was a derived 12px guess */
}

.cam__cut--oval {
  width: 75.7%;      /* 312 / 412 canvas width, pulled — see reconciliation note above */
  max-width: 312px;
  aspect-ratio: 312 / 436; /* pulled, ≈0.7156 — was a derived 3/4 (0.75) guess, close but not exact */
  border-radius: 50%;
  box-shadow:
    0 0 0 9999px rgba(0, 0, 0, 0.55),
    inset 0 0 0 3px rgba(255, 255, 255, 0.85);
}

.cam__cut--oval.is-captured {
  box-shadow:
    0 0 0 9999px rgba(0, 0, 0, 0.55),
    inset 0 0 0 3px var(--success-fg);
}

/* Corner brackets for the rectangular (document) cut-out — 4 elements in
   DOM order TL / TR / BL / BR, each an "L" made from two border sides. */
.cam__bracket {
  position: absolute;
  width: 28px;
  height: 28px;
  border: 3px solid var(--white);
  pointer-events: none;
}
.cam__bracket:nth-of-type(1) { /* top-left */
  top: -3px; left: -3px;
  border-right: none; border-bottom: none;
  border-top-left-radius: 8px;
}
.cam__bracket:nth-of-type(2) { /* top-right */
  top: -3px; right: -3px;
  border-left: none; border-bottom: none;
  border-top-right-radius: 8px;
}
.cam__bracket:nth-of-type(3) { /* bottom-left */
  bottom: -3px; left: -3px;
  border-right: none; border-top: none;
  border-bottom-left-radius: 8px;
}
.cam__bracket:nth-of-type(4) { /* bottom-right */
  bottom: -3px; right: -3px;
  border-left: none; border-top: none;
  border-bottom-right-radius: 8px;
}

.cam__cut.is-captured .cam__bracket {
  border-color: var(--success-fg);
}

/* Instruction pill — dark translucent, radius 8, 12px padding, white 14px
   centred (PRD §7.3). Position DERIVED (top, safe-area aware) — no live
   node covers the non-captured pill's exact placement. */
.cam__pill {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  max-width: calc(100% - 48px);
  background: rgba(0, 0, 0, 0.55);
  border-radius: var(--radius);
  padding: 12px;
  color: var(--white);
  font: 400 14px/1.4 var(--font-cond);
  text-align: center;
}

/* Captured state — pulled live by Agent C from 75:2485 / 55:3907: a column
   layout, text on top and a 24×24 green check below it (10px gap), on a
   frosted rgba(255,255,255,0.16) fill — not the base pill's dark row.
   Text colour is NOT recoloured (that was this file's earlier guess before
   the real data existed); the green comes from the check icon alone,
   which Agent C sizes inline in screens-camera.js. */
.cam__pill--ok {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.16);
}

/* Bottom controls — DERIVED layout (shutter/record button + label),
   safe-area aware per CONTRACT.md Layout rules. */
.cam__controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));
}

/* Document capture — 64px white circular shutter, PRD §7.3. */
.cam__shutter {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--white);
  border: 4px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
}
.cam__shutter:active {
  background: var(--n8);
}

/* Face capture — red circular record button; becomes a rounded square
   while recording (PRD §7.3 "Camera overlay (face)"). */
.cam__rec {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--danger);
  border: 4px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
  transition: border-radius 0.2s ease;
}

.cam__rec--stop {
  border-radius: 16px;
}
.cam__rec--stop::before {
  /* inner stop square, drawn with CSS only */
  content: '';
  display: block;
  width: 22px;
  height: 22px;
  margin: 17px auto 0;
  background: var(--white);
  border-radius: 3px;
}

.cam__label {
  color: var(--white);
  font: 500 14px/16px var(--font-cond);
  text-align: center;
}

.cam__timer {
  color: var(--white);
  font: 500 16px/20px var(--font-cond);
  font-variant-numeric: tabular-nums;
  text-align: center;
  letter-spacing: 0.5px;
}

/* ---------------------------------------------------------------------
   FILE-PICKER MOCK (S04, S07b) — Android's own native picker,
   fullbleed:true, own top bar, no app header/stepper.
   Added by Agent B to CONTRACT.md 2026-09-11.

   get_design_context on nodes 75:2514 / 75:2823 returns unrelated stale
   layer content (a "Visa package" form from a different flow entirely) —
   CONTRACT.md's own audit already flagged this: "layer metadata is
   misleading; the render is authoritative." Confirmed directly with
   get_screenshot on both node IDs on 2026-09-11: both render pixel-
   identical to Android's stock "Recent files" document picker (a status
   bar, a Files app bar, filter chips, an app-shortcut row, a file list
   with red PDF badges). There are no real design tokens to pull for OS
   chrome that isn't part of the RAKEZ file at all, so this section is
   built from that screenshot, deliberately in Android's own Material
   idiom (system font, Material grey palette) rather than RAKEZ's —
   per the coordinator's brief, that's intentional, not an oversight.
   Colours are plain hex (not RAKEZ tokens) except the PDF badge, which
   reuses --danger since it's close enough to Android's red and adding a
   near-duplicate red token isn't warranted.
   --------------------------------------------------------------------- */
.filepicker {
  width: 100%;
  min-height: 100dvh;
  background: var(--white);
  display: flex;
  flex-direction: column;
  font-family: var(--font-base); /* Android chrome reads as plain Roboto, not condensed */
  color: #202124;
}

/* App bar: hamburger — title — search/overflow. No separate class exists
   for the OS status bar (time/signal/battery) — the contract only names
   .filepicker__bar, and faking that chrome would just duplicate whatever
   status bar the real device or browser already shows above the page, so
   this mock starts at the app bar, matching the mock's dominant visual
   weight in the screenshot. */
.filepicker__bar {
  display: flex;
  align-items: center;
  height: 56px;
  padding: 0 16px;
  gap: 24px;
  flex-shrink: 0;
}

.filepicker__menu {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.filepicker__title {
  flex: 1;
  min-width: 0;
  font: 500 22px/normal var(--font-base);
  color: #202124;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filepicker__tools {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-shrink: 0;
}
.filepicker__tools img,
.filepicker__tools svg {
  width: 24px;
  height: 24px;
}

/* Filter chips row — clipped, not scrollable (matches the mock, where the
   4th chip is only partly visible as a "there's more" hint). */
.filepicker__tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  overflow: hidden;
  flex-shrink: 0;
}

.filepicker__tab {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid #CCCCCC;
  background: var(--white);
  font: 400 14px var(--font-base);
  color: #202124;
  white-space: nowrap;
  flex-shrink: 0;
}
.filepicker__tab img,
.filepicker__tab svg {
  width: 16px;
  height: 16px;
}

.filepicker__tab--active {
  background: var(--blue-12);
  border-color: var(--blue-12);
  color: var(--blue-100);
}

.filepicker__moretab {
  width: 20px;
  flex-shrink: 0;
  overflow: hidden;
}

.filepicker__section-label {
  padding: 16px 16px 8px;
  font: 500 12px/normal var(--font-base);
  letter-spacing: 0.5px;
  color: var(--n52);
  text-transform: uppercase;
}

.filepicker__apps {
  display: flex;
  gap: 32px;
  padding: 0 16px 16px;
  flex-shrink: 0;
}

.filepicker__app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 64px;
}

.filepicker__app-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--surface);
  flex-shrink: 0;
}
.filepicker__app-icon img,
.filepicker__app-icon svg {
  width: 24px;
  height: 24px;
}

.filepicker__app-label {
  font: 400 12px/1.3 var(--font-base);
  color: #202124;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

.filepicker__files-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  flex-shrink: 0;
}
.filepicker__files-head img,
.filepicker__files-head svg {
  width: 20px;
  height: 20px;
}

.filepicker__list {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.filepicker__row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--n8);
}

.filepicker__badge {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 4px;
  background: var(--danger); /* close approximation of Android's PDF red — reusing the existing token rather than adding a near-duplicate */
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 9px var(--font-base);
}

.filepicker__row-name {
  font: 400 14px/1.3 var(--font-base);
  color: #202124;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filepicker__row-meta {
  font: 400 12px/1.4 var(--font-base);
  color: var(--n52);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* =====================================================================
   INTEGRATION PASS (orchestrator, 2026-09-11)
   Fixes found by walking the built prototype in a real browser and
   comparing against the Figma renders. Each one is a verified difference,
   not a preference.
   ===================================================================== */

/* S01 (email) and S04/S07b (file picker) are fullbleed — no app header — but
   unlike the camera screens they are TALLER than the viewport and must scroll.
   `.screen--fullbleed` clips at 100dvh with a black ground, which is right for
   a camera and wrong for these: the email footer was being cut off mid-line. */
.screen--doc {
  height: auto;
  min-height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--white);
}

/* Figma pins the call to action to the bottom of the 756px screen on S02, S05,
   S08, S16 and S17 (the main column is justify-between on those nodes), not
   directly under the content. Pull only the trailing element down so the
   blocks above keep their 24px rhythm. */
.main--spread > .btn:last-child,
.main--spread > .terms {
  margin-top: auto;
}

/* When the terms box and the button travel together, Figma's gap between the
   two is 16px, not the column's 24px. -8px nets exactly 16. */
.main--spread > .terms + .btn:last-child {
  margin-top: -8px;
}

/* The success mark on 75:5126 is the brand teal, and each completed row's
   check is the success green. Both were inheriting body colour and rendering
   near-black. */
.done__icon {
  color: var(--mint);
}

.done__item .card__icon {
  color: var(--success-fg);
}

.enddemo .done__icon {
  color: var(--mint);
}


/* =====================================================================
   RECORDING COUNTDOWN — added 2026-09-11 (Francis)
   The clip auto-captures over a fixed 3 seconds. The ring drains, the
   number counts down, and there is no Stop control to find. Net-new
   against Figma, built from the same tokens.
   ===================================================================== */

.cam__ring {
  position: relative;
  width: 80px;
  height: 80px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.cam__ring-svg {
  position: absolute;
  inset: 0;
  width: 80px;
  height: 80px;
  transform: rotate(-90deg);
}

.cam__ring-track,
.cam__ring-bar {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
}

.cam__ring-track { stroke: rgba(255, 255, 255, 0.28); }

.cam__ring-bar {
  stroke: var(--danger);
  stroke-dasharray: 226.19;   /* 2 * pi * r, r = 36 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.1s linear;
}

.cam__ring-dot {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

.cam__count {
  position: relative;
  z-index: 1;
  font: 500 26px/1 var(--font-cond);
  font-variant-numeric: tabular-nums;
  color: var(--white);
}

@media (prefers-reduced-motion: reduce) {
  .cam__ring-bar { transition: none; }
}

  font: 400 11px/1.45 var(--font-cond);
  text-align: center;
  flex-shrink: 0;
}

.disclaimer b {
  font-weight: 500;
  color: var(--n52);
}

     586:7291  Share conversation dialog

   Blocks marked  === NET-NEW ===  have NO Figma reference. They are design

/* ---------------------------------------------------------------------
   TOKENS — chat-scoped only.
   These four hexes appear in the chat nodes and in NO base.css token, so
   they are added here rather than in the frozen file. All four verified on
   586:1751 / 586:1948 / 586:2632 / 586:7291.
   --------------------------------------------------------------------- */
:root {
  --chat-meta:        #717182; /* timestamp text, 11px — 586:1751 node 586:1800 */
  --chat-avatar:      #959595; /* assistant avatar circle fill — 586:1786 / 586:1841 */
  --chat-placeholder: #CBCED4; /* composer placeholder — 586:1864 */
  --chat-dialogline:  #D9D9D9; /* share-dialog outer border — 586:7291 */
  --chat-link-bg:     #EFFBFF; /* share "Copy link" circle fill — 586:7337
                                  (paired with --blue-100 #1EB0DD, already in base) */

  /* NET-NEW: no Figma source. Tint of --mint for the recording state, and a
     neutral for the "check this with RAKEZ" confidence note. */
  --chat-rec-bg:      rgba(5, 168, 168, 0.08);
  --chat-rec-fg:      var(--mint);
}


/* ---------------------------------------------------------------------
   SHELL
   .chat is the whole screen: header (base .hdr) + scrolling list + pinned
   dock. It sets its own 100dvh so the list scrolls and the dock stays put
   regardless of what .phone does above it.
   --------------------------------------------------------------------- */
.chat {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100dvh;
  min-height: 0;
  background: var(--white);
  overflow: hidden;
}

/* Header. Geometry is base .hdr verbatim (60px, white, 1px #EBEBEB bottom,
   drop-shadow 0 4px 4px rgba(0,0,0,.08), 0 16px) — confirmed identical on
   all five chat nodes. Only the internal arrangement differs from the KYC
   header, so only that is set here. */
.chat__hdr {
  gap: 8px;
  justify-content: space-between;
}

.chat__brand {
  display: flex;
  align-items: center;
  gap: 8px;           /* 586:1840 */
  min-width: 0;
  flex: 1;
}

/* 36px circle, #959595, 18px glyph — 586:1841 / 586:1842 */
.chat__brand-avatar {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--chat-avatar);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat__brand-avatar svg { width: 18px; height: 18px; }

/* Roboto Medium 20px #474747, ellipsised — 586:1849 */
.chat__brand-name {
  font: 500 20px/normal var(--font-base);
  color: var(--n72);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.chat__hdr-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* === NET-NEW === the speaker toggle's "on" state.
   Figma's header has exactly ONE 40px button (an X, 586:1852). There is no
   audio anywhere in the design, so the speaker toggle and its active state
   are invented here. Geometry is the real .hdr__btn from base.css; only the
   on-state fill is new. */
.chat__hdr-btn.is-on {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--white);
}


/* ---------------------------------------------------------------------
   MESSAGE LIST
   586:1752 — column, px 16 / py 32, width 412. The list scrolls; it is the
   only vertical scroller on the screen.
   --------------------------------------------------------------------- */
.chat__list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 32px 16px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* py-[20px] per message — 586:1785 (first: pb only), 586:1809, 586:1815 */
.msg { padding: 20px 0; width: 100%; }
.msg:first-child { padding-top: 0; }
.msg:last-child  { padding-bottom: 0; }

/* -------- assistant message -------- */
.msg--bot {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

/* 32px circle, #959595, 16px glyph — 586:1786 / 586:1787 */
.msg__avatar {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--chat-avatar);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
}

.msg__avatar svg { width: 16px; height: 16px; }

/* 340px in the 412 frame; fluid here. gap 6px — 586:1794 */
.msg__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

/* Roboto Condensed 14/21 #474747 — every text node in every chat frame */
.msg__text {
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
  width: 100%;
  word-break: break-word;
}

.msg__text + .msg__text { margin-top: 21px; }

/* Bulleted answer — 586:1827: a real <ul> with list-disc, 21px indent,
   same 14/21 type as the prose above it. */
.msg__bullets {
  list-style: disc;
  padding-left: 21px;
  margin: 0;
  width: 100%;
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
}

.msg__bullets li { word-break: break-word; }

/* -------- user message -------- */
.msg--user {
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
}

.msg__user-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;            /* 586:1810 */
  max-width: 100%;
}

/* #EBEBEB, 14px/10px padding, radius 12 on TL/TR/BL and 0 on BR (the tail) —
   586:1811. Design pins the bubble to 261px; fluid here with 261 as the cap. */
.msg__bubble {
  background: var(--n8);
  border-radius: 12px 12px 0 12px;
  padding: 10px 14px;
  max-width: min(261px, 80%);
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
  word-break: break-word;
}

/* -------- meta + action row -------- */
/* gap 8px, items centred — 586:1798 / 586:2684 / 586:7437 */
.msg__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  width: 100%;
}

/* Roboto Condensed 11/16.5 #717182 — 586:1800, 586:1814 */
.msg__time {
  font: 400 11px/16.5px var(--font-cond);
  color: var(--chat-meta);
  white-space: nowrap;
}

.msg--user .msg__time { text-align: right; }

/* Action buttons. Figma gives like/dislike a 4px radius + 3px padding around
   a 12px glyph (586:1801/586:1802) and renders refresh / share / copy as bare
   18px glyphs (586:1892/586:1894/586:1896). Reproduced exactly; the hit area
   is padded out to 28px so a thumb can actually hit a 12px target, which the
   design does not account for. */
.msg__act {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--n52);
  border-radius: 4px;
  padding: 3px;
  min-width: 28px;
  min-height: 28px;
  flex-shrink: 0;
}

.msg__act svg { width: 18px; height: 18px; }

/* like / dislike are the 12px pair */
.msg__act--like svg,
.msg__act--dislike svg { width: 12px; height: 12px; }

.msg__act:hover { color: var(--n72); }

/* === NET-NEW === pressed state for like/dislike. The design has no selected
   state for these; without one, tapping a thumb does nothing visible. */
.msg__act.is-on { color: var(--mint); }


/* ---------------------------------------------------------------------
   === NET-NEW ===  FACTS BLOCK  (facts: [{label, value, confidence}])

   NO FIGMA REFERENCE. Node 586:2632 — the one the brief calls "the full
   structured answer: an overview block of labelled facts, then a required-
   documents block" — is NOT a card in Figma. It is plain 14/21 prose in the
   ordinary bot bubble: an emoji heading line ("🇦🇪 UAE Tourist Visa
   Overview:"), then lines that literally begin with a "•" character, a blank
   line, "Required Documents:", more "•" lines. There is no fill, no border,
   no label column, no radius. Verified twice in the pulled layer tree.

   knowledge.json, however, carries real {label, value, confidence} triples,
   and rendering those as pseudo-bullets would throw away the structure and
   make the confidence flag impossible to show. So this block is invented,
   built from base.css's own card language (--surface fill, --radius-lg,
   label in --n52, value in --n72) so it still reads as RAKEZ. It is a
   deliberate departure from 586:2632 and needs a designer's eye.
   --------------------------------------------------------------------- */
.msg__facts {
  width: 100%;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg__facts-head {
  font: 500 12px/16px var(--font-cond);
  color: var(--n52);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.msg__fact {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.msg__fact + .msg__fact {
  border-top: 1px solid var(--n8);
  padding-top: 10px;
}

.msg__fact-label {
  font: 400 11px/16.5px var(--font-cond);
  color: var(--n52);
}

.msg__fact-value {
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
  word-break: break-word;
}

/* === NET-NEW === confidence marking.
   CONTRACT.md §"How the assistant answers" rule 3 requires `varies` and
   `unconfirmed` to be visibly distinguished. The brief is explicit that this
   must be a small muted note, not a red warning — so: no --danger, no icon
   fill, no bold. A 16px info glyph and one line of --n52 italic text, which
   sits quieter than the fact it qualifies. */
.msg__fact-note {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-top: 3px;
  font: 400 11px/16.5px var(--font-cond);
  font-style: italic;
  color: var(--n52);
}

.msg__fact-note svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--n32);
}

/* A fact that could not be verified is dimmed as well as annotated, so the
   eye does not read it as a confirmed number. */
.msg__fact--unconfirmed .msg__fact-value { color: var(--n52); }


/* ---------------------------------------------------------------------
   === NET-NEW ===  SOURCE LINE
   No Figma reference — the design shows no attribution anywhere. Required by
   CONTRACT.md (every knowledge.json entry carries a source URL and the
   assistant must not assert without one). Deliberately the quietest text on
   the screen: 11px, --n32.
   --------------------------------------------------------------------- */
.msg__source {
  font: 400 11px/16.5px var(--font-cond);
  color: var(--n32);
  word-break: break-word;
}


/* ---------------------------------------------------------------------
   TYPING INDICATOR — 586:7460 / 586:7469
   The bot row switches to items-center / justify-center and the text block is
   replaced by a 340×6 container. That container is a flattened SVG in the
   layer tree, so the dot geometry came from get_screenshot of 586:7469:
   three ~6px dark dots, ~4px apart, left-aligned. The pulse animation itself
   is NET-NEW — a still PNG cannot carry motion, and a static row of dots
   would not read as "in progress".
   --------------------------------------------------------------------- */
.msg--typing {
  display: flex;
  gap: 8px;
  align-items: center;
}

.chat__typing {
  height: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
}

.chat__typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--n72);
  animation: chat-typing 1.25s ease-in-out infinite;
}

.chat__typing span:nth-child(2) { animation-delay: 0.18s; }
.chat__typing span:nth-child(3) { animation-delay: 0.36s; }

@keyframes chat-typing {
  0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
  30%           { opacity: 1;    transform: translateY(-2px); }
}


/* ---------------------------------------------------------------------
   OPTION LIST ("chips")
   586:1948 / 586:2067 — this is the design's option treatment and it is NOT
   a row of pills. It is a labelled, numbered, divided list that lives inside
   the composer container, above the input:

     container  gap 20px
     label      "What would you like to know about?" 14/21 #474747
     list       column, gap 12px
     row        gap 12px, 22px numbered circle + 14/21 label
     number     Roboto Medium 9.226px #474747, centred in the circle
     divider    1px full-bleed rule after every row (380px in the 412 frame)

   The circle fill and the divider colour are the one guess in this block:
   both are flattened SVGs in the layer tree (imgEllipse244, imgVector1) so no
   hex came back. Read off the 586:1948 screenshot as light neutral grey and
   mapped to --n8, which is the base token for exactly that job.
   --------------------------------------------------------------------- */
.opts {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.opts__label {
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
  width: 100%;
}

.opts__list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 0;
  min-height: 28px;
}

.opt__num {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--n8);
  color: var(--n72);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 500 9.226px/1 var(--font-base);
}

.opt__label {
  font: 400 14px/21px var(--font-cond);
  color: var(--n72);
  min-width: 0;
  word-break: break-word;
}

.opt:hover .opt__label { color: var(--mint); }

/* The divider after every row, including the last — 586:2097 / 586:2126 */
.opt__rule {
  height: 1px;
  width: 100%;
  background: var(--n8);
  flex-shrink: 0;
}

/* When an option list is rendered inline under a bot message rather than in
   the dock, it aligns to the message text, not to the avatar. */
.msg__body > .opts { margin-top: 6px; }


/* ---------------------------------------------------------------------
   COMPOSER DOCK
   586:1860 / 586:2067 — white, drop-shadow 0 -4px 10px rgba(0,0,0,.12),
   px 16, pt 12, pb 16, gap 20 when an option list is present. Pinned to the
   bottom; safe-area inset added on top of the design's 16px bottom padding.
   --------------------------------------------------------------------- */
.chat__dock {
  flex-shrink: 0;
  width: 100%;
  background: var(--white);
  padding: 12px 16px 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
  filter: drop-shadow(0 -4px 10px rgba(0, 0, 0, 0.12));
  z-index: 10;
}

/* An option list in the dock can be long; cap it and let it scroll rather
   than eat the message list. NET-NEW — the design only ever shows four. */
.chat__dock > .opts {
  max-height: 40dvh;
  overflow-y: auto;
  overscroll-behavior-y: contain;
}

/* Input row — 586:1861: height 44, gap 10, items-end */
.chat__row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  width: 100%;
}

.chat__row[hidden] { display: none; }

/* 586:1862 — white, 1px border, radius 8, height 44, padding 11px/15px.
   Border colour differs between nodes: #EBEBEB on 586:1948 / 586:2632 /
   586:7385 (resting) and #ADADAD on 586:1751 (the greeting frame, where the
   composer is the thing being pointed at). Read as resting vs focus and
   built that way. */
.chat__input {
  flex: 1;
  min-width: 0;
  height: 44px;
  background: var(--white);
  border: 1px solid var(--n8);
  border-radius: var(--radius);
  padding: 11px 15px;
  font: 400 14px/normal var(--font-cond);
  color: var(--n72);
  -webkit-appearance: none;
  appearance: none;
}

.chat__input::placeholder { color: var(--chat-placeholder); }

.chat__input:focus {
  outline: none;
  border-color: var(--n32);
}

/* 586:1865 — 44×44, --mint, radius 8, 18px white glyph */
.chat__send {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: var(--mint);
  border-radius: var(--radius);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat__send svg { width: 18px; height: 18px; }
.chat__send:hover  { background: var(--mint-dark); }
.chat__send:active { background: var(--mint-dark); }


/* =====================================================================
   === NET-NEW ===  VOICE UI
   THE FIGMA DESIGN HAS NO AUDIO INPUT AT ALL. Not a mic, not a waveform,
   not a recording state — nothing. Francis asked for dictation on
   2026-09-11 (CONTRACT.md §"Voice — net-new, not in Figma"). Everything
   from here to the end of this block is a design decision made in this
   file, in the RAKEZ brand theme, and has NOT been through design review.

   The rule followed throughout: borrow geometry that already exists in the
   design rather than invent new shapes. The mic button is the send button's
   44×44 footprint in secondary dress; the recording panel is the composer
   input's 44px-tall, radius-8 footprint tinted with --mint; the stop control
   is the send button with a square instead of a plane. Agent K3 (voice.js)
   drives the canvas pixels and the timer text — this file only decides how
   they look and how much room they get.
   ===================================================================== */

/* Mic button. Same 44×44 / radius 8 as .chat__send, dressed as base.css's
   secondary button (white, --n8 border, muted glyph) so the teal send button
   stays the one primary action in the row. */
.chat__mic {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: var(--white);
  border: 1px solid var(--n8);
  border-radius: var(--radius);
  color: var(--n52);
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat__mic svg { width: 20px; height: 20px; }
.chat__mic:hover { border-color: var(--n20); color: var(--n72); }

/* Live state, in case the mic button stays mounted while recording. */
.chat__mic.is-live {
  background: var(--chat-rec-bg);
  border-color: var(--mint);
  color: var(--mint);
}

/* The recording panel. Swaps in where .chat__row was. Agent K3 toggles the
   `hidden` attribute on this and on .chat__row. */
.chat__voice {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  background: var(--chat-rec-bg);
  border: 1px solid var(--mint);
  border-radius: var(--radius);
  padding: 6px 8px 6px 12px;
}

.chat__voice[hidden] { display: none; }

/* A live pulsing dot, so "we are listening" reads even before a sound is
   made and the waveform is flat. Honest: it says recording is on, it does
   not pretend to be audio. */
.chat__voice-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--mint);
  flex-shrink: 0;
  animation: chat-rec 1.4s ease-in-out infinite;
}

@keyframes chat-rec {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.25; }
}

/* The waveform canvas. Given the room, but no painted background and no
   fallback animation — CONTRACT.md hard rule 3 says the visualiser responds
   to the microphone or it does not ship, so an empty canvas must look empty.
   Agent K3 owns the drawing; width/height attributes are set in JS from the
   measured box so the bitmap matches the CSS box at devicePixelRatio. */
.chat__wave {
  flex: 1;
  min-width: 0;
  height: 28px;
  display: block;
}

/* Elapsed timer. Tabular so the digits do not jitter as seconds tick. */
.chat__voice-time {
  font: 500 12px/16px var(--font-num);
  font-variant-numeric: tabular-nums;
  color: var(--mint);
  flex-shrink: 0;
  min-width: 38px;
  text-align: right;
}

.chat__voice-btn {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat__voice-btn svg { width: 16px; height: 16px; }

/* Cancel — discard, so it is the quiet one. */
.chat__voice-btn--cancel {
  background: var(--white);
  border: 1px solid var(--n8);
  color: var(--n52);
}

.chat__voice-btn--cancel:hover { color: var(--n72); border-color: var(--n20); }

/* Stop and send — the primary action, so it takes the mint. It stops the
   recording and puts the transcript in the input; it does not send. */
.chat__voice-btn--stop {
  background: var(--mint);
  color: var(--white);
}

.chat__voice-btn--stop:hover { background: var(--mint-dark); }

/* One line under the panel for whatever K3 needs to say — "listening…",
   the interim transcript, or "dictation isn't available on this browser —
   type your question instead". Never a dead end (hard rule 2). */
.chat__voice-hint {
  width: 100%;
  font: 400 11px/16.5px var(--font-cond);
  color: var(--n52);
  padding: 0 2px;
}

.chat__voice-hint[hidden] { display: none; }

/* The dock's 20px gap is the design's spacing between the option list and the
   input (586:2067). The hint belongs to the panel above it, not to the dock,
   so it is pulled back in. */
.chat__voice + .chat__voice-hint { margin-top: -12px; }

/* ===================================================================== */
/* =============== end NET-NEW voice UI ================================ */


/* ---------------------------------------------------------------------
   DEMO DISCLAIMER
   base.css .disclaimer is used as-is; it is only re-positioned into the dock
   so the composer genuinely sits at the bottom of the viewport. Scoped, not
   redefined — the base rule is untouched.
   --------------------------------------------------------------------- */
.chat__dock .disclaimer {
  padding: 0;
  border-top: none;
  text-align: left;
  font-size: 10px;
  /* Sits closer to the composer than the dock's 20px design gap — it is a
     footnote to the screen, not a peer of the input row. */
  margin-top: -12px;
}


/* ---------------------------------------------------------------------
   SHARE CONVERSATION DIALOG — 586:7291 (default) / 586:7347 (copied)

   Card:    white, 1px #D9D9D9, radius 12
   Header:  px 16 / py 20, 1px #EBEBEB bottom, title Roboto Condensed Medium
            20px #474747, 12px X on the right
   Body:    p 16, column, gap 20, centred
            lead 14/16 #474747
            circle 60px:  default  #EFFBFF fill, 2px #1EB0DD border, 24px link
                          copied   #1EB0DD fill, white 24px check
            label Roboto Condensed Medium 12/16 #474747, centred
                          default  "Copy link"    copied  "Link copied"
   Footer:  p 16, 1px #EBEBEB top, full-width 44px mint button, radius 8,
            Roboto Condensed Medium 16px white, "Close"

   The dialog's own Close button is #00ABAB in Figma while every other mint
   surface in the file is #05A8A8. base.css already standardised on #05A8A8
   (its header comment says so explicitly), so --mint is used here and the
   one-hex difference is dropped on purpose.

   The scrim behind the card is NET-NEW — 586:7291 is an isolated component
   with no backdrop in the file.
   --------------------------------------------------------------------- */
.share {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(0, 0, 0, 0.45);  /* NET-NEW */
}

.share__card {
  width: 100%;
  max-width: 380px;
  background: var(--white);
  border: 1px solid var(--chat-dialogline);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  max-height: calc(100dvh - 32px);
  overflow: hidden;
}

.share__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 20px 16px;
  border-bottom: 1px solid var(--n8);
}

.share__title {
  font: 500 20px/normal var(--font-cond);
  color: var(--n72);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.share__x {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  color: var(--n72);
  display: flex;
  align-items: center;
  justify-content: center;
  /* 12px is the Figma hit target; padded out for thumbs without moving the
     glyph. NET-NEW, accessibility only. */
  padding: 8px;
  margin: -8px;
  box-sizing: content-box;
}

.share__x svg { width: 12px; height: 12px; }

.share__body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  overflow-y: auto;
}

.share__lead {
  width: 100%;
  font: 400 14px/16px var(--font-cond);
  color: var(--n72);
}

.share__action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.share__circle {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--chat-link-bg);
  border: 2px solid var(--blue-100);
  color: var(--blue-100);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
}

.share__circle svg { width: 24px; height: 24px; }

/* "Link copied" state — 586:7360 / 586:7375 */
.share__circle.is-copied {
  background: var(--blue-100);
  border-color: var(--blue-100);
  color: var(--white);
}

.share__label {
  width: 100%;
  text-align: center;
  font: 500 12px/16px var(--font-cond);
  color: var(--n72);
}

/* === NET-NEW === the link itself.
   586:7291 says "Copy the link below to share this conversation." but no link
   is drawn anywhere in either frame — the copy refers to something that is
   not in the design. Showing the URL is the honest reading of that sentence.
   Muted, ellipsised, not interactive. */
.share__url {
  width: 100%;
  font: 400 11px/16.5px var(--font-cond);
  color: var(--n32);
  text-align: center;
  word-break: break-all;
}

.share__foot {
  padding: 16px;
  border-top: 1px solid var(--n8);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* The footer button is base .btn .btn--primary .btn--block; only the exact
   44px height and 16px Condensed Medium label from 586:7315 are pinned. */
.share__close {
  height: 44px;
  font: 500 16px/normal var(--font-cond);
}


/* ---------------------------------------------------------------------
   SMALL SCREENS — no horizontal scroll from 320px up.
   --------------------------------------------------------------------- */
@media (max-width: 359px) {
  .chat__list { padding: 24px 12px; }
  .chat__dock { padding-left: 12px; padding-right: 12px; }
  .chat__brand-name { font-size: 18px; }
  .msg__bubble { max-width: 84%; }
  .chat__voice { gap: 8px; padding-left: 10px; }
  .chat__voice-time { min-width: 34px; }
}


/* ---------------------------------------------------------------------
   REDUCED MOTION — base.css already honours this for the camera ring; the
   chat's two animations follow suit. Both degrade to a legible static state.
   --------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .chat__typing span,
  .chat__voice-dot {
    animation: none;
  }
  .chat__typing span { opacity: 0.6; }
  .chat__list { scroll-behavior: auto; }
}

</style>
</head>

VKB.knowledge = {"meta":{"built":"2026-09-11","note":"Facts here were read off the pages listed in sources, not recalled. Every entry carries a source URL. Fees and timelines on RAKEZ service pages change without notice and are quoted excluding VAT unless the page said otherwise; confidence flags say which numbers to trust. 'confirmed' = stated plainly on an official RAKEZ or UAE government page. 'varies' = the official source gives a range, says it depends, or two official pages disagree. 'unconfirmed' = could not be verified on an official source and must be checked with RAKEZ before it is repeated to a customer.","sources":["https://rakez.com/en/faqs","https://renewalsupport.rakez.com/","https://rakez.com/Upload/ManageDocument/Checklist-Licence-Renewal-Free-Zone_20200408145636.pdf","https://rakez.com/en/contact-us","https://rakez.com/en/join-us/getting-started","https://rakez.com/en/about-us/facilities","https://rakez.com/en/start-a-business/portal360","https://rakez.com/en/service-cards/visa-services","https://rakez.com/en/service-cards/visa-services/new-visa-employee","https://rakez.com/en/service-cards/visa-services/new-visa-investor-partner","https://rakez.com/en/service-cards/visa-services/new-visa-dependents","https://rakez.com/en/service-cards/visa-services/visa-renewal-employee","https://rakez.com/en/service-cards/visa-services/visa-renewal-investor-partner","https://rakez.com/en/service-cards/visa-services/visa-renewal-dependents","https://rakez.com/en/service-cards/visa-services/visa-cancellation-employee","https://rakez.com/en/service-cards/visa-services/visa-amendments","https://rakez.com/en/service-cards/visa-services/health-insurance-plan","https://rakez.com/en/service-cards/renewals/license-renewal-freezone","https://rakez.com/en/service-cards/license-renewal-services/license-renewal-non-freezone","https://rakez.com/en/service-cards/company-services","https://rakez.com/en/service-cards/company-amendments/license-amendment-free-zone","https://rakez.com/en/service-cards/company-amendments/shareholder-structure-change-free-zone","https://rakez.com/en/service-cards/company-amendments/trade-name-change-free-zone","https://rakez.com/en/service-cards/contact-details-amendment-kyc-update/kyc-update-free-zone","https://rakez.com/en/service-cards/de-registration-and-exit-procedures/de-registration-physical-facility","https://rakez.com/en/customer-services/licensing-renewals","https://rakez.com/en/customer-services/golden-visa","https://rakez.com/en/promotions/biz-starter-package","https://rakez.com/en/promotions/sme-business-setup","https://rakez.com/en/promotions/e-commerce","https://rakez.com/en/promotions/businesswomen","https://rakez.com/en/promotions/instant-licence","https://rakez.com/en/promotions/rakez-designated-zone","https://rakez.com/en/promotions/al-hamra-medical-centre","https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa","https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visas/residence-visa-for-family-members/sponsorship-requirements","https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visas/general-provisions-for-the-residence-visa/cancelling-your-residence-visa","https://u.ae/en/information-and-services/visa-and-emirates-id/entry-permits-and-residence-visa","https://u.ae/en/information-and-services/finance-and-investment/taxation/corporate-tax"]},"personas":[{"id":"visa-seeker","label":"I need a visa","blurb":"You or someone in your company needs a UAE residence visa through RAKEZ, or an existing one needs renewing or cancelling.","starters":["What documents do I need for an employee visa?","How long does a RAKEZ visa take?","How much does a residence visa cost?","Can my wife and kids come with me?","My visa expires next month — what do I do?"]},{"id":"renewer","label":"My licence is expiring","blurb":"You already have a RAKEZ licence and it is coming up for renewal, or it has already expired.","starters":["When do I have to renew my licence?","Is there a grace period?","What is the fine if I renew late?","What documents do I need to renew?","Can I add an activity at renewal?"]},{"id":"setter-upper","label":"I want to set up a business","blurb":"You are deciding whether to open a company in RAKEZ and want to know what it costs, how long it takes and what you get.","starters":["How much does it cost to set up in RAKEZ?","Can I own 100% of my company?","What licence types are there?","What is a flexi desk?","How long does setup take?"]},{"id":"everyone","label":"General questions","blurb":"Contacting RAKEZ, using the portal, paying, updating your records and closing a company.","starters":["How do I contact RAKEZ?","What are your opening hours?","How do I pay RAKEZ?","What is e-KYC and why am I being asked for it?","How do I close my company?"]}],"entries":[{"id":"visa-types-overview","persona":["visa-seeker"],"questions":["what visa types are there","which visa do i need","types of rakez visa","visa types","what kind of visa can i get","residence visa options"],"keywords":["visa","visas","types","type","kind","which","residence","residency","employee","employment","investor","partner","dependent","family","golden","permit"],"title":"The visa types RAKEZ handles","answer":"RAKEZ sponsors UAE residence visas for people connected to a RAKEZ company. The main ones are the investor or partner visa (for shareholders), the employee visa (for staff the company hires), and the dependent visa (for a visa holder's spouse and children). RAKEZ also handles work permits, entry permit extensions, visa amendments and cancellations, and can support Golden Visa applications.","bullets":["Investor / partner visa — for a shareholder in the company. A single shareholder gets an investor visa; multiple shareholders get partner visas.","Employee visa — for staff sponsored by the company","Dependent visa — for the spouse and children of a visa holder","Work permits — temporary work permits and non-sponsored ID cards","Golden Visa — 10-year residency, applied for through RAKEZ under one of six categories"],"facts":[{"label":"Shareholder visa type","value":"Single shareholder = investor visa; multiple shareholders = partner visas","confidence":"confirmed"},{"label":"Must a shareholder take a RAKEZ visa?","value":"No. Shareholders can hold a RAKEZ visa or a non-RAKEZ visa.","confidence":"confirmed"}],"followUps":["What documents do I need for an employee visa?","How much does an investor visa cost?","Can my family come?"],"source":"https://rakez.com/en/service-cards/visa-services"},{"id":"employee-visa-documents","persona":["visa-seeker"],"questions":["what documents do i need for an employee visa","employee visa paperwork","documents for staff visa","visa documents","what do i need to give you for a visa","employment visa requirements"],"keywords":["documents","document","paperwork","requirements","need","employee","employment","staff","visa","passport","photo","insurance","attested","certificate","docs"],"title":"Documents for a new employee visa","answer":"For most people it is a passport, a photo and health insurance. Some roles and some nationalities need extra papers. Everything is uploaded through Portal 360.","bullets":["Passport valid for at least 6 more months","Passport-size colour photo on a white background","Valid health insurance from an immigration-approved provider","Attested education certificate — only for medium and senior positions","National Identity Card — for nationals of Iraq, Iran, Afghanistan and Pakistan","Attested medical report — for nationals of Ethiopia, Sri Lanka and Indonesia applying from outside the UAE","Good conduct certificate — for several nationalities including Egypt, Nigeria and Kenya (attested by the UAE Embassy if you are abroad, or by UAE Police if you are already here)"],"facts":[{"label":"Passport validity needed","value":"At least 6 months","confidence":"confirmed"},{"label":"Health insurance","value":"Required, from a provider approved by immigration","confidence":"confirmed"}],"followUps":["How long does the employee visa take?","How much does it cost?","What is the medical test?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-steps","persona":["visa-seeker"],"questions":["how does the visa process work step by step","visa steps","what is the order of the visa process","what happens first medical or emirates id","visa process stages","how do i get my residence visa"],"keywords":["steps","step","process","order","stages","how","first","next","entry","permit","activate","medical","emirates","id","biometrics","stamping","residence"],"title":"The visa process, in order","answer":"It runs in six stages and RAKEZ drives most of it. You apply, you get an entry permit, the visa is activated, you do a medical, you do Emirates ID biometrics, and then the residence visa is issued. You only need to physically turn up for the medical and the biometrics.","bullets":["1. Apply for the entry permit on Portal 360","2. Entry permit approved and the e-visa is issued (subject to immigration approval)","3. Activate the visa — RAKEZ does this if you are already inside the UAE; immigration does it on arrival if you are coming from abroad","4. Medical fitness test at the RAKEZ Medical Fitness Centre or any UAE-approved centre","5. Emirates ID and biometrics — first-time applicants only; if you already have an Emirates ID, RAKEZ submits it for you and you skip this","6. Residence visa and Emirates ID issued; you are a UAE resident"],"facts":[{"label":"e-visa (entry permit) validity","value":"60 days from the date it is issued","confidence":"confirmed"},{"label":"Do I need to visit an office?","value":"Only for the medical test and, if it is your first Emirates ID, the biometrics","confidence":"confirmed"}],"followUps":["What is the medical test like?","How long does the whole thing take?","What documents do I need?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-time","persona":["visa-seeker"],"questions":["how long does a visa take","visa processing time","how long employee visa","how fast can i get a visa","visa timeline","how many days visa"],"keywords":["how","long","time","days","fast","quick","timeline","processing","speed","vip","urgent","standard","visa"],"title":"How long a new visa takes","answer":"RAKEZ quotes 3 working days on the VIP package and 6 working days on the standard package, for both employee and investor/partner visas. That is RAKEZ's processing time — it assumes your documents are complete and immigration approves without questions.","bullets":["VIP package — 3 working days","Standard package — 6 working days","Dependent visas take longer: 9 working days on the normal timeline","Delays usually come from missing documents, an expiring passport, or immigration security checks"],"facts":[{"label":"New visa, VIP","value":"3 working days","confidence":"confirmed"},{"label":"New visa, standard","value":"6 working days","confidence":"confirmed"},{"label":"New dependent visa","value":"9 working days (normal)","confidence":"confirmed"}],"followUps":["What is in the VIP package?","How much does it cost?","What documents do I need?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-cost","persona":["visa-seeker"],"questions":["how much is an employee visa","visa cost","what does a visa cost","employee visa price","cost of residence visa rakez","visa fees"],"keywords":["cost","costs","price","fee","fees","how","much","aed","money","charge","expensive","visa","employee","vip"],"title":"What a new employee visa costs","answer":"RAKEZ's VIP all-inclusive employee visa package is listed at AED 3,800. If the applicant is already inside the UAE there is an extra AED 985 to activate the visa. The standard package price is not shown clearly on the page, so ask RAKEZ for a written quote before you budget.","bullets":["VIP all-inclusive — AED 3,800","Add AED 985 if the applicant is already inside the UAE (visa activation)","VIP includes same-day medical and biometrics, the Essential health insurance plan, door delivery of the Emirates ID in 2 to 3 working days, and 20% off dependent visas","On the standard package the medical, insurance and ID delivery are charged separately","Fees are quoted excluding VAT"],"facts":[{"label":"VIP all-inclusive employee visa","value":"AED 3,800","confidence":"confirmed"},{"label":"In-country activation surcharge","value":"AED 985","confidence":"confirmed"},{"label":"Standard package price","value":"Not legible on the RAKEZ page — request a quote","confidence":"unconfirmed"}],"followUps":["What is in the VIP package?","How much is health insurance?","How much is a dependent visa?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"investor-visa","persona":["visa-seeker","setter-upper"],"questions":["investor visa","partner visa","shareholder visa","can i get a visa as the owner","how much is an investor visa","owner visa rakez"],"keywords":["investor","partner","shareholder","owner","founder","visa","cost","price","3800","4620"],"title":"Investor and partner visas","answer":"If you are a shareholder in a RAKEZ company you can sponsor yourself. A single shareholder gets an investor visa; where there are several shareholders they get partner visas. The process is the same six stages as an employee visa.","bullets":["VIP package — AED 3,800, 3 working days","Standard charges listed as AED 4,620, 6 working days","Add AED 985 if you are already inside the UAE","You need a passport valid 6+ months, a white-background photo, and immigration-approved health insurance","Nationals of Egypt, Nigeria, Indonesia, Sri Lanka and Kenya get an approval rather than an e-visa and must visit the UAE Embassy within 45 days"],"facts":[{"label":"VIP investor/partner visa","value":"AED 3,800, 3 working days","confidence":"confirmed"},{"label":"Standard investor/partner visa","value":"AED 4,620 listed, 6 working days — confirm with RAKEZ, the VIP price reads lower than standard on the page","confidence":"varies"},{"label":"Embassy visit deadline (certain nationalities)","value":"45 days","confidence":"confirmed"}],"followUps":["What is the visa process step by step?","Can I sponsor my family?","Do I need a RAKEZ visa as a shareholder?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-investor-partner"},{"id":"medical-fitness-test","persona":["visa-seeker"],"questions":["what is the medical test","visa medical","blood test x ray visa","medical fitness test rakez","how much is the medical","where do i do my medical"],"keywords":["medical","fitness","test","blood","xray","x-ray","chest","health","screening","clinic","centre","center","medicals"],"title":"The visa medical fitness test","answer":"Every visa applicant aged 18 and over has to pass a medical fitness test before the residence visa is issued. It is a blood test and, for new visas, a chest x-ray. It takes about 15 minutes and results come back within 24 hours by email and SMS.","bullets":["Check in, blood test, chest x-ray (new visas only), then results","Around 15 minutes at the centre; results within 24 hours by email and SMS","Medical examination AED 30; medical form typing AED 300; health card AED 285; urgent processing AED 500","You must do the medical within one month of the RAKEZ typing date","The medical certificate is valid for 3 months from the test date","RAKEZ Service Centre, Amenity Centre, Al Jazeera Al Hamra Industrial, Ras Al Khaimah. Mon–Fri 8:00–16:00, Sat 9:00–14:00. Walk-ins accepted, booking recommended."],"facts":[{"label":"Medical examination fee","value":"AED 30","confidence":"confirmed"},{"label":"Medical form typing","value":"AED 300","confidence":"confirmed"},{"label":"Results turnaround","value":"Within 24 hours","confidence":"confirmed"},{"label":"Deadline to take the test","value":"Within 1 month of the RAKEZ typing date","confidence":"confirmed"},{"label":"Certificate validity","value":"3 months from test date","confidence":"confirmed"},{"label":"Who must take it","value":"Everyone aged 18 and above","confidence":"confirmed"}],"followUps":["What happens after the medical?","What is Emirates ID biometrics?","Can I do the medical somewhere else?"],"source":"https://rakez.com/en/promotions/al-hamra-medical-centre"},{"id":"emirates-id-biometrics","persona":["visa-seeker"],"questions":["what is emirates id","do i need biometrics","emirates id fingerprints","when do i get my emirates id","emirates id card delivery","eid"],"keywords":["emirates","id","eid","biometrics","fingerprint","fingerprints","card","identity","delivery","collect"],"title":"Emirates ID and biometrics","answer":"The Emirates ID is your UAE identity card and it is issued alongside your residence visa. If it is your first one you give fingerprints and a photo at the medical centre or an Emirates ID centre. If you already have an Emirates ID from a previous visa, RAKEZ submits the application for you and you skip the biometrics.","bullets":["First-time applicants do biometrics in person","Existing Emirates ID holders skip this step — RAKEZ submits directly","On the VIP package the card is delivered to your door in 2 to 3 working days","On the standard package delivery is an optional extra","You receive a digital residence visa and digital Emirates ID as well as the physical card"],"facts":[{"label":"Card delivery, VIP package","value":"2 to 3 working days to your door","confidence":"confirmed"},{"label":"Biometrics needed?","value":"Only for a first Emirates ID","confidence":"confirmed"}],"followUps":["What is the medical test?","How long does the whole visa take?","What do I get at the end?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"entry-permit","persona":["visa-seeker"],"questions":["what is an entry p
