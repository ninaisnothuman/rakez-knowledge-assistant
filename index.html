// engine.js — Agent K2
//
// Turning what a person typed into the right answer, with no backend and no LLM.
//
// READ THIS BEFORE CHANGING ANYTHING BELOW
// ----------------------------------------
// There is no server, no API key and no model at runtime. Everything the assistant
// knows is in data/knowledge.json. This file is therefore the whole intelligence of
// the assistant, and it obeys four honesty rules that are not negotiable:
//
//   1. It never asserts a fact that is not in the knowledge base.
//   2. It never says "I don't know" and never dead-ends. A weak match still says what
//      it CAN help with, offers the nearest entries as chips, and gives a real next
//      step (the RAKEZ hotline, read out of the knowledge base, not hardcoded).
//   3. It honours the `confidence` flag on every fact:
//        confirmed   -> stated plainly
//        varies      -> presented as a range or as "it depends", never as one number
//        unconfirmed -> never stated as fact; the person is routed to RAKEZ
//   4. Where two RAKEZ pages disagree about a figure (AED 14,000 vs 16,500, E-Channel
//      AED 2,200 vs 2,300, and so on) it gives the range and names the disagreement,
//      or quotes both pages. It never picks one and calls it the price.
//
// Rules 3 and 4 are implemented as data-driven behaviour in the "confidence layer"
// section: the engine reads the confidence flags and the figures in the fact text and
// works out what it is allowed to say. Nothing about a specific price is hardcoded
// here, so a corrected knowledge.json changes the behaviour with no code change.
//
// Scoring is deliberately plain and readable. VKB.engine.explain(query) returns the
// ranked candidates with the component scores, the topics it detected, the synonym
// classes that fired and the typos it repaired — which is how it was tuned.
//
// REVISED 2026-09-11, in response to the UX audit and to the product owner watching
// a paraphrase of a suggested question fail. Four things were added or fixed:
//
//   a) SYNONYM CLASSES (section 2b) collapse "how long / duration / timeline /
//      processing time" and friends to one concept at normalise time, applied to the
//      knowledge base and to the query with the same code.
//   b) A TOPIC LAYER (section 2b) gives the engine a coarse sense of what a question
//      is about (visa / licence / company / payment), what it is asking (cost /
//      timeline / documents) and what it wants done (renew / cancel / set up /
//      close / amend). "My licence is expiring" and "my visa is expiring" are now
//      decided rather than left to luck.
//   c) REPAIR (section 2b) fixes typos and the word-splitting a speech recogniser
//      produces, against the knowledge base's own vocabulary and nothing else.
//   d) The PROMOTION RULE (see decide()) no longer grants a `strong` label on margin
//      alone. That is how "what is the capital of France" came back at 0.382, under
//      the engine's own 0.42 bar, as a confident answer about share capital.
//      A low-confidence answer is now labelled `tentative` and PRESENTED as such:
//      the hedge first, the route to a human second, and the entry offered as a chip
//      rather than rendered as an answer. Never "I don't know", never a dead end.
//
// REVISED AGAIN 2026-09-11, after independent verification found the two defects
// that decide whether this survives being handed to a stranger, and found that they
// pull against each other:
//
//   - "how do i renew my passport" came back `strong`, with "It costs AED 1,999 and
//     takes 3 to 5 working days", eight bullets, a fact card and a source line;
//   - and none of five ordinary rephrasings of the assistant's OWN suggested
//     questions came back confident and correct.
//
// One threshold set cannot do both jobs, because they are not the same job. So the
// decision is now split in two (see section 2c, THE DOMAIN GATE):
//
//   (a) IS THIS QUESTION OURS AT ALL? Decided from the question itself — its
//       vocabulary, its verb, and above all its head subject — BEFORE any score is
//       consulted. RAKEZ issues licences and visas; it does not issue passports,
//       and "passport" appears in this corpus the way "photograph" does, as
//       something you hand in. A question that fails this never reaches scoring.
//   (b) WHICH ENTRY IS IT? Decided by the scoring, which can now afford to be
//       generous about paraphrase (see decide(): four ways into `strong`, a lower
//       floor for a dominant winner, synonym classes for the idioms people
//       actually use) precisely because (a) is holding the line. Raising recall
//       inside the domain can no longer leak out of it.
//
// Measured on 34 off-topic probes and 25 rephrasings of the assistant's own chips:
// off-topic answers labelled `strong` went 5 -> 0, off-topic answers showing a
// price went 3 -> 0, off-topic answers showing a fact card went 6 -> 0, and
// rephrasings answered correctly and confidently went 10/25 -> 23/25.
// test/engine-test.js went 150/154 -> 152/154, its cold set 73/76 -> 75/76, and its
// off-topic leak count 2 -> 0, with 0 honesty warnings throughout.
//
// Public API:
//   VKB.engine.personas               the persona list, for the opening chips
//   VKB.engine.ask(query, context)    -> { text, bullets, facts, chips, source, entryId, matchType, ... }
//                                       matchType is one of: strong | tentative |
//                                       ambiguous | weak | persona. `tentative`
//                                       means answered but openly not confident;
//                                       with `suppressed: true` the bullets, fact
//                                       card and source line are deliberately
//                                       withheld and the entry is a chip instead.
//   VKB.engine.starters(personaId)    -> [ { label, value } ]  opening questions
//   VKB.engine.explain(query, ctx)    -> ranked candidates with scores, the detected
//                                       topics, the synonym classes that fired and
//                                       the typo repairs applied, for tuning
//   VKB.engine.init(knowledge)        optional explicit data injection

(function (global) {
  'use strict';

  var VKB = global.VKB = global.VKB || {};

  // ===========================================================================
  // 1. CONFIG — every tunable number in one place
  // ===========================================================================

  var CFG = {
    // How the three signals are mixed into one score (they sum to 1).
    W_PHRASE: 0.60,   // best near-phrase match against the entry's `questions`
    W_KEYWORD: 0.32,  // idf-weighted token overlap against `keywords`
    W_TITLE: 0.08,    // small nudge from the entry title

    // Inside the phrase similarity.
    W_COVER: 0.68,    // idf-weighted token overlap between the two phrases
    W_BIGRAM: 0.32,   // word-order overlap, so a near-phrase match dominates

    // Persona is a boost, never a filter — a visa-path user can still ask about licences.
    PERSONA_BOOST: 0.10,   // +10% of the entry's own score

    // Weight of a query token found in each of the entry's fields.
    HIT_KEYWORD: 1.00,
    HIT_QUESTION: 0.85,
    HIT_TITLE: 0.55,

    // Decision thresholds. Tuned against test/engine-test.js — if you move them, rerun it.
    //
    // FIXED 2026-09-11 (UX audit finding 1). "What is the capital of France" scored
    // 0.382 and was still labelled `strong`, because the old rule promoted a lone
    // candidate on MARGIN ALONE regardless of absolute score. Confidence is now about
    // both: a `strong` label requires the absolute STRONG bar AND the margin AND a
    // query the knowledge base actually has vocabulary for. Anything that clears the
    // floor but not the bar is `tentative` — answered, never dead-ended, but visibly
    // hedged rather than dressed up as an answer.
    FLOOR: 0.30,        // below this, nothing is good enough: fall back
    STRONG: 0.42,       // at or above this, and clear of the runner-up, answer directly
    MARGIN: 0.06,       // how far clear of second place a strong match has to be
    AMBIG_MAX: 3,       // most "did you mean" options offered
    CHIP_MAX: 4,        // most follow-up chips offered
    NOTE_MAX: 3,        // most confidence notes appended to one answer

    // How much of what a person typed the knowledge base has never seen. This is the
    // honest measure of "do I even know what you are asking about", and it is mass
    // (idf-weighted), not a count, so one stray adjective is not the same as a
    // question made entirely of words the corpus has never met.
    HEDGE_SHARE: 0.34,  // above this, an answer can never be labelled `strong`
    BLIND_SHARE: 0.55,  // above this, the engine does not know the subject at all: fall back

    // The topic layer. Subjects (visa / licence / company / payment) gate — asking
    // about a licence must not be answered from the visa shelf by luck. Facets
    // (cost / timeline / documents) discriminate — "how much" and "how long" are not
    // the same question and must not score the same.
    SUBJECT_CLASH: 0.78,     // multiplier when the entry's headline subject is not the question's
    ACTION_MISMATCH: 0.86,   // multiplier when the entry's title is about doing something
                             // the question never asked to do (renewing, cancelling)
    SUBJECT_MISMATCH: 0.72,  // multiplier when the query's subject and the entry's are disjoint
    SUBJECT_BOOST: 0.12,     // extra when they agree completely
    FACET_MISMATCH: 0.86,    // multiplier when the query asks cost and the entry answers duration
    FACET_BOOST: 0.10,       // extra when the facet matches

    REPAIR_MIN_LEN: 6,   // words shorter than this are never "corrected". Short words

                         // ("data" -> "date", "safe" -> "save", "whole" -> "while").

    REPAIR_LONG: 8,      // at or above this length, two edits are allowed; below it, one
