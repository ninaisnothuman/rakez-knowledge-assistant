        if (!chunk) continue;
        body += '<p class="msg__text">' + esc(chunk).replace(/\n/g, '<br>') + '</p>';
      }
    }

    if (isArr(m.bullets) && m.bullets.length) {
      var lis = '';
      for (var b = 0; b < m.bullets.length; b++) {
        lis += '<li>' + esc(m.bullets[b]) + '</li>';
      }
      body += '<ul class="msg__bullets">' + lis + '</ul>';
    }

    body += factsHtml(m.facts, m.factsLabel);

    if (m.source) {
      body += '<p class="msg__source">Source: ' + esc(hostOf(m.source)) + '</p>';
    }

    if (showChips && isArr(m.chips) && m.chips.length) {

      // 586:1948. There is no second copy anywhere else on the screen.
      // A message may carry its own lead line (the greeting uses the Figma
      // "What would you like to know about?"); most do not, because the
      // answer's own prose already asks the question.
      body += VKB.render.chips(m.chips, { label: m.chipsLabel || null });
    }

    body += VKB.render.actions(m);

    return (
      '<div class="msg msg--bot" data-id="' + id + '">' +
        '<span class="msg__avatar" aria-hidden="true">' + ic('bot') + '</span>' +
        '<div class="msg__body">' + body + '</div>' +
      '</div>'

    return (
      '<div class="chat__speaking" role="status">' +
        '<span class="chat__speaking-eq" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span class="chat__speaking-label">' + esc(VKB.copy.speaking) + '</span>' +
        '<button type="button" class="chat__speaking-stop" data-act="stopSpeaking">' +
          esc(VKB.copy.speakingStop) + '</button>' +
      '</div>'
    );
  }

  VKB.screens.chat = function (state) {
    state = state || {};
    var msgs = isArr(state.messages) ? state.messages : [];

    // ---- message list ---------------------------------------------------
    //
    // Only the LATEST assistant message carries its options. Once the person
    // has answered — by tapping one or by typing something else — the list has
    // done its job and goes, the way it does in every other assistant. While
    // the typing indicator is up, a new turn is already in flight, so no
    // message shows options at all.
    var lastBot = -1;
    for (var L = msgs.length - 1; L >= 0; L--) {
      if (msgs[L] && msgs[L].who === 'bot') { lastBot = L; break; }
    }

    var list = '';
    if (!msgs.length) {
      list += VKB.render.message({ who: 'bot', id: 'greeting', text: VKB.copy.greeting });
    } else {
      for (var i = 0; i < msgs.length; i++) {
        list += VKB.render.message(msgs[i], {
          showChips: !state.awaiting && i === lastBot
        });
      }
    }
    if (state.awaiting) list += VKB.render.typing();

    // ---- composer -------------------------------------------------------
    var dictating = !!state.dictating;
    var busy      = !!state.awaiting;
    var draft     = String(state.draft || '');
    // UX AUDIT findings 3 and 6 — send was a live-looking teal button that did
    // nothing on an empty box, and stayed live while an answer was in flight
    // (which interleaved the turns). It is now genuinely disabled in both
    // cases, and looks it. screens.syncComposer() keeps this in step while the
    // person types, without a rerender.
    // Kept for the disclosure below; the attribute itself is set at runtime.
    var canSend   = !busy && draft.replace(/^\s+|\s+$/g, '') !== '';

    // UX AUDIT finding 5 — this was a single-line <input>: a 172-character
    // question showed 37 characters at a time, scrolled horizontally, tail
    // first. It is a textarea that grows with the text and then scrolls, capped
    // at six lines (.chat__input, chat.css). Enter still sends and Shift+Enter
    // still inserts a newline — app.js's onKey already worked that way.
    var row =
      '<div class="chat__row">' +
        '<textarea id="vkb-input" class="chat__input" rows="1" autocomplete="off" ' +
          'autocapitalize="sentences" spellcheck="false" enterkeyhint="send" ' +
          'aria-label="' + esc(VKB.copy.placeholder) + '" ' +
          'placeholder="' + esc(VKB.copy.placeholder) + '">' + esc(draft) + '</textarea>' +
        // NET-NEW — no mic exists anywhere in the Figma file.
        '<button type="button" class="chat__mic" data-act="mic" ' +
          (busy ? 'disabled ' : '') +
          'aria-label="Dictate your question">' + ic('mic') + '</button>' +
        // The `disabled` / `aria-disabled` ATTRIBUTES are set here only for
        // the in-flight case,
        // which the next render clears on its own. The empty-box case is
        // driven at runtime by screens.syncComposer() (and, as a belt-and-
        // braces that needs no JavaScript at all, by the
        // :has(:placeholder-shown) rule in chat.css) — so the button can
        // never get stuck disabled if a render lands without a sync.
        '<button type="button" class="chat__send' + (busy ? ' is-busy' : '') + '" data-act="send" ' +
          (busy ? 'disabled aria-disabled="true" ' : '') +
          'aria-label="' + (busy ? esc(VKB.copy.busyHint) : 'Send') + '">' +
          ic('send') + '</button>' +
      '</div>' +
      // Named by the send button while an answer is coming, so the reason the
      // control is unavailable is readable and not just a colour change.
      '<p class="chat__busy"' + (busy ? '' : ' hidden') + ' role="status">' +
        esc(VKB.copy.busyHint) + '</p>';

    // NET-NEW — the whole recording state. Agent K3 (voice.js) drives the
    // canvas and the timer; this file only lays them out and dresses them.
    // The canvas gets no fallback animation: CONTRACT.md hard rule 3 says the
    // visualiser responds to the microphone or it does not ship, so an idle
    // canvas must look idle.
    //
    // UX AUDIT finding 11 — the panel used to be rendered at all times with a
    // `hidden` attribute, which left cancel/stop as two 0×0 stops in the tab
    // order of every screen. It is now not in the DOM unless dictation is
    // running, which is unambiguous.
    //
    // NEW in this pass: a transcript surface. The contract says stop puts the
    // transcript in the composer so it can be corrected — but until this pass
    // there was nowhere to READ it while speaking, so you dictated blind. The
    // words now land in .chat__voice-transcript as they are recognised, and
    // "Use this text" moves them into the composer to send.
    var voice = !dictating ? '' : (
      '<div class="chat__voice">' +
        '<div class="chat__voice-live">' +
          '<span class="chat__voice-dot" aria-hidden="true"></span>' +
          '<canvas id="vkb-wave" class="chat__wave" aria-hidden="true"></canvas>' +
          '<span class="chat__voice-time" aria-live="off">00:00</span>' +
          '<button type="button" class="chat__voice-btn chat__voice-btn--cancel" ' +
            'data-act="cancelDictation" aria-label="' + esc(VKB.copy.voiceCancel) + '" ' +
            'title="' + esc(VKB.copy.voiceCancel) + '">' + ic('close') + '</button>' +
        '</div>' +
        '<p id="vkb-transcript" class="chat__voice-transcript is-empty" aria-live="polite">' +
          esc(VKB.copy.voiceWaiting) + '</p>' +
        '<button type="button" class="btn btn--primary btn--block chat__voice-use" ' +
          'data-act="stopDictation">' +
          ic('check') + '<span>' + esc(VKB.copy.voiceUse) + '</span></button>' +
      '</div>' +
      '<p class="chat__voice-hint">' + esc(VKB.copy.voiceHint) + '</p>'
    );

    // NET-NEW — the speaking bar. An answer to a spoken question is read aloud
    // on its own, so there has to be a quiet, visible sign that it is happening
    // and one obvious way to stop it. Sits above the composer, only while
    // state.speaking is true, and is toggled without a rerender by
    // screens.setSpeaking() so the page does not rebuild mid-sentence.
    // Rendered only while it is true, never parked behind a `hidden`
    // attribute — that is the shape of UX AUDIT finding 11 and it is not worth
    // repeating for a control that is invisible 95% of the time.
    var speakingBar = state.speaking ? speakingBarHtml() : '';

    // ---- header ---------------------------------------------------------
    // 586:1840 gives the header ONE 40px button on the right: an X. Two are
    // rendered — the speaker toggle Francis asked for, then this one.
    //
    // UX AUDIT finding 4 — that button used the CLOSE glyph and wiped the
    // whole conversation on a single tap, unconfirmed and unrecoverable, from
    // the exact corner a presenter reaches to dismiss something. Figma draws
    // an unlabelled X and never resolved its meaning, so shipping it as a
    // destructive action was this build's decision, and it was the wrong one.
    // It now says what it does: a compose glyph, the name "Start a new
    // conversation", and `askReset` — which confirms first when there is a
    // conversation to lose (app.js).
    var speakOn = !!state.speakEnabled;
    var head =
      '<header class="hdr chat__hdr">' +
        '<div class="chat__brand">' +
          '<span class="chat__brand-avatar" aria-hidden="true">' + ic('bot') + '</span>' +
          '<span class="chat__brand-name">' + esc(VKB.copy.title) + '</span>' +
        '</div>' +
        '<div class="chat__hdr-tools">' +
          '<button type="button" class="hdr__btn chat__hdr-btn' + (speakOn ? ' is-on' : '') + '" ' +
            'data-act="speak" aria-pressed="' + (speakOn ? 'true' : 'false') + '" ' +
            'aria-label="' + (speakOn ? 'Stop reading answers aloud' : 'Read answers aloud') + '">' +
            ic(speakOn ? 'speakerOn' : 'speakerOff') + '</button>' +
          '<button type="button" class="hdr__btn" data-act="askReset" ' +
            'aria-label="' + esc(VKB.copy.resetLabel) + '" ' +
            'title="' + esc(VKB.copy.resetLabel) + '">' + ic('newChat') + '</button>' +
        '</div>' +
      '</header>';

    // ---- assemble -------------------------------------------------------
    return (
      '<div class="chat">' +
        head +
        '<div class="chat__list" id="vkb-list" role="log" aria-live="polite" aria-label="Conversation">' +
          list +
        '</div>' +
        '<div class="chat__dock">' +
          speakingBar +
          (dictating ? voice : row) +
          // Not escaped on purpose: this is a constant defined in this file
          // that contains a <b>, not anything a person typed. Every other
          // interpolation on this screen goes through esc().
          '<p class="disclaimer">' + VKB.copy.disclaimer + '</p>' +
        '</div>' +
      '</div>'
    );
  };

  // =======================================================================
  // VKB.screens.confirmDialog(state) -> HTML string, or '' when closed.
  //
  // NET-NEW, no Figma reference. UX AUDIT finding 4: the header control used
  // to destroy the conversation on one tap. This is the confirm step. It
  // reuses the share dialog's card so it is the same object in the same
  // product, not a second dialog language.
  // =======================================================================
  VKB.screens.confirmDialog = function (state) {
    state = state || {};
    if (!state.confirmReset) return '';
    return (
      '<div class="share share--confirm" role="dialog" aria-modal="true" ' +
          'aria-label="' + esc(VKB.copy.resetTitle) + '" data-act="cancelReset">' +
        '<div class="share__card" data-act="noop">' +
          '<div class="share__head">' +
            '<span class="share__title">' + esc(VKB.copy.resetTitle) + '</span>' +
            '<button type="button" class="share__x" data-act="cancelReset" ' +
              'aria-label="' + esc(VKB.copy.resetCancel) + '">' + ic('close') + '</button>' +
          '</div>' +
          '<div class="share__body">' +
            '<p class="share__lead">' + esc(VKB.copy.resetBody) + '</p>' +
          '</div>' +
          '<div class="share__foot">' +
            '<button type="button" class="btn btn--primary btn--block share__close" ' +
              'data-act="reset">' + esc(VKB.copy.resetConfirm) + '</button>' +
            '<button type="button" class="btn btn--secondary btn--block share__close" ' +
              'data-act="cancelReset">' + esc(VKB.copy.resetCancel) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  };

  // =======================================================================
  // VKB.screens.shareDialog(state) -> HTML string, or '' when closed.
  // 586:7291 (default) and 586:7347 ("Link copied").
  //
  // Reads:
  //   state.shareOpen   render at all
  //   state.shareCopied switch the circle + label to the copied state
  //   state.shareUrl    the link shown under the label (NET-NEW, see below)
  //
  // The orchestrator appends this AFTER screens.chat's html; it is fixed and
  // positions itself over the screen.
  // =======================================================================
  VKB.screens.shareDialog = function (state) {
    state = state || {};
    if (!state.shareOpen) return '';

    var copied = !!state.shareCopied;
    var label  = copied ? VKB.copy.shareCopied : VKB.copy.shareCopy;
    var glyph  = copied ? ic('check') : ic('link');

    // UX AUDIT finding 17 — this used to print window.location.href under the
    // circle: `file:///home/claude/kbchat/index.html` on a presenter's laptop.
    // The line is not in Figma (586:7291 draws only the circle, the label and
    // Close), it exposed a local filesystem path, and the URL carries no
    // conversation, so the card promised something it could not do. The line
    // is gone; the Figma lead stays verbatim and a one-line note says what
    // actually happens. Honesty-first product, honesty-first dialog.
    return (
      '<div class="share" role="dialog" aria-modal="true" aria-label="' +
          esc(VKB.copy.shareTitle) + '" data-act="closeShare">' +
        // The card stops the click, so tapping the card never closes the
        // dialog while tapping the scrim does. data-act on the scrim only;
        // the orchestrator's delegated handler sees the innermost [data-act].
        '<div class="share__card" data-act="noop">' +
          '<div class="share__head">' +
            '<span class="share__title">' + esc(VKB.copy.shareTitle) + '</span>' +
            '<button type="button" class="share__x" data-act="closeShare" ' +
              'aria-label="Close">' + ic('close') + '</button>' +
          '</div>' +
          '<div class="share__body">' +
            '<p class="share__lead">' + esc(VKB.copy.shareLead) + '</p>' +
            '<div class="share__action">' +
              '<button type="button" class="share__circle' + (copied ? ' is-copied' : '') + '" ' +
                'data-act="copyLink" aria-label="' + esc(label) + '">' + glyph + '</button>' +
              '<span class="share__label" aria-live="polite">' + esc(label) + '</span>' +
              '<span class="share__note">' + esc(VKB.copy.shareNote) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="share__foot">' +
            '<button type="button" class="btn btn--primary btn--block share__close" ' +
              'data-act="closeShare">' + esc(VKB.copy.shareClose) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  };

  // =======================================================================
  // POST-RENDER BEHAVIOUR  (added 2026-09-11 in response to the UX audit)
  //
  // These are NOT screen functions. They return no HTML and they attach NO
  // event listeners — CONTRACT.md §"Interaction contract" is intact. They are
  // the small amount of imperative work that cannot be expressed as a string:
  // where the scroller ends up, where the keyboard focus ends up, and the two
  // controls (the copy confirmation, the jump pill) whose state is shorter
  // lived than a render.
  //
  // They live here rather than in app.js because they are about this file's
  // markup, and because the orchestrator's side of them is then four one-line
  // calls instead of eighty lines of geometry it would have to maintain.
  //
  // The orchestrator's contract, in full:
  //
  //   render():   VKB.screens.beforeRender();          // before innerHTML =
  //               ... root.innerHTML = ... ...
  //               VKB.screens.afterRender(VKB.state);  // after innerHTML =
  //   onInput():  VKB.screens.syncComposer(VKB.state);
  //   onKey():    if (ev.key === 'Tab') VKB.screens.trapTab(ev);
  //   scroll:     VKB.screens.onListScroll();          // on #vkb-list scroll
  //   actions.copy:        VKB.screens.copiedFeedback(elm);
  //   actions.jumpLatest:  VKB.screens.scrollToLatest();
  //   voice.js:   VKB.screens.setSpeaking(bool) / VKB.screens.setTranscript(s)
  // =======================================================================

  var NEAR_BOTTOM = 48;   // px from the end that still counts as "at the end"
  var PIN_OFFSET  = 12;   // breathing room above a pinned answer

  var prev = { scrollTop: 0, atBottom: true, focus: null, caret: null };
  var lastBotId  = null;  // newest assistant message at the last afterRender
  var dlgInvoker = null;  // what had focus when a dialog opened

  function listEl() { return document.getElementById('vkb-list'); }

  // A selector stable across a full rebuild of #app. Everything interactive on
  // this screen carries data-act, and message-scoped controls carry data-id.
  function focusKey(el) {
    if (!el || el === document.body || !el.getAttribute) return null;
    if (el.id) return '#' + el.id;
    var act = el.getAttribute('data-act');
    if (!act) return null;
    var id = el.getAttribute('data-id');
    return '[data-act="' + act + '"]' + (id ? '[data-id="' + id + '"]' : '');
  }

  // UX AUDIT finding 9 — every interaction replaced #app, which threw keyboard
  // focus to <body>. In a 3-message conversation that is 21 tab stops to get
  // back to where you were, after every single Like. Capture here, restore in
  // afterRender.
  VKB.screens.beforeRender = function () {
    var list = listEl();
    if (list) {
      prev.scrollTop = list.scrollTop;
      prev.atBottom  = (list.scrollHeight - list.scrollTop - list.clientHeight) <= NEAR_BOTTOM;
    } else {
      prev.scrollTop = 0;
      prev.atBottom  = true;
    }
    var a = document.activeElement;
    prev.focus = focusKey(a);
    prev.caret = (a && typeof a.selectionStart === 'number') ? a.selectionStart : null;
  };

  // UX AUDIT finding 2 — an 860px answer in a 587px viewport used to arrive
  // with scrollTop pinned to its maximum, i.e. the answer's top edge at
  // y = -244 and its first sentence off the top of the screen. Claude, ChatGPT
  // and Copilot all pin the TOP of the newest assistant turn. So does this.
  function pinTopOf(id) {
    var list = listEl();
    if (!list) return;
    var node = id && list.querySelector('.msg[data-id="' + id + '"]');
    if (!node) { list.scrollTop = list.scrollHeight; return; }
    var y = node.getBoundingClientRect().top -
            list.getBoundingClientRect().top + list.scrollTop - PIN_OFFSET;
    var max = Math.max(0, list.scrollHeight - list.clientHeight);
    list.scrollTop = Math.max(0, Math.min(y, max));
  }

  // UX AUDIT finding 7 — the "new answer" pill. Auto-scroll used to yank you
  // to the bottom from wherever you had deliberately scrolled to; now it only
  // follows when you were already at the end, and this says why nothing moved.
  function jumpPill(show) {
    var chat = document.querySelector('.chat');
    if (!chat) return;
    var p = chat.querySelector('.chat__jump');
    if (!show) { if (p && p.parentNode) p.parentNode.removeChild(p); return; }
    if (p) return;
    p = document.createElement('button');
    p.type = 'button';
    p.className = 'chat__jump';
    p.setAttribute('data-act', 'jumpLatest');
    p.innerHTML = ic('arrowDown') + '<span>' + esc(VKB.copy.jumpLatest) + '</span>';
    var dock = chat.querySelector('.chat__dock');
    (dock || chat).appendChild(p);
  }

  VKB.screens.afterRender = function (state) {
    state = state || {};
    var list = listEl();

    // ---- focus first, so nothing below fights it -----------------------
    if (prev.focus) {
      var back = document.querySelector(prev.focus);
      if (back && back.focus) {
        try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); }
        if (prev.caret != null && back.setSelectionRange) {
          try { back.setSelectionRange(prev.caret, prev.caret); } catch (e2) { /* not a text field */ }
        }
      }
    }

    // ---- dialogs: move focus in on open, hand it back on close ---------
    // UX AUDIT finding 10 — the share dialog declared aria-modal="true" and
    // then left focus on <body>, with every control behind the scrim still
    // reachable by Tab. trapTab() below is the other half.
    var dlg = document.querySelector('.share');
    if (dlg) {
      if (!dlgInvoker) dlgInvoker = prev.focus;
      if (!dlg.contains(document.activeElement)) {
        var into = dlg.querySelector('.share__x') || dlg.querySelector('button');
        if (into) into.focus();
      }
    } else if (dlgInvoker) {
      var inv = document.querySelector(dlgInvoker);
      if (inv && inv.focus) inv.focus();
      dlgInvoker = null;
    }

    VKB.screens.syncComposer(state);

    if (!list) return;

    var msgs   = isArr(state.messages) ? state.messages : [];
    var last   = msgs[msgs.length - 1];
    var newest = null;
    for (var i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i] && msgs[i].who === 'bot') { newest = msgs[i]; break; }
    }
    var newAnswer = !!(newest && newest.id !== lastBotId);

    if (state.awaiting || (last && last.who === 'user')) {
      // The person has just asked something. Their own question and the
      // typing indicator are what they want to see.
      list.scrollTop = list.scrollHeight;
      jumpPill(false);
    } else if (newAnswer) {
      if (prev.atBottom) {
        pinTopOf(newest.id);
        jumpPill(false);
      } else {
        list.scrollTop = prev.scrollTop;   // stay exactly where they were
        jumpPill(true);
      }
    } else {
      // A vote, a dialog, a toggle — nothing about the conversation moved, so
      // neither should the scroller.
      list.scrollTop = prev.scrollTop;
      jumpPill(prev.atBottom ? false : !!document.querySelector('.chat__jump'));
    }

    lastBotId = newest ? newest.id : null;
  };

  // Called from the orchestrator's scroll listener. Once they are back at the
  // end the pill has nothing left to say.
  VKB.screens.onListScroll = function () {
    var list = listEl();
    if (!list) return;
    if ((list.scrollHeight - list.scrollTop - list.clientHeight) <= NEAR_BOTTOM) jumpPill(false);
  };

  VKB.screens.scrollToLatest = function () {
    pinTopOf(lastBotId);
    jumpPill(false);
  };

  // UX AUDIT findings 3, 5 and 6, all in the composer.
  //   5 — the textarea grows with the text up to its capped max-height. Modern
  //       engines do it in CSS with field-sizing; this is the fallback for the
  //       ones that do not, and it is why app.js calls this on every keystroke.
  //   6 — send is disabled, and looks disabled, on an empty box.
  //   3 — and while an answer is in flight, so a second question cannot be
  //       interleaved ahead of the first answer.
  function autosize(box) {
    if (!box || box.tagName !== 'TEXTAREA') return;
    box.style.height = 'auto';
    var max = parseFloat(window.getComputedStyle(box).maxHeight);
    if (!max || isNaN(max)) max = 1e9;
    box.style.height = Math.min(box.scrollHeight, max) + 'px';
  }

  VKB.screens.syncComposer = function (state) {
    state = state || {};
    var box  = document.getElementById('vkb-input');
    var send = document.querySelector('.chat__send');
    autosize(box);
    if (!send) return;
    var busy = !!state.awaiting;
    var val  = box ? box.value : (state.draft || '');
    var can  = !busy && String(val).replace(/^\s+|\s+$/g, '') !== '';
    send.disabled = !can;
    send.setAttribute('aria-disabled', can ? 'false' : 'true');
  };

  // The other half of finding 10. Called from the orchestrator's keydown
  // handler on Tab while a dialog is open.
  VKB.screens.trapTab = function (ev) {
    var dlg = document.querySelector('.share');
    if (!dlg || !ev || ev.key !== 'Tab') return;
    var all = dlg.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    var nodes = [];
    for (var i = 0; i < all.length; i++) {
      if (!all[i].disabled && all[i].offsetParent !== null) nodes.push(all[i]);
    }
    if (!nodes.length) return;
    var first = nodes[0];
    var last  = nodes[nodes.length - 1];
    var a     = document.activeElement;
    var out   = !dlg.contains(a);
    if (ev.shiftKey) {
      if (out || a === first) { ev.preventDefault(); last.focus(); }
    } else {
      if (out || a === last) { ev.preventDefault(); first.focus(); }
    }
  };

  // UX AUDIT finding 8 — copy used to be one second of icon tint under your
  // own thumb. This is the share dialog's "Link copied" pattern, which the
  // audit names as the model: the glyph becomes a tick and a short label
  // appears in an aria-live region beside it.
  VKB.screens.copiedFeedback = function (btn) {
    if (!btn) return;
    var out = btn.parentNode && btn.parentNode.querySelector('.msg__copied');
    if (btn.getAttribute('data-restore') == null) {
      btn.setAttribute('data-restore', btn.innerHTML);
    }
    btn.classList.add('is-copied');
    btn.innerHTML = ic('check');
    btn.setAttribute('aria-label', VKB.copy.copyDone);
    if (out) out.textContent = VKB.copy.copied;
    if (btn.__copyT) window.clearTimeout(btn.__copyT);
    btn.__copyT = window.setTimeout(function () {
      btn.classList.remove('is-copied');
      btn.innerHTML = btn.getAttribute('data-restore') || ic('copy');
      btn.removeAttribute('data-restore');
      btn.setAttribute('aria-label', 'Copy answer');
      if (out) out.textContent = '';
    }, 2200);
  };

  // ---- voice hooks (for Agent K3 / the orchestrator) --------------------
  //
  // NET-NEW. An answer to a spoken question starts talking on its own, so
  // there has to be a quiet, visible sign that it is happening and one
  // obvious way to stop it. Toggled here rather than through a rerender so
  // the page does not rebuild in the middle of a sentence.
  VKB.screens.setSpeaking = function (on) {
    if (VKB.state) VKB.state.speaking = !!on;
    var dock = document.querySelector('.chat__dock');
    var bar  = dock && dock.querySelector('.chat__speaking');
    if (!dock) return;
    if (!on) { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); return; }
    if (bar) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = speakingBarHtml();
    dock.insertBefore(wrap.firstChild, dock.firstChild);
  };

  // The live dictation transcript. voice.js calls this from onInterim and
  // again with the final text; "Use this text" then moves it to the composer.
  VKB.screens.setTranscript = function (text) {
    var el = document.getElementById('vkb-transcript');
    if (!el) return;
    var t = String(text == null ? '' : text).replace(/^\s+|\s+$/g, '');
    el.textContent = t || VKB.copy.voiceWaiting;
    if (t) el.classList.remove('is-empty');
    else el.classList.add('is-empty');
  };

  // Exposed only so the orchestrator and Agent K3 can escape text the same
  // way this file does, rather than each rolling their own.
  VKB.escapeHtml = esc;
  VKB.formatTime = fmtTime;
})();


/* ===== app.js ===== */
/* ============================================================================
   RAKEZ Knowledge Assistant — orchestrator
   Design: Figma nrorp581s8x8Z4G14dmh2O node 604:11918

   Owns: state, the one delegated event handler, the conversation loop, and the
   wiring between the engine (K2), the voice module (K3) and the screens (K1).

   Honesty rules, from CONTRACT.md, enforced here as well as in the engine:
   nothing is invented, nothing dead-ends, and the assistant never says
   "I don't know". No network calls, no storage, no analytics.
   ========================================================================== */
(function () {
  'use strict';

  window.VKB = window.VKB || {};

  /* ---------------------------------------------------------------- state */

  var initialState = function () {
    return {
      messages: [],
      persona: null,
      awaiting: false,
      dictating: false,
      speakEnabled: false,   // nothing speaks at someone who did not ask it to
      shareOpen: false,
      shareCopied: false,
      confirmReset: false,
      speaking: false,
      speechTurn: false,       // this turn's question was spoken, not typed
      lastCorrections: [],
      shareUrl: location.href.split('#')[0],
      draft: ''
    };
  };

  VKB.state = initialState();

  // The persona is now ONE thing: a scoring hint that persists for the whole
  // conversation. It used to double as a signal to the dock to keep showing
  // that persona's starter questions, which is how one answer ended up asking
  // the same question twice — numbered inside the bubble and again in a
  // permanent panel above the input. The dock list is gone (screens.js), so
  // this no longer has to be cleared on send to get the panel out of the way.
  VKB.context = { persona: null };

  var seq = 0;
  function nextId() { seq += 1; return 'm' + seq; }

  /* --------------------------------------------------------------- render */

  function render() {
    var root = document.getElementById('app');
    VKB.screens.beforeRender();
    root.innerHTML = VKB.screens.chat(VKB.state) +
                     VKB.screens.shareDialog(VKB.state) +
                     VKB.screens.confirmDialog(VKB.state);
    VKB.screens.afterRender(VKB.state);
  }

  // Re-render from state, and from state only.
  //
  // FIXED 2026-09-11 — this used to read the live input back into
  // VKB.state.draft on its way in. render() blows the whole screen away and
  // rebuilds it, so that read looked like it was "preserving what the person
  // is typing", but it also ran on the re-render that send() triggers, half a
  // tick after send() had cleared the draft. The just-sent text was copied
  // straight back out of the DOM and printed into the new input, so every
  // message had to be deleted by hand before the next one could be typed.
  //
  // The fix is not to clear the field harder, it is to stop having two copies
  // of the draft. VKB.state.draft is now the only one: onInput() below keeps
  // it current as the person types (one delegated listener, same as clicks),
  // send() clears it, voice.js's transcript writes to it, and render() prints
  // it into the input's value. Nothing reads the DOM back.
  function rerender() {
    render();
  }

  /* ---------------------------------------------------- the conversation */

  function pushUser(text) {
    VKB.state.messages.push({
      who: 'user', text: text, id: nextId(), ts: Date.now()
    });
  }

  function pushBot(answer) {
    var m = {
      who: 'bot',
      id: nextId(),
      ts: Date.now(),
      text: answer.text,
      bullets: answer.bullets,
      facts: answer.facts,
      factsLabel: answer.factsLabel,
      chips: answer.chips,
      chipsLabel: answer.chipsLabel || null,
      source: answer.source,
      entryId: answer.entryId,
      matchType: answer.matchType
    };
    VKB.state.messages.push(m);
    return m;
  }

  // The typing indicator is not decoration. It gives the answer a beat so the
  // conversation reads as a conversation rather than a lookup table.
  function answer(query, context, fromSpeech) {
    VKB.state.awaiting = true;
    rerender();

    window.setTimeout(function () {
      var a;
      try {
        a = VKB.engine.ask(query, context || { persona: VKB.context.persona });
      } catch (err) {
        // Even a broken engine must not dead-end. Fall back to the contact
        // route rather than showing the person an error.
        a = {
          text: 'Let me point you to someone who can help with that directly. ' +
                'RAKEZ customer happiness can be reached on 600 577 000, or through ' +
                'the contact form on rakez.com.',
          chips: personaChips(),
          matchType: 'weak'
        };
      }
      VKB.state.awaiting = false;
      var m = pushBot(a);
      rerender();
      // A question asked out loud is answered out loud, whether or not the
      // speaker toggle is on. The toggle is the setting for typed questions.
      if (fromSpeech) {
        VKB.screens.setSpeaking(true);
        VKB.voice.speak(spokenForm(m), { force: true });
      } else if (VKB.state.speakEnabled) {
        VKB.screens.setSpeaking(true);
        VKB.voice.speak(spokenForm(m));
      }
    }, 550 + Math.round(Math.random() * 350));
  }

  // What gets read aloud: the prose and the bullets, not the labels, URLs or
  // punctuation furniture.
  function spokenForm(m) {
    var parts = [];
    if (m.text) parts.push(Array.isArray(m.text) ? m.text.join(' ') : m.text);
    if (m.bullets && m.bullets.length) parts.push(m.bullets.join(', '));
    return parts.join(' ');
  }

  function personaChips() {
    var ps = (VKB.engine && VKB.engine.personas) || [];
    return ps.map(function (p) {
      return { label: p.label, value: 'persona:' + p.id };
    });
  }

  function send(text, opts) {
    if (VKB.state.awaiting) return;
    text = (text || '').trim();
    if (!text) return;
    var fromSpeech = !!(opts && opts.fromSpeech) || !!VKB.state.speechTurn;
    VKB.state.speechTurn = false;
    // The composer empties on send and stays empty: state.draft is the only
    // copy of it, and rerender() no longer reads the old field back in.
    VKB.state.draft = '';
    pushUser(text);
    answer(text, null, fromSpeech);
  }

  /* --------------------------------------------------------------- voice */

  function startDictation() {
    VKB.state.dictating = true;
    // Whatever is already in the composer stays in VKB.state.draft untouched —
    // it is the only copy, so there is nothing to read out of the DOM first.
    render();

    VKB.voice.startDictation({
      onInterim: function (partial) {
        VKB.screens.setTranscript(partial);
      },
      onLevel: function () { /* the canvas is driven inside voice.js */ }
    }).then(function (res) {
      // EVERY failure has to get the person out of the recording panel, not
      // just a denied microphone. A microphone held by another app used to
      // strand them there with no exit.
      if (!res || res.ok !== false) return;
      VKB.state.dictating = false;
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      VKB.voice.cancel();
      // Anything they had already typed before reaching for the mic is
      // theirs; a microphone that would not start is no reason to bin it.
      rerender();
      var input = document.getElementById('vkb-input');
      if (!input) return;
      input.placeholder =
        res.error === 'denied' ? 'Microphone is off. Type your question instead.' :
        res.error === 'busy'   ? 'The microphone is in use by another app. Type your question instead.' :
                                 'The microphone did not start. Type your question instead.';
      input.focus();
    });

    tickTimer();
  }

  var timerHandle = null;

  function tickTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (!VKB.state.dictating) { clearInterval(timerHandle); timerHandle = null; return; }
      var s = VKB.voice.elapsed();
      var t = document.querySelector('.chat__voice-time');
      if (t) t.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
    }, 250);
  }

  function stopDictation() {
    VKB.voice.stopDictation().then(function (res) {
      VKB.state.dictating = false;
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }

      // The words the person actually said are never thrown away because the
      // recogniser reported an error on its way out. Phones routinely do that
      // AFTER delivering good words, and binning the transcript at that point
      // is what left the journey with nothing to send.
      var heard = (res && res.transcript) || '';
      if (heard) VKB.state.draft = heard;
      VKB.state.speechTurn = !!(res && res.fromSpeech && heard);
      VKB.state.lastCorrections = (res && res.corrections) || [];

      // The transcript lands in the box so it can be corrected. It is never
      // sent on the person's behalf.
      rerender();
      var box = document.getElementById('vkb-input');
      if (box) {
        box.focus();
        box.setSelectionRange(box.value.length, box.value.length);
        if (!heard) {
          box.placeholder = (res && res.supported === false)
            ? 'Dictation is not available in this browser. Type your question instead.'
            : 'I did not catch that. Try again, or type your question.';
        }
      }
    });
  }

  function cancelDictation() {
    VKB.voice.cancel();
    VKB.state.dictating = false;
    VKB.state.speechTurn = false;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    rerender();
  }

  /* ------------------------------------------------------------- actions */

  var actions = {
    send: function () {
      send(VKB.state.draft);
    },

    chip: function (elm) {
      if (VKB.state.awaiting) return;
      var value = elm.getAttribute('data-value') || '';
      if (value.indexOf('persona:') === 0) {
        var id = value.slice('persona:'.length);
        VKB.state.persona = id;      // remembered for the whole conversation
        VKB.context.persona = id;    // and used as a scoring hint by the engine
        var p = (VKB.engine.personas || []).filter(function (x) { return x.id === id; })[0];
        pushUser(p ? p.label : id);
        VKB.state.awaiting = true;
        rerender();
        window.setTimeout(function () {
          VKB.state.awaiting = false;
          pushBot({
            text: p && p.blurb ? p.blurb : 'Here are the things people usually ask about.',
            chips: VKB.engine.starters(id),
            // 586:1948 puts this line directly above the options, inside the
            // message. It used to come from the dock panel; the panel is gone,
            // so the message carries its own lead line.
            chipsLabel: (VKB.copy && VKB.copy.optionsLabel) ||
              'What would you like to know about?',
            matchType: 'persona'
          });
          rerender();
        }, 450);
        return;
      }
      VKB.state.speechTurn = false;   // a tapped option is not a spoken turn
      send(value);
    },

    mic: function () { startDictation(); },
    stopDictation: function () { stopDictation(); },
    cancelDictation: function () { cancelDictation(); },

    speak: function () {
      VKB.state.speakEnabled = !VKB.state.speakEnabled;
      VKB.voice.setSpeakEnabled(VKB.state.speakEnabled);
      if (!VKB.state.speakEnabled) VKB.voice.stopSpeaking();
      rerender();
    },

    like: function (elm) { vote(elm, 'up'); },
    dislike: function (elm) { vote(elm, 'down'); },

    copy: function (elm) {
      var m = messageById(elm.getAttribute('data-id'));
      if (!m) return;
      writeClipboard(spokenForm(m));
      VKB.screens.copiedFeedback(elm);
    },

    regenerate: function (elm) {
      // Re-ask the question that produced this answer.
      var id = elm.getAttribute('data-id');
      var idx = indexById(id);
      for (var i = idx - 1; i >= 0; i--) {
        if (VKB.state.messages[i].who === 'user') {
          var q = VKB.state.messages[i].text;
          VKB.state.messages = VKB.state.messages.slice(0, idx);
          answer(q);
          return;
        }
      }
    },

    share: function () {
      VKB.state.shareOpen = true;
      VKB.state.shareCopied = false;
      rerender();
    },

    closeShare: function () {
      VKB.state.shareOpen = false;
      VKB.state.shareCopied = false;
      rerender();
    },

    copyLink: function () {
      writeClipboard(VKB.state.shareUrl);
      VKB.state.shareCopied = true;
      rerender();
    },

    reset: function () {
      VKB.voice.cancel();
      VKB.voice.stopSpeaking();
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      VKB.state = initialState();
      VKB.context = { persona: null };
      greet();
    },

    askReset: function () {
      if (VKB.state.messages.length <= 1) { actions.reset(); return; }
      VKB.state.confirmReset = true;
      rerender();
    },

    cancelReset: function () {
      VKB.state.confirmReset = false;
      rerender();
    },

    jumpLatest: function () { VKB.screens.scrollToLatest(); },

    stopSpeaking: function () {
      if (VKB.voice && VKB.voice.stopSpeaking) VKB.voice.stopSpeaking();
      VKB.screens.setSpeaking(false);
    },

    noop: function () {}
  };

  function vote(elm, dir) {
    var m = messageById(elm.getAttribute('data-id'));
    if (!m) return;
    m.vote = m.vote === dir ? null : dir;
    rerender();
  }

  function messageById(id) {
    var i = indexById(id);
    return i === -1 ? null : VKB.state.messages[i];
  }

  function indexById(id) {
    for (var i = 0; i < VKB.state.messages.length; i++) {
      if (VKB.state.messages[i].id === id) return i;
    }
    return -1;
  }

  // Clipboard is best-effort. It is never allowed to throw at the person.
  function writeClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        return;
      }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e2) { /* nothing more we can do, and it is not worth an error */ }
  }

  function flash(elm) {
    elm.classList.add('is-on');
    window.setTimeout(function () { elm.classList.remove('is-on'); }, 900);
  }

  /* ------------------------------------------------- the one click handler */

  function onClick(ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var actEl = t.closest('[data-act]');
    if (!actEl) return;
    var name = actEl.getAttribute('data-act');
    var fn = actions[name];
    if (!fn) return;
    ev.preventDefault();
    fn(actEl);
  }

  // The composer's own delegated listener. CONTRACT.md forbids listeners in
  // the SCREEN functions; the orchestrator is where they belong, and this is
  // the single point at which typing reaches the state. Delegated on document
  // so it survives the input element being replaced on every render.
  function onInput(ev) {
    var t = ev.target;
    if (!t || t.id !== 'vkb-input') return;
    VKB.state.draft = t.value;
    VKB.screens.syncComposer(VKB.state);
  }

  function onKey(ev) {
    // Escape closes whatever is open. A modal with no keyboard exit is a
    // dead end for anyone not using a touchscreen.
    if (ev.key === 'Escape') {
      if (VKB.state.shareOpen) { actions.closeShare(); return; }
      if (VKB.state.confirmReset) { actions.cancelReset(); return; }
      if (VKB.state.dictating) { cancelDictation(); return; }
    }
    if (ev.key === 'Tab' && (VKB.state.shareOpen || VKB.state.confirmReset)) {
      VKB.screens.trapTab(ev);
      return;
    }
    if (ev.key !== 'Enter' || ev.shiftKey) return;
    var t = ev.target;
    if (!t || t.id !== 'vkb-input') return;
    ev.preventDefault();
    actions.send(t);
  }

  /* ------------------------------------------------------------------ boot */

  function greet() {
    pushBot({
      text: (VKB.copy && VKB.copy.greeting) ||
        "Hello! I'm your AI assistant. I can help you with any query you have " +
        'related to RAKEZ. How can I help you today?',
      chips: personaChips(),
      // The Figma lead line (586:2076) now sits INSIDE the greeting, above the
      // greeting's own options, instead of heading a second list in the dock.
      chipsLabel: (VKB.copy && VKB.copy.optionsLabel) ||
        'What would you like to know about?',
      matchType: 'persona'
    });
    render();
  }

  function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('input', onInput);
    document.addEventListener('scroll', function (ev) {
      if (ev.target && ev.target.id === 'vkb-list') VKB.screens.onListScroll();
    }, true);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        VKB.voice.cancel();
        VKB.voice.stopSpeaking();
        if (VKB.state.dictating) { VKB.state.dictating = false; rerender(); }
      }
    });
    window.addEventListener('pagehide', function () {
      VKB.voice.cancel();
      VKB.voice.stopSpeaking();
    });

    greet();
  }

  VKB.send = send;
  VKB.render_ = render;
  VKB.boot = boot;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
