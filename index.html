ermit","difference between entry permit and residence visa","e-visa validity","how long is my entry permit valid","entry permit expiring"],"keywords":["entry","permit","evisa","e-visa","difference","validity","valid","60","days","expire","expiring","extension"],"title":"Entry permit vs residence visa","answer":"An entry permit is the document that lets you enter the UAE legally for a short period. The residence visa is issued afterwards, once you are inside the country. The entry permit comes first; the residence visa follows the medical and Emirates ID steps.","bullets":["The RAKEZ e-visa (entry permit) is valid for 60 days from the date of issue","If you are abroad, immigration activates the permit when you land","If you are already in the UAE, RAKEZ activates it for you — this is the step that carries the AED 985 charge","An entry permit can be amended (name, details) for AED 485 in 4 days, or AED 985 in 2 days"],"facts":[{"label":"e-visa validity","value":"60 days from issue","confidence":"confirmed"},{"label":"Entry permit amendment","value":"AED 485 (4 days) or AED 985 urgent (2 days)","confidence":"confirmed"}],"followUps":["My entry permit is about to expire, what do I do?","What is the visa process step by step?","How much is activation?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/entry-permits-and-residence-visa"},{"id":"visa-validity-duration","persona":["visa-seeker"],"questions":["how long is a residence visa valid","visa validity years","is my visa 2 years or 3","how many years residence visa","visa duration"],"keywords":["validity","valid","duration","years","long","2","3","10","golden","how","residence","expire"],"title":"How long a residence visa lasts","answer":"Sponsored residence visas in the UAE are issued for 1, 2 or 3 years. Unsponsored long-term visas such as the Golden Visa run for 5 or 10 years. RAKEZ will tell you the exact term on your own visa when it is issued.","bullets":["Sponsored residence visa — 1, 2 or 3 years","Unsponsored long-term visa — 5 or 10 years","Golden Visa — 10 years","A residence visa becomes void automatically if you stay outside the UAE continuously for more than 180 days, with some exceptions"],"facts":[{"label":"Sponsored visa terms","value":"1, 2 or 3 years","confidence":"confirmed"},{"label":"Golden Visa","value":"10 years","confidence":"confirmed"},{"label":"Time you may stay outside the UAE","value":"Up to 180 days continuously, or the visa becomes void (exceptions exist for students, patients, diplomats and others)","confidence":"confirmed"}],"followUps":["What is the 180 day rule?","How do I renew my visa?","What is the Golden Visa?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"180-day-rule","persona":["visa-seeker"],"questions":["180 day rule","how long can i stay outside the uae","will my visa be cancelled if i leave","i have been abroad 6 months","visa void outside uae"],"keywords":["180","days","outside","abroad","away","travel","stay","void","cancelled","six","months","rule"],"title":"The 180-day rule","answer":"If you stay outside the UAE for more than 180 days in a row, your residence visa becomes void automatically. To keep it alive you must re-enter within 180 days of leaving. There are exceptions for students, medical patients, diplomats and some other categories.","bullets":["Re-enter the UAE within 180 days of your last exit","Beyond that the visa is void and has to be started again","RAKEZ repeats this warning on its visa and visa renewal pages","If you are already past 180 days, contact RAKEZ before booking a flight"],"facts":[{"label":"Maximum time outside the UAE","value":"180 continuous days","confidence":"confirmed"}],"followUps":["How do I renew my visa?","What happens if my visa has expired?","How do I contact RAKEZ?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"dependent-visa-eligibility","persona":["visa-seeker"],"questions":["can my family come","can i sponsor my wife","can i bring my children","dependent visa eligibility","family visa salary requirement","sponsor my husband","how much salary to sponsor family"],"keywords":["family","dependent","dependant","wife","husband","spouse","children","child","kids","son","daughter","sponsor","salary","4000","3000","newborn","baby"],"title":"Bringing your family on a dependent visa","answer":"Yes, once you hold a valid UAE residence visa you can sponsor your spouse and children. You need to earn at least AED 4,000 a month, or AED 3,000 a month if your company provides your accommodation. RAKEZ processes dependent visas through Portal 360.","bullets":["You can sponsor a spouse, children of any age, and babies born in the UAE","Minimum salary AED 4,000 a month, or AED 3,000 plus company accommodation","Your own residence visa must be valid first","Family members aged 18 and over must pass the medical fitness test","If a dependent enters on an entry permit, you have 60 days to apply for their residence visa","A sponsor must cancel dependents' visas before cancelling their own"],"facts":[{"label":"Minimum sponsor salary","value":"AED 4,000 per month, or AED 3,000 plus accommodation","confidence":"confirmed"},{"label":"Deadline after dependent enters on entry permit","value":"60 days","confidence":"confirmed"},{"label":"Who can be sponsored","value":"Spouse, children, newborns born in the UAE","confidence":"confirmed"}],"followUps":["How much does a dependent visa cost?","What documents do I need for a family visa?","Can I sponsor my parents?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-dependents"},{"id":"dependent-visa-cost","persona":["visa-seeker"],"questions":["how much is a dependent visa","family visa cost","cost to bring my wife","child visa price","newborn visa cost","dependent visa fees"],"keywords":["dependent","dependant","family","wife","spouse","child","children","newborn","baby","cost","price","fee","fees","aed","how","much","deposit"],"title":"What a dependent visa costs","answer":"A new dependent visa is AED 3,375 for a spouse or a child aged 18 and over, and AED 3,075 for a child under 18. A newborn already inside the UAE is AED 1,505. If the sponsor is an investor or partner there is also a refundable deposit of AED 3,310 per dependent. Prices exclude VAT.","bullets":["Spouse or child 18+ — AED 3,375","Child under 18 — AED 3,075","Newborn inside the UAE — AED 1,505, or AED 2,005 urgent","Investor or partner sponsors pay an extra AED 3,310 refundable deposit per dependent","Normal processing 9 working days","RAKEZ's VIP visa packages carry a 20% discount on dependent visas"],"facts":[{"label":"Spouse / child 18+","value":"AED 3,375","confidence":"confirmed"},{"label":"Child under 18","value":"AED 3,075","confidence":"confirmed"},{"label":"Newborn inside UAE","value":"AED 1,505 normal, AED 2,005 urgent","confidence":"confirmed"},{"label":"Refundable deposit (investor/partner sponsor)","value":"AED 3,310 per dependent","confidence":"confirmed"},{"label":"Processing time","value":"9 working days (normal)","confidence":"confirmed"}],"followUps":["What documents do I need for a dependent visa?","What is the salary requirement?","How do I renew a dependent visa?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-dependents"},{"id":"dependent-visa-documents","persona":["visa-seeker"],"questions":["what documents for a dependent visa","family visa documents","do i need my marriage certificate","papers for wife visa","dependent visa requirements"],"keywords":["dependent","dependant","family","documents","paperwork","marriage","certificate","tenancy","ejari","birth","attested","translation","requirements","wife","child"],"title":"Documents for a dependent visa","answer":"You need the dependent's passport and photo, proof that you are their sponsor, proof of where you live, and health insurance for them. A spouse also needs an attested marriage certificate with an Arabic translation.","bullets":["Dependent's valid passport","Recent colour photo on a white background","Sponsor's passport with valid residence visa","Attested tenancy contract or proof of property ownership","Valid health insurance from an immigration-approved provider","For a spouse: attested marriage certificate with Arabic translation","Documents not in English or Arabic need a certified translation"],"facts":[{"label":"Marriage certificate","value":"Required for a spouse, attested and translated into Arabic","confidence":"confirmed"},{"label":"Accommodation proof","value":"Attested tenancy contract or property ownership document","confidence":"confirmed"}],"followUps":["How much does a dependent visa cost?","What is the salary requirement?","How long does it take?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-dependents"},{"id":"dependent-visa-renewal","persona":["visa-seeker"],"questions":["renew dependent visa","family visa renewal cost","how much to renew my wifes visa","child visa renewal","dependent renewal time"],"keywords":["renew","renewal","dependent","dependant","family","wife","child","cost","price","1705","1405","urgent"],"title":"Renewing a dependent visa","answer":"Dependent visa renewal is AED 1,705 normally or AED 2,705 urgent. For a child under 18 it is AED 1,405, or AED 2,405 urgent. Normal processing is 5 working days. Both the sponsor and the dependent need to be in the UAE.","bullets":["Dependent renewal — AED 1,705 normal, AED 2,705 urgent","Child under 18 — AED 1,405 normal, AED 2,405 urgent","5 working days on the standard timeline","Same steps as a new visa: apply on Portal 360, medical, Emirates ID renewal, then the visa is issued","Investor and partner sponsors have a refundable AED 3,310 deposit per dependent"],"facts":[{"label":"Dependent renewal","value":"AED 1,705 normal / AED 2,705 urgent","confidence":"confirmed"},{"label":"Child under 18 renewal","value":"AED 1,405 normal / AED 2,405 urgent","confidence":"confirmed"},{"label":"Processing","value":"5 working days","confidence":"confirmed"}],"followUps":["How do I renew my own visa?","What documents do I need?","How do I pay?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-renewal-dependents"},{"id":"visa-renewal-employee","persona":["visa-seeker"],"questions":["how do i renew my visa","visa renewal process","renew employee visa","renew my residence visa","visa renewal steps","how long renewal visa"],"keywords":["renew","renewal","visa","residence","employee","steps","process","medical","again","expiring","extend"],"title":"Renewing an employee residence visa","answer":"Renewal is the same shape as a new visa but shorter: apply on Portal 360, do the medical again, renew the Emirates ID, then receive the new visa. You have to be inside the UAE to renew.","bullets":["1. Apply on Portal 360 — the applicant must be inside the UAE","2. Medical fitness test at the RAKEZ Medical Fitness Centre or any UAE-approved centre","3. Emirates ID renewal application","4. Receive the digital visa and the physical Emirates ID card","Documents: passport valid 6+ months, white-background photo, the previous residence visa, valid health insurance. Iraqi nationals also need their National Identity Card."],"facts":[{"label":"VIP renewal","value":"AED 6,414, 1 working day","confidence":"confirmed"},{"label":"Standard renewal","value":"AED 3,500, 4 working days","confidence":"confirmed"},{"label":"Must be in the UAE?","value":"Yes","confidence":"confirmed"}],"followUps":["How much is investor visa renewal?","What happens if my visa expires?","Do I need another medical?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-renewal-employee"},{"id":"visa-renewal-investor","persona":["visa-seeker"],"questions":["renew investor visa","partner visa renewal cost","how much to renew my own visa as owner","shareholder visa renewal"],"keywords":["renew","renewal","investor","partner","shareholder","owner","cost","6449","3535","vip"],"title":"Renewing an investor or partner visa","answer":"Investor and partner visa renewal is AED 6,449 on the VIP package, done in 1 working day, or AED 3,535 on the standard package in 4 working days. You must be inside the UAE and you repeat the medical test.","bullets":["VIP — AED 6,449, 1 working day","Standard — AED 3,535, 4 working days","Apply on Portal 360, medical fitness test, Emirates ID renewal, then the visa is issued","Documents: passport valid 6+ months, white-background photo, previous residence visa, valid health insurance"],"facts":[{"label":"VIP investor/partner renewal","value":"AED 6,449, 1 working day","confidence":"confirmed"},{"label":"Standard investor/partner renewal","value":"AED 3,535, 4 working days","confidence":"confirmed"}],"followUps":["What is in the VIP package?","Do I need a new medical?","How do I pay?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-renewal-investor-partner"},{"id":"visa-expiring-or-expired","persona":["visa-seeker"],"questions":["my visa is expiring","my visa has expired","what happens if my visa expires","overstay fine","grace period after visa expiry","visa expired what do i do"],"keywords":["expire","expired","expiring","expiry","overstay","overstaying","fine","fines","penalty","grace","period","late","lapsed","50"],"title":"If your visa is expiring or has expired","answer":"Start the renewal before the expiry date — that is the only clean path. If a residence visa expires or is cancelled, UAE residents get a grace period to either leave, renew or transfer, and overstaying past it carries a daily fine. Because these rules change, confirm your own dates with RAKEZ before you rely on them.","bullets":["Renew before expiry — apply on Portal 360 while you are inside the UAE","Standard employee renewal is AED 3,500 and takes 4 working days, so leave more than a week","After a residence permit expires or is cancelled, residents are given a grace period which the UAE government describes as reaching up to 6 months depending on the resident category","Overstaying carries a daily fine — the UAE government portal states AED 50 per day for residence visa overstays","If you have already overstayed, call RAKEZ on 600 577 000 before booking travel"],"facts":[{"label":"Grace period after expiry or cancellation","value":"Up to 6 months depending on resident category — confirm your own category with RAKEZ or ICP","confidence":"varies"},{"label":"Overstay fine","value":"AED 50 per day per the UAE government portal — fine levels have changed before, confirm the current rate","confidence":"varies"},{"label":"Where to renew","value":"Portal 360, while inside the UAE","confidence":"confirmed"}],"followUps":["How do I renew my visa?","How do I contact RAKEZ?","What is the 180 day rule?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"visa-cancellation","persona":["visa-seeker"],"questions":["how do i cancel a visa","visa cancellation cost","cancel employee visa","i am leaving the company","how long does cancellation take","cancel my residence visa"],"keywords":["cancel","cancellation","cancelling","leaving","resign","resignation","terminate","385","770","urgent","royal","exit"],"title":"Cancelling a visa","answer":"The company cancels an employee's visa through Portal 360. The cost depends on whether the person is inside or outside the UAE and how fast you want it. After cancellation you must leave the country or move onto a new visa before the grace period ends.","bullets":["Applicant inside the UAE — AED 385 normal (4 days), AED 885 urgent (2 days), AED 1,385 royal (1 day)","Applicant outside the UAE — AED 770 normal, AED 1,270 urgent, AED 1,770 royal","Documents: passport copy and residence visa / e-visa copy. If the person is abroad, the original passport is also needed in some cases.","You receive a Cancellation Document through Portal 360","Only the sponsor can cancel a visa — the visa holder cannot do it themselves","A sponsor must cancel their dependents' visas before cancelling their own"],"facts":[{"label":"Cancellation, inside UAE","value":"AED 385 normal (4 days) / AED 885 urgent (2 days) / AED 1,385 royal (1 day)","confidence":"confirmed"},{"label":"Cancellation, outside UAE","value":"AED 770 / AED 1,270 / AED 1,770","confidence":"confirmed"},{"label":"Who can cancel","value":"Only the sponsor","confidence":"confirmed"}],"followUps":["What is the grace period after cancellation?","How do I close my company?","Can I transfer my visa to another company?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-cancellation-employee"},{"id":"visa-amendment","persona":["visa-seeker"],"questions":["change my job title on my visa","new passport visa transfer","amend my visa","correct my name on visa","visa amendment cost"],"keywords":["amend","amendment","change","correct","name","job","title","designation","passport","transfer","1070","585","485"],"title":"Changing details on a visa","answer":"You can change a name, a job title, or move a valid visa into a new passport. Your visa must have at least 7 working days left to apply. Apply through Portal 360 while you are inside the UAE.","bullets":["Residence visa amendment — AED 1,070 (4 days) or AED 1,570 urgent (2 days)","Transfer visa to a new passport, same nationality — AED 585 (4 days) or AED 1,085 urgent (2 days)","Entry permit amendment — AED 485 (4 days) or AED 985 urgent (2 days)","Documents: passport valid 6+ months, white-background photo, and the supporting document (legal name change certificate, promotion letter, or copies of the old and new passports)","If the name change is for an investor, partner or manager, you also need a KYC update in the portal"],"facts":[{"label":"Minimum visa validity to apply","value":"7 working days","confidence":"confirmed"},{"label":"Residence visa amendment","value":"AED 1,070 standard / AED 1,570 urgent","confidence":"confirmed"},{"label":"Transfer to new passport","value":"AED 585 standard / AED 1,085 urgent","confidence":"confirmed"}],"followUps":["What is a KYC update?","How do I use Portal 360?","How much is visa renewal?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-amendments"},{"id":"health-insurance","persona":["visa-seeker"],"questions":["do i need health insurance for a visa","health insurance cost rakez","medical insurance plans","insurance for visa","how much is health insurance"],"keywords":["health","insurance","medical","cover","coverage","plan","plans","basic","essential","elite","350","450","750"],"title":"Health insurance for a visa","answer":"Valid health insurance from an immigration-approved provider is on the document list for every RAKEZ visa — new and renewal, employee, investor and dependent. RAKEZ offers three plans you can buy through the portal.","bullets":["Basic — AED 350 a year, AED 40,000 cover, emergency admission in the Northern Emirates","Essential — AED 450 a year, AED 50,000 cover, adds doctor consultation in the Northern Emirates and pre-existing conditions after a 12-month wait","Elite — AED 750 a year, AED 150,000 cover, UAE-wide emergency admission, maternity, physiotherapy and networks across the UAE and Asia","The Essential plan is included in the VIP visa package","You can use another insurer as long as immigration approves it"],"facts":[{"label":"Basic plan","value":"AED 350/year, AED 40,000 cover","confidence":"confirmed"},{"label":"Essential plan","value":"AED 450/year, AED 50,000 cover","confidence":"confirmed"},{"label":"Elite plan","value":"AED 750/year, AED 150,000 cover","confidence":"confirmed"},{"label":"Is it mandatory?","value":"Listed as a required document on RAKEZ visa applications","confidence":"confirmed"}],"followUps":["What documents do I need for a visa?","What is in the VIP package?","How do I pay?"],"source":"https://rakez.com/en/service-cards/visa-services/health-insurance-plan"},{"id":"golden-visa","persona":["visa-seeker"],"questions":["golden visa","10 year visa","long term residency uae","can i get a golden visa through rakez","golden visa eligibility"],"keywords":["golden","10","ten","year","long","term","residency","investor","talent","entrepreneur","specialist"],"title":"The Golden Visa","answer":"The Golden Visa is a 10-year UAE residency that does not need a national sponsor. Holders can live, work and study in the UAE and bring their families. RAKEZ supports applications across six categories.","bullets":["Investor","Real estate investor","Specialist","Humanitarian pioneer","Specialised talent","Entrepreneur"],"facts":[{"label":"Duration","value":"10 years","confidence":"confirmed"},{"label":"National sponsor needed?","value":"No","confidence":"confirmed"},{"label":"Investment thresholds and fees","value":"Not published on the RAKEZ Golden Visa page — thresholds are set per category by the UAE authorities. Ask RAKEZ for the criteria for your category.","confidence":"unconfirmed"}],"followUps":["How do I contact RAKEZ?","What other visa types are there?","Can my family come?"],"source":"https://rakez.com/en/customer-services/golden-visa"},{"id":"visa-quota","persona":["visa-seeker","setter-upper"],"questions":["how many visas can i get","visa quota","how many visas with a flexi desk","visa allocation office size","can i get more visas"],"keywords":["quota","how","many","visas","allocation","limit","flexi","desk","workstation","office","size","more","additional"],"title":"How many visas your company can have","answer":"Your visa quota is tied to the facility you lease, not to the licence alone. A shared workstation or flexi desk is limited to one visa. Bigger physical offices carry bigger quotas. If you downgrade from a physical office to a shared workstation, you have to cancel visas above the new limit.","bullets":["Flexi desk / shared workstation — 1 visa, per RAKEZ's own FAQ","Physical offices and warehouses carry higher quotas that depend on the size of the space","Downgrading your facility reduces your quota and forces cancellation of the extra visas","The SME all-inclusive package includes 1 visa and allows up to 3 more at AED 4,000 each"],"facts":[{"label":"Flexi desk quota","value":"1 visa","confidence":"confirmed"},{"label":"Office and warehouse quotas","value":"Depend on the size of the facility — RAKEZ does not publish a table. Ask your Business Development contact for the quota on the specific unit.","confidence":"unconfirmed"},{"label":"Extra visas on the SME package","value":"Up to 3 more at AED 4,000 each","confidence":"confirmed"}],"followUps":["What is a flexi desk?","How much does a visa cost?","What facilities does RAKEZ have?"],"source":"https://rakez.com/en/faqs"},{"id":"e-channel","persona":["visa-seeker","everyone"],"questions":["what is e channel","echannel registration","do i have to register for e channel","e channel fee","immigration file registration"],"keywords":["echannel","e-channel","channel","immigration","file","moi","registration","register","deposit","2200","2300","mandatory"],"title":"E-Channel registration","answer":"E-Channel is the UAE's unified online immigration system. Any company with an immigration file has to be registered — the Ministry of Interior made it mandatory from 1 March 2018. RAKEZ completes the registration on your behalf; you cannot do it yourself through the MOI portal.","bullets":["Mandatory for every company with an immigration file, even if you never apply for a visa","RAKEZ registers on your behalf — the MOI only gives credentials to the sponsor","Visa applications go through RAKEZ as sponsor, not directly through E-Channel","If your immigration file has already expired you can still register — you pay the renewal, the late penalty and the registration fee together","Companies in the process of closing are currently exempt"],"facts":[{"label":"Registration fee","value":"RAKEZ's FAQ says AED 2,200 plus a one-time refundable deposit of AED 5,050; the shareholder-change service page lists E-Channel registration at AED 2,300. Confirm the current figure with RAKEZ.","confidence":"varies"},{"label":"Annual renewal","value":"AED 1,200 per the FAQ; AED 1,300 per the amendments service page. Confirm with RAKEZ.","confidence":"varies"},{"label":"Mandatory since","value":"1 March 2018","confidence":"confirmed"}],"followUps":["How do I apply for a visa?","How do I pay RAKEZ?","What is Portal 360?"],"source":"https://rakez.com/en/faqs"},{"id":"working-on-visit-visa","persona":["visa-seeker"],"questions":["can i work on a visit visa","start working while my visa is processed","is it ok to work on a tourist visa","work before residence visa"],"keywords":["work","working","visit","tourist","visa","legal","illegal","allowed","before","while","waiting"],"title":"Working before your residence visa is issued","answer":"No. Working in the UAE on a visit or tourist visa is illegal. You need the right employment visa in place first. If someone needs to start sooner, ask RAKEZ about a temporary work permit.","bullets":["Working on a non-employment visa is against UAE law","RAKEZ offers temporary work permits and non-sponsored ID cards as legitimate alternatives","GCC nationals, people sponsored by a relative, and part-time or temporary staff can be employed as non-sponsored employees with RAKEZ approval"],"facts":[{"label":"Working on a visit visa","value":"Not permitted","confidence":"confirmed"},{"label":"Non-sponsored employees","value":"Allowed with RAKEZ approval — GCC nationals, relative-sponsored residents, part-time/temporary staff, and staff of subsidiary or associated companies","confidence":"confirmed"}],"followUps":["What is a temporary work permit?","How long does an employee visa take?","What is a non-sponsored employee?"],"source":"https://rakez.com/en/faqs"},{"id":"renewal-when","persona":["renewer"],"questions":["when do i renew my licence","when should i start renewal","how early can i renew","renewal notice","when does my licence expire","how long renewal take"],"keywords":["when","renew","renewal","start","early","notice","quotation","quote","60","days","expiry","expire","licence","license","deadline"],"title":"When to renew your licence","answer":"Renew before the expiry date printed on your licence. RAKEZ emails your renewal quotation 60 days before expiry, and quotations are only generated in the last two months. Once you pay, the renewed e-licence is issued instantly.","bullets":["Quotation is emailed to your registered address 60 days before expiry","Quotations cannot be generated earlier than two months before expiry","If you did not receive it, request one from customerservice@rakez.com","Renewal is instant once all requirements are satisfied and payment clears","Amendment requests are only accepted from 60 days before expiry, so plan changes into the same window"],"facts":[{"label":"Quotation sent","value":"60 days before expiry","confidence":"confirmed"},{"label":"Earliest a quotation can be generated","value":"2 months before expiry","confidence":"confirmed"},{"label":"Turnaround once paid","value":"Instant — the e-licence is issued on payment","confidence":"confirmed"}],"followUps":["Is there a grace period?","What documents do I need?","What does renewal cost?"],"source":"https://rakez.com/en/faqs"},{"id":"renewal-grace-period","persona":["renewer"],"questions":["is there a grace period","how long after expiry can i renew","grace period licence renewal","what if i miss the date","do i get extra time"],"keywords":["grace","period","extra","time","after","expiry","late","miss","missed","deadline","buffer"],"title":"Is there a grace period after expiry?","answer":"No. RAKEZ states plainly that there is no grace period after the licence expiry date. The late penalty starts counting from the day the licence expires.","bullets":["No grace period at all","The AED 50 per day late penalty runs from the licence expiry date","Late renewal also risks penalties from Immigration and the Corporate Tax Authority, not just RAKEZ","Your own and your employees' visa status can be affected"],"facts":[{"label":"Grace period","value":"None","confidence":"confirmed"},{"label":"Late penalty starts","value":"From the licence expiry date","confidence":"confirmed"}],"followUps":["What is the late fine?","What happens if I never renew?","Can I pay in instalments?"],"source":"https://renewalsupport.rakez.com/"},{"id":"renewal-late-penalty","persona":["renewer"],"questions":["what is the fine for late renewal","late renewal penalty","how much is the daily fine","i renewed late what do i pay","penalty per day licence"],"keywords":["fine","fines","penalty","penalties","late","daily","per","day","50","charge","overdue","expired"],"title":"The late renewal fine","answer":"RAKEZ charges AED 50 per day from the licence expiry date until you renew. That figure appears both in the RAKEZ FAQ and on the official free zone renewal checklist. There is nothing to waive — the only way to stop it is to renew.","bullets":["AED 50 per day, counted from the expiry date","On top of that, immigration and corporate tax penalties can apply separately","Services can be interrupted while the licence is expired","If the licence stays unrenewed for 6 months the company can be struck off"],"facts":[{"label":"Late renewal penalty","value":"AED 50 per day","confidence":"confirmed"},{"label":"Strike-off trigger","value":"6 months without renewal","confidence":"confirmed"}],"followUps":["What happens if my company is struck off?","Can I pay in instalments?","How do I renew?"],"source":"https://rakez.com/en/faqs"},{"id":"renewal-cost","persona":["renewer"],"questions":["how much does renewal cost","renewal price","what does it cost to renew my licence","licence renewal fee","renewal cost rakez"],"keywords":["cost","costs","price","fee","fees","how","much","renewal","renew","licence","license","quote","quotation","aed"],"title":"What licence renewal costs","answer":"RAKEZ does not publish one renewal price. It depends on your licence type, your activities and your facility. Your renewal quotation — emailed 60 days before expiry — is the actual number for your company.","bullets":["Price depends on licence type, activities and the facility you lease","Your quotation arrives by email 60 days before expiry; request one from customerservice@rakez.com if it did not","Renewing for 2, 3 or 5 years at once is offered as a way to save","The SME all-inclusive package advertises the same price at renewal as at setup","Adding visas, activities or a bigger facility at renewal changes the price"],"facts":[{"label":"Published renewal price","value":"None — RAKEZ states it varies by licence type, activity and facility","confidence":"confirmed"},{"label":"Where to get your number","value":"Your renewal quotation, or customerservice@rakez.com","confidence":"confirmed"}],"followUps":["Can I renew for more than one year?","Can I pay in instalments?","Can I change my package at renewal?"],"source":"https://rakez.com/en/service-cards/renewals/license-renewal-freezone"},{"id":"renewal-documents","persona":["renewer"],"questions":["what documents do i need to renew","renewal checklist","licence renewal documents","what do i upload for renewal","renewal paperwork"],"keywords":["documents","document","checklist","upload","paperwork","need","renewal","renew","passport","lease","noc","good","standing"],"title":"Documents for licence renewal","answer":"For most small companies it is short: fresh passport copies if any expired, and a signed lease if you have a physical facility. Corporate shareholders and regulated activities need more.","bullets":["Valid passport copy for each individual shareholder, director and manager — only if the copy RAKEZ holds has expired","Corporate shareholder registered in the UAE mainland: valid DED trade licence copy","Corporate shareholder registered in a free zone or abroad: Certificate of Good Standing or Commercial Register extract, notarised and legalised up to UAE embassy level","Chamber of Commerce membership renewal forms, signed by the manager or authorised signatory","Two signed copies of the lease agreement if you have a physical facility","NOCs or third-party approvals where your activity is regulated","Documents not in English or Arabic need a certified translation"],"facts":[{"label":"Audited financial statements at renewal","value":"Not required for renewal","confidence":"confirmed"},{"label":"Where to submit","value":"Portal 360","confidence":"confirmed"}],"followUps":["How do I renew online?","What does renewal cost?","Do I need to submit accounts?"],"source":"https://rakez.com/Upload/ManageDocument/Checklist-Licence-Renewal-Free-Zone_20200408145636.pdf"},{"id":"renewal-how-online","persona":["renewer"],"questions":["can i renew online","how do i renew my licence online","renew from abroad","renew on the app","renewal steps portal"],"keywords":["online","portal","app","mobile","renew","renewal","abroad","overseas","remote","steps","digital"],"title":"Renewing online","answer":"Yes, entirely. Renewal runs through Portal 360 or the RAKEZ mobile app and you can do it from anywhere in the world. There is no need to come to an office.","bullets":["1. Initiate the renewal request on Portal 360 or the RAKEZ app","2. Pay the renewal fee","3. Upload any required documents","4. Receive the renewed e-licence — issued instantly once everything is satisfied","You also get a renewed Immigration File e-card and Chamber of Commerce certificate where those apply"],"facts":[{"label":"Can you renew from outside the UAE?","value":"Yes","confidence":"confirmed"},{"label":"Turnaround","value":"Instant on payment, once requirements are satisfied","confidence":"confirmed"}],"followUps":["How do I get Portal 360 access?","What documents do I need?","How can I pay?"],"source":"https://rakez.com/en/service-cards/renewals/license-renewal-freezone"},{"id":"renewal-payment-options","persona":["renewer","everyone"],"questions":["how can i pay for renewal","can i pay in instalments","payment options renewal","tabby rakez","split the payment","bank transfer problem"],"keywords":["pay","payment","instalment","installment","instalments","tabby","credit","card","bank","transfer","wallet","ansari","direct","debit","split"],"title":"Ways to pay your renewal","answer":"RAKEZ takes several payment routes and offers instalments if a single transfer is difficult.","bullets":["Tabby — interest-free instalments","Credit card instalments","The payment link included in your renewal quotation","Bank transfer","Al Ansari Exchange e-wallet top-up","Direct debit","Top up your portal account balance, or pay a cashier at the RAKEZ Business Service Centre"],"facts":[{"label":"Instalments available?","value":"Yes — Tabby and credit card instalments","confidence":"confirmed"}],"followUps":["What does renewal cost?","What is the e-wallet?","How do I renew online?"],"source":"https://renewalsupport.rakez.com/"},{"id":"renewal-multi-year","persona":["renewer","setter-upper"],"questions":["can i renew for more than one year","multi year licence","3 year licence","5 year renewal","long term licence discount"],"keywords":["multi","year","years","2","3","5","three","five","long","term","discount","save","validity"],"title":"Multi-year licences and renewals","answer":"Most RAKEZ licences run for one year, but several types can be issued or renewed for three years at a discounted rate. The renewal team also offers 2, 3 and 5 year renewals. Ask for the exact terms on your licence type.","bullets":["Standard licence validity is one year from issue","Commercial, Service, General Trading, Individual/Professional and E-commerce licences may be issued or renewed for three years at a discount","The renewal support page offers 2, 3 or 5 year renewals for greater savings","Not every licence type qualifies — industrial and regulated activities may be excluded"],"facts":[{"label":"Standard validity","value":"1 year","confidence":"confirmed"},{"label":"Three-year option","value":"Available on Commercial, Service, General Trading, Individual/Professional and E-commerce licences at a discounted rate","confidence":"confirmed"},{"label":"5-year renewal","value":"Offered on the renewal support page; the FAQ only mentions three years. Confirm eligibility for your licence type.","confidence":"varies"}],"followUps":["What does renewal cost?","Can I change my package at renewal?","What licence types are there?"],"source":"https://rakez.com/en/faqs"},{"id":"renewal-change-activity","persona":["renewer"],"questions":["can i change my activity at renewal","add an activity","change of activity cost","add business activity to licence","amend my licence activities"],"keywords":["change","add","activity","activities","amend","amendment","1999","bundle","additional","new","licence","type"],"title":"Changing or adding activities","answer":"You can add, remove or replace activities on your licence. RAKEZ charges AED 1,999 for the amendment and it takes 5 to 7 working days. Note that amendment requests are only accepted from 60 days before expiry if you are doing it around renewal.","bullets":["Activity or licence amendment — AED 1,999, 5 to 7 working days","A second amendment gets 30% off","Extra activity outside your bundle — AED 1,000 a year standard, AED 5,000 a year for special activities","Adding an activity from a different licence type needs a separate licence, not an amendment","You need a shareholder resolution signed by all shareholders, plus the amendment application form","You may have to change the company name too, if the current name no longer matches the new activity"],"facts":[{"label":"Activity amendment fee","value":"AED 1,999","confidence":"confirmed"},{"label":"Processing time","value":"5 to 7 working days","confidence":"confirmed"},{"label":"Out-of-bundle activity","value":"AED 1,000/year standard, AED 5,000/year special","confidence":"confirmed"},{"label":"Amendment window near renewal","value":"Accepted from 60 days before expiry","confidence":"confirmed"}],"followUps":["How many activities can I have?","How do I change my company name?","What does renewal cost?"],"source":"https://rakez.com/en/service-cards/company-amendments/license-amendment-free-zone"},{"id":"add-remove-shareholder","persona":["renewer"],"questions":["how do i add a shareholder","remove a partner","change shareholders","shareholder change cost","transfer shares"],"keywords":["shareholder","shareholders","partner","partners","add","remove","change","transfer","shares","4000","structure","ownership"],"title":"Adding or removing a shareholder","answer":"Shareholder changes go through Portal 360, cost AED 4,000 and take 8 to 10 working days. The outgoing shareholder's visa has to be cancelled before the amended licence is issued.","bullets":["Shareholder structure change — AED 4,000, 8 to 10 working days","A second amendment gets 30% off","Chamber of Commerce certificate amendment — AED 500","Documents: shareholders' resolution signed by all shareholders (notarised or legalised as applicable), incoming shareholder's passport, Emirates ID and visa copy, acceptance letter, and an NOC if the incoming shareholder holds an employee or dependent visa","Corporate shareholders also need a Certificate of Good Standing, trade licence and UBO declaration","The outgoing shareholder loses Portal 360 access; the new one registers separately","Maximum 50 shareholders in a free zone or non-free zone LLC"],"facts":[{"label":"Shareholder change fee","value":"AED 4,000","confidence":"confirmed"},{"label":"Processing time","value":"8 to 10 working days","confidence":"confirmed"},{"label":"Maximum shareholders","value":"50","confidence":"confirmed"},{"label":"Prerequisite","value":"Outgoing shareholder's visa must be cancelled first","confidence":"confirmed"}],"followUps":["How do I change my company name?","How do I cancel a visa?","What other amendments are there?"],"source":"https://rakez.com/en/service-cards/company-amendments/shareholder-structure-change-free-zone"},{"id":"change-company-name","persona":["renewer"],"questions":["how do i change my company name","trade name change cost","rename my company","company name change time","name change newspaper"],"keywords":["name","trade","company","change","rename","1999","newspaper","publication","publish","guideline"],"title":"Changing your company name","answer":"A trade name change costs AED 1,999 and takes 7 to 10 working days, which includes 3 days of newspaper publication. The new name has to follow the RAKEZ company name guideline.","bullets":["Company name change — AED 1,999, including the immigration file amendment and pre-approval","7 to 10 working days, including 3 days newspaper publication","Chamber of Commerce certificate amendment — AED 500","30% discount on a second amendment","You need a shareholders' resolution signed by all shareholders, notarised or embassy-legalised depending on where the parent company sits","An NOC from Public Services is needed if you hold land or a warehouse","Name changes are one of the amendments that must be published"],"facts":[{"label":"Trade name change fee","value":"AED 1,999","confidence":"confirmed"},{"label":"Processing time","value":"7 to 10 working days, including 3 days newspaper publication","confidence":"confirmed"},{"label":"Amendments needing publication","value":"Name change, share capital decrease, legal form change, de-registration","confidence":"confirmed"}],"followUps":["How do I change my activity?","How do I add a shareholder?","What is a KYC update?"],"source":"https://rakez.com/en/service-cards/company-amendments/trade-name-change-free-zone"},{"id":"not-renewing-strike-off","persona":["renewer"],"questions":["what happens if i dont renew","company struck off","strike off rakez","can i freeze my licence","i stopped trading do i still renew","what if i never renew"],"keywords":["not","dont","don't","never","renew","strike","struck","off","freeze","pause","dormant","stopped","trading","close","restore"],"title":"If you do not renew","answer":"RAKEZ cannot freeze or pause a licence — the licence is linked to immigration, corporate tax and banking systems. If you stop renewing, penalties accumulate and after six months the company can be struck off. Being struck off does not wipe out your obligations.","bullets":["Freezing a licence is not currently available","A company can be struck off after 6 months without renewal, 30 days of non-payment of fees or penalties, activity violations, proof of non-operation, or licence revocation","Company, director and shareholder liabilities survive a strike-off and stay enforceable","You can apply to restore a struck-off company and renew the licence within 2 years of the strike-off, subject to RAKEZ approval","If you genuinely want out, deregister properly rather than letting the licence lapse"],"facts":[{"label":"Strike-off after non-renewal","value":"6 months","confidence":"confirmed"},{"label":"Restoration window","value":"Within 2 years of strike-off, subject to RAKEZ approval","confidence":"confirmed"},{"label":"Can a licence be frozen?","value":"No","confidence":"confirmed"}],"followUps":["How do I close my company properly?","What is the late fine?","Can I pay in instalments?"],"source":"https://rakez.com/en/faqs"},{"id":"audited-accounts","persona":["renewer"],"questions":["do i need audited accounts","audited financial statements deadline","fine for not submitting accounts","who can audit my company","financial statements rakez"],"keywords":["audit","audited","accounts","financial","statements","auditor","approved","deadline","2500","fine","six","months"],"title":"Audited financial statements","answer":"Every RAKEZ company has to prepare and submit annual audited financial statements, within six months of the financial year end. The audit has to come from an auditor on the RAKEZ approved list. Missing the deadline is a AED 2,500 fine. You do not need them to renew your licence.","bullets":["Due within 6 months of the financial year end","Only auditors on the RAKEZ approved list are accepted","AED 2,500 fine for late submission","Not required at licence renewal","Financial years run January to December; the first year can be 6 to 18 months depending on your incorporation date"],"facts":[{"label":"Submission deadline","value":"Within 6 months of financial year end","confidence":"confirmed"},{"label":"Late fine","value":"AED 2,500","confidence":"confirmed"},{"label":"Required for renewal?","value":"No","confidence":"confirmed"}],"followUps":["What documents do I need to renew?","What is corporate tax?","How do I contact RAKEZ?"],"source":"https://rakez.com/en/faqs"},{"id":"non-freezone-renewal","persona":["renewer"],"questions":["renew non free zone licence","ded licence renewal rakez","mainland licence renewal","difference renewing non free zone"],"keywords":["non","free","zone","nonfreezone","ded","mainland","renew","renewal","chamber","commerce"],"title":"Renewing a non-free zone licence","answer":"Non-free zone renewal works the same way through Portal 360, but you get both the RAKEZ licence and the RAK DED licence renewed. The documents are essentially the same as free zone.","bullets":["Initiate on Portal 360, pay and upload documents, receive the renewed licences","You receive: renewed RAKEZ licence, renewed DED licence, renewed Immigration File e-card, renewed Chamber of Commerce membership","Documents: fresh passport copies where the ones on file have expired, corporate shareholder documents, NOCs where applicable, and two signed copies of the lease for physical facilities","Renewed instantly once requirements are satisfied"],"facts":[{"label":"What you get","value":"Renewed RAKEZ licence, DED licence, Immigration File e-card and Chamber of Commerce membership","confidence":"confirmed"},{"label":"Price","value":"Varies by licence type, activity and facility","confidence":"confirmed"}],"followUps":["What is the difference between free zone and non-free zone?","What documents do I need?","What is the late fine?"],"source":"https://rakez.com/en/service-cards/license-renewal-services/license-renewal-non-freezone"},{"id":"corporate-tax","persona":["renewer","setter-upper"],"questions":["do i pay corporate tax","uae corporate tax rate","corporate tax free zone","9 percent tax","tax on my company"],"keywords":["corporate","tax","ct","9","nine","percent","375000","375","free","zone","fta","profit","taxable"],"title":"UAE corporate tax","answer":"UAE corporate tax is 0% on taxable income up to AED 375,000 and 9% above that. It applies to financial years starting on or after 1 June 2023. Free zone businesses can keep their existing incentives if they meet the regulatory requirements and do not do mainland business, but that is a case-by-case test.","bullets":["0% on taxable income up to AED 375,000","9% on taxable income above AED 375,000","Applies to financial years beginning on or after 1 June 2023","The Federal Tax Authority handles registration, filing and enforcement","Free zone incentives depend on meeting qualifying conditions — check your case with a tax adviser or the FTA","RAKEZ's renewal team warns that a late licence renewal can bring Corporate Tax Authority penalties too"],"facts":[{"label":"Tax-free threshold","value":"AED 375,000 of taxable income","confidence":"confirmed"},{"label":"Rate above threshold","value":"9%","confidence":"confirmed"},{"label":"Free zone treatment","value":"Existing incentives can continue if regulatory requirements are met and no mainland business is done — qualification is case-specific","confidence":"varies"}],"followUps":["What is VAT?","What is a designated zone?","Do I need audited accounts?"],"source":"https://u.ae/en/information-and-services/finance-and-investment/taxation/corporate-tax"},{"id":"licence-types","persona":["setter-upper"],"questions":["what licence types are there","types of trade licence","commercial or service licence","which licence do i need","licence categories rakez"],"keywords":["licence","license","types","type","trade","commercial","industrial","service","services","media","educational","ecommerce","e-commerce","general","trading","professional","freelancer","categories"],"title":"The licence types RAKEZ issues","answer":"RAKEZ issues ten licence categories, available as free zone or non-free zone entities. Which one you need depends on what you actually do — trading goods, providing a service, manufacturing, teaching, selling online, and so on.","bullets":["Commercial — trading goods and services","General Trading","Service / Professional — consultancy and professional services","Industrial — manufacturing, importing, packaging, exporting","E-Commerce","Media","Educational","Individual / Professional","Freelancer Permit — media and education professions, as a sole practitioner","Non-free zone options are Industrial, Commercial and Professional, and need a RAK DED licence as well as a RAKEZ one"],"facts":[{"label":"Number of licence categories","value":"10","confidence":"confirmed"},{"label":"Sectors covered","value":"Over 50, including manufacturing, energy, technology, healthcare, aviation, shipping, education, media and professional services","confidence":"confirmed"},{"label":"Mixing licence types","value":"Commercial and service activities cannot share one licence — they need separate licences","confidence":"confirmed"}],"followUps":["How many activities can I have on one licence?","What is the difference between free zone and non-free zone?","How much does setup cost?"],"source":"https://rakez.com/en/join-us/getting-started"},{"id":"how-many-activities","persona":["setter-upper","renewer"],"questions":["how many activities can i have","number of activities on a licence","can i have two activities","activities per licence","mix activities"],"keywords":["how","many","activities","activity","number","limit","five","5","two","2","group","mix","same","different"],"title":"How many activities one licence covers","answer":"It depends on the licence type. A commercial licence carries the most. Any activity from a different licence type needs its own separate licence.","bullets":["Commercial licence — 5 activities from the same group, or 2 from different groups","Service licence — 2 activities from any group","Industrial licence — 2 activities from the same group","Any activity from a different licence type requires a separate licence","Adding an activity within the same licence type is a 'Change of Activity' amendment","Some packages advertise more: the Biz Starter and SME all-inclusive packages say up to 10 activities, mix and match"],"facts":[{"label":"Commercial","value":"5 from the same group, or 2 from different groups","confidence":"confirmed"},{"label":"Service","value":"2 from any group","confidence":"confirmed"},{"label":"Industrial","value":"2 from the same group","confidence":"confirmed"},{"label":"Package claims of 10 activities","value":"Promotional packages advertise up to 10 mix-and-match activities, which sits above the general FAQ limits. Confirm what your specific package allows.","confidence":"varies"}],"followUps":["How do I add an activity?","What licence types are there?","How much is an extra activity?"],"source":"https://rakez.com/en/faqs"},{"id":"free-zone-vs-non-free-zone","persona":["setter-upper"],"questions":["free zone or non free zone","what is the difference between free zone and mainland","can i sell in the uae mainland","which should i choose free zone","non free zone meaning"],"keywords":["free","zone","freezone","non","mainland","difference","ded","choose","compare","trade","sell","uae","local","market"],"title":"Free zone vs non-free zone","answer":"A free zone company gives you 100% foreign ownership but must operate inside the RAKEZ free zone area and cannot trade directly in the UAE mainland. A non-free zone company can serve the mainland but, for industrial and commercial licences, needs a UAE national holding 51% of the shares.","bullets":["Free zone — 100% foreign ownership, no local partner, but activities must be carried out inside the RAKEZ free zone area","A free zone entity cannot trade directly in the UAE mainland; it can sell through agents, representatives, distributors or a parent company holding a mainland licence","A free zone entity cannot have an office outside RAKEZ","Free zone entities cannot do retail trading inside the free zone — they may display products for marketing only","Non-free zone — needs both a RAKEZ licence and a RAK DED licence","Non-free zone industrial and commercial licences need a UAE national sponsor holding at least 51%","Non-free zone professional licences can be 100% foreign-owned but need a UAE national local service agent, who carries no legal or financial liability"],"facts":[{"label":"Free zone foreign ownership","value":"100%, no local partner","confidence":"confirmed"},{"label":"Free zone mainland trading","value":"Not directly — only through an agent, distributor or mainland-licensed parent","confidence":"confirmed"},{"label":"Non-free zone industrial/commercial","value":"UAE national sponsor with 51%+ shareholding required","confidence":"confirmed"}],"followUps":["Can I own 100% of my company?","What is a local service agent?","What licence types are there?"],"source":"https://rakez.com/en/faqs"},{"id":"100-percent-ownership","persona":["setter-upper"],"questions":["can i own 100 percent","do i need a local partner","foreign ownership uae","do i need an emirati sponsor","100% ownership free zone"],"keywords":["100","percent","own","ownership","foreign","local","partner","sponsor","emirati","national","need","agent"],"title":"Owning 100% of your company","answer":"In a RAKEZ free zone company, yes — 100% foreign ownership, no local partner needed. In a non-free zone company it depends on the licence: industrial and commercial licences need a UAE national holding 51% or more, while professional licences only need a local service agent who has no ownership or liability.","bullets":["Free zone company — 100% foreign ownership, no local partner","Non-free zone industrial or commercial — UAE national must hold 51%+","Non-free zone professional — no shareholding required, but a UAE national local service agent must be appointed","GCC nationals can get a non-free zone licence without a sponsor, provided no non-GCC nationals are partners","A local service agent has no legal or financial responsibility and receives an annual fee"],"facts":[{"label":"Free zone ownership","value":"100% foreign ownership permitted","confidence":"confirmed"},{"label":"Local partner needed in a free zone?","value":"No","confidence":"confirmed"}],"followUps":["What is the difference between free zone and non-free zone?","What is a local service agent?","What company types can I set up?"],"source":"https://rakez.com/en/faqs"},{"id":"minimum-capital","persona":["setter-upper"],"questions":["what is the minimum capital","share capital requirement","do i need to deposit capital","minimum share capital free zone llc","capital for industrial licence"],"keywords":["capital","minimum","share","shares","10000","150000","deposit","requirement","paid","up"],"title":"Minimum share capital","answer":"A RAKEZ free zone LLC needs a minimum share capital of AED 10,000. Certain regulated activities need much more. Branches do not need capital at all.","bullets":["Free Zone LLC — AED 10,000 minimum","Industrial — AED 150,000","Aviation — AED 500,000","Logistics / Transportation — AED 100,000","Insurance consultancy AED 100,000; insurance broker AED 500,000; insurance agent AED 1,000,000","Investment consultancy — AED 100,000","Real estate consultancy, broker or agent — AED 500,000; real estate development — AED 1,000,000","TV / radio broadcasting — AED 1,000,000; publishing and production — AED 50,000 each","Education activities (higher education provider, school, early learning centre, education support) — AED 50,000","Branches require no capital"],"facts":[{"label":"Free Zone LLC minimum","value":"AED 10,000","confidence":"confirmed"},{"label":"Branches","value":"No capital required","confidence":"confirmed"},{"label":"Does capital have to be deposited in cash?","value":"Not stated on the RAKEZ FAQ — confirm with your Business Development contact","confidence":"unconfirmed"}],"followUps":["What company types can I set up?","How much does setup cost?","What licence types are there?"],"source":"https://rakez.com/en/faqs"},{"id":"setup-cost","persona":["setter-upper"],"questions":["how much does it cost to set up","setup cost rakez","cheapest package","company formation cost","what does a licence cost","business setup price"],"keywords":["setup","set","up","cost","costs","price","cheap","cheapest","package","packages","formation","start","how","much","6000","14000","aed"],"title":"What setting up costs","answer":"RAKEZ's entry packages start at AED 6,000 a year. Packages that include a residence visa cost more. The right number for you depends on the licence type, how many activities and visas you need, and the facility you take.","bullets":["Biz Starter — from AED 6,000, coworking, no visa stated","BusinessWomen — from AED 6,000","E-Commerce — from AED 6,000, includes 1 UAE residence visa","Instant Licence Basic — AED 6,000; Instant Licence Lite — AED 12,000 including 1 residence visa","SME all-inclusive — AED 14,000 a year including 1 UAE residence visa","Designated Zone — from AED 16,550 a year including 1 residence visa","Extra visas on the SME package are AED 4,000 each, up to 3 more"],"facts":[{"label":"Entry price","value":"From AED 6,000 per year","confidence":"confirmed"},{"label":"All-inclusive package with a visa","value":"AED 14,000/year on the promotions page. The Getting Started page quotes AED 16,500 for the same package — confirm the current price with RAKEZ before quoting it.","confidence":"varies"},{"label":"What changes the price","value":"Licence type, number of activities, number of visas, facility type","confidence":"confirmed"}],"followUps":["What is in the all-inclusive package?","What is the cheapest way to start?","How long does setup take?"],"source":"https://rakez.com/en/promotions/sme-business-setup"},{"id":"package-sme-all-inclusive","persona":["setter-upper"],"questions":["what is in the all inclusive package","sme package rakez","package with visa included","14000 package","all inclusive setup"],"keywords":["all","inclusive","package","sme","14000","16500","visa","included","premium","upgrade","tabby","instalments"],"title":"The SME all-inclusive package","answer":"This is RAKEZ's main package for a small company that needs a visa. It bundles a trade licence, a UAE residence visa and a shared workstation into one annual price, and RAKEZ guarantees the same price at renewal.","bullets":["AED 14,000 per year on the promotions page","Includes one UAE residence visa, the trade licence, and unlimited access to Compass Coworking Centre","Add up to 3 more visas at AED 4,000 each","Mix and match up to 10 activities; up to 50 shareholders","20% discount on dependent visas","Same renewal price guaranteed","Payments can be split into instalments via Tabby","Optional AED 2,500 premium upgrade adds VIP visa support, banking assistance and corporate tax registration"],"facts":[{"label":"Price","value":"AED 14,000/year on the promotions page; AED 16,500 quoted on the Getting Started page — confirm which is current","confidence":"varies"},{"label":"Extra visas","value":"AED 4,000 each, up to 3","confidence":"confirmed"},{"label":"Premium upgrade","value":"AED 2,500","confidence":"confirmed"}],"followUps":["What other packages are there?","How many visas can I get?","How long does setup take?"],"source":"https://rakez.com/en/promotions/sme-business-setup"},{"id":"package-biz-starter","persona":["setter-upper"],"questions":["biz starter package","cheapest rakez package","6000 package","starter licence","what do i get for 6000"],"keywords":["biz","starter","cheap","cheapest","6000","package","coworking","24","hours","entry"],"title":"The Biz Starter package","answer":"Biz Starter is the entry package at AED 6,000. It gives you a licence, coworking membership and eligibility to open a bank account, and RAKEZ advertises it as ready in 24 hours. It does not state a visa.","bullets":["AED 6,000","Advertised as straight to business in 24 hours","Up to 50 shareholders","Up to 10 business activities, mix and match","Eligibility for bank account opening","Coworking centre membership and access to networking events","VAT registration, accounting and compliance available as services"],"facts":[{"label":"Price","value":"AED 6,000","confidence":"confirmed"},{"label":"Visa included?","value":"Not stated on the package page — assume none and ask RAKEZ","confidence":"unconfirmed"},{"label":"Setup speed","value":"Advertised as 24 hours","confidence":"confirmed"}],"followUps":["Does it include a visa?","What is the all-inclusive package?","What is a flexi desk?"],"source":"https://rakez.com/en/promotions/biz-starter-package"},{"id":"package-ecommerce","persona":["setter-upper"],"questions":["e-commerce licence","online store licence uae","can i sell on amazon","ecommerce package cost","selling on instagram licence"],"keywords":["ecommerce","e-commerce","online","store","shop","amazon","instagram","social","media","website","app","tdra","domain"],"title":"The E-Commerce package","answer":"The e-commerce package starts at AED 6,000 and includes one UAE residence visa and two free activities worth AED 4,000. It covers selling through a website, social media or a mobile app.","bullets":["From AED 6,000, including one UAE residence visa","Two free activities worth AED 4,000","50% discount on an additional media, commercial or service licence","Covers a website (needs a .ae domain), social media selling (X, Facebook, Instagram) and mobile apps on iOS and Google Play","Needs a TDRA No Objection Certificate — 2 working days, no cost","Includes Amazon partner benefits: seller registration help, training webinars and a dedicated account manager","You must comply with the UAE Personal Data Protection Law for customer data"],"facts":[{"label":"Price","value":"From AED 6,000","confidence":"confirmed"},{"label":"Visa included","value":"1 UAE residence visa","confidence":"confirmed"},{"label":"TDRA NOC","value":"2 working days, no cost","confidence":"confirmed"}],"followUps":["What other packages are there?","Do I need VAT registration?","How long does setup take?"],"source":"https://rakez.com/en/promotions/e-commerce"},{"id":"package-instant-licence","persona":["setter-upper"],"questions":["instant licence","get a licence today","fastest way to set up","instant licence cost","same day trade licence"],"keywords":["instant","immediate","today","fast","fastest","quick","same","day","minutes","basic","lite","12000"],"title":"The Instant Licence","answer":"The Instant Licence is issued immediately online once you apply and pay. There are two versions: Basic at AED 6,000 and Lite at AED 12,000, which includes a residence visa.","bullets":["Basic — AED 6,000: one shareholder, one activity, coworking facility access","Lite — AED 12,000: up to 5 shareholders, up to 5 activities, coworking, and one residence visa","Fully online, no office visit","You need a valid passport, plus a visa or Emirates ID if you are a UAE resident"],"facts":[{"label":"Basic package","value":"AED 6,000","confidence":"confirmed"},{"label":"Lite package","value":"AED 12,000, includes 1 residence visa","confidence":"confirmed"},{"label":"Issue speed","value":"Instant on completed application and payment","confidence":"confirmed"}],"followUps":["What other packages are there?","Can I add a visa later?","What documents do I need to set up?"],"source":"https://rakez.com/en/promotions/instant-licence"},{"id":"designated-zone","persona":["setter-upper"],"questions":["what is a designated zone","vat free zone rakez","0% vat goods","designated zone cost","warehouse vat"],"keywords":["designated","zone","vat","0","zero","tax","goods","trading","warehouse","logistics","16550","cashback"],"title":"The RAKEZ Designated Zone","answer":"A designated zone is an area recognised by the UAE Cabinet and Federal Tax Authority where certain movements of physical goods are treated as outside the UAE for VAT. RAKEZ's designated zone package starts at AED 16,550 a year.","bullets":["From AED 16,550 a year, including one UAE residence visa","50% cashback advertised in the second year","Qualifying activities: trading and general trading; warehousing, transportation, logistics management or inventory control of tangible goods; and similar activities involving physical handling or movement of goods","Terms and conditions apply to which activities qualify","This is a VAT treatment, not a corporate tax exemption — they are separate taxes"],"facts":[{"label":"Price","value":"From AED 16,550/year including one residence visa","confidence":"confirmed"},{"label":"What it affects","value":"VAT treatment of qualifying goods activities","confidence":"confirmed"},{"label":"Exact VAT mechanics for your case","value":"Depends on your activity and how goods move — confirm with a tax adviser or the FTA","confidence":"varies"}],"followUps":["What is VAT?","What is corporate tax?","What warehouses does RAKEZ have?"],"source":"https://rakez.com/en/promotions/rakez-designated-zone"},{"id":"setup-steps-time","persona":["setter-upper"],"questions":["how long does setup take","how do i set up a company","business setup steps","how fast can i get a licence","what is the process to open a company"],"keywords":["how","long","setup","set","up","steps","process","start","open","days","fast","quick","time","timeline","register"],"title":"How setting up works and how long it takes","answer":"It is three steps: choose your package with a RAKEZ Business Development adviser, submit the application and documents and pay, then receive your licence. RAKEZ says licences are issued in a matter of days, and within minutes on the Instant Licence once documents are in.","bullets":["1. Customise your package — pick the legal entity, licence type and facility with a Business Development adviser","2. Submit the application and documents, get the invoice, pay","3. Receive the licence, registration set and bank letter — then the visa process starts","Instant Licence is issued immediately; Biz Starter is advertised at 24 hours","The visa process comes after the licence, and adds 3 to 6 working days for RAKEZ's part"],"facts":[{"label":"Licence issue","value":"A matter of days, or within minutes on the Instant Licence","confidence":"confirmed"},{"label":"Visa process","value":"Starts after the licence is issued","confidence":"confirmed"}],"followUps":["What documents do I need to set up?","How much does it cost?","How do I get a visa after that?"],"source":"https://rakez.com/en/join-us/getting-started"},{"id":"facility-types","persona":["setter-upper"],"questions":["what is a flexi desk","do i need an office","types of office rakez","warehouse rakez","coworking space","which facility do i need"],"keywords":["flexi","desk","office","offices","coworking","co-working","workstation","shared","warehouse","land","shell","core","executive","standard","serviced","facility","facilities","space"],"title":"Flexi desks, offices and warehouses","answer":"Leasing a facility is mandatory to open a RAKEZ company — you cannot have a licence without one. The cheapest is a shared workstation or coworking desk; from there it goes up through private offices to warehouses and land.","bullets":["Coworking space / flexi desk — a shared workstation at Compass Coworking Centre, for freelancers, startups and small teams. Limited to 1 visa.","Serviced offices — coworking with permanence and privacy","Standard offices — private office space for SMEs","Executive offices — larger private space for bigger teams","Shell & core offices — bare space you fit out yourself","Warehouses — various sizes, near seaports and airports","Land for development — for large-scale industrial operations","Staff and labour accommodation at the industrial zones","You cannot leave belongings in a coworking space; for that you need a private office"],"facts":[{"label":"Is a facility mandatory?","value":"Yes — leasing a facility is mandatory to open a company","confidence":"confirmed"},{"label":"Flexi desk visa limit","value":"1 visa","confidence":"confirmed"},{"label":"Can I rent RAKEZ office space on a DED or other free zone licence?","value":"No — you need a RAKEZ licence","confidence":"confirmed"},{"label":"Facility prices","value":"Not published on the facilities page — ask RAKEZ for a quote on the specific unit","confidence":"unconfirmed"}],"followUps":["How many visas can I get?","Does my activity need a specific facility?","How much does setup cost?"],"source":"https://rakez.com/en/about-us/facilities"},{"id":"company-types","persona":["setter-upper"],"questions":["what company types can i set up","fzllc","branch office uae","single person llc","legal structures rakez","what is a branch"],"keywords":["company","types","legal","entity","structure","llc","fzllc","branch","subsidiary","representative","establishment","single","person","individual"],"title":"Company types you can register","answer":"On the free zone side you can register a Free Zone LLC or a branch of a UAE-based or foreign company. On the non-free zone side there are individual establishments, single person LLCs, LLCs and branches.","bullets":["Free zone: Free Zone LLC, branch of a UAE-based company, branch of a foreign company","Non-free zone: Individual Establishment, Single Person LLC, LLC, branch of a UAE-based company, branch of a foreign company","An LLC is a separate legal entity; each shareholder is only liable up to the value of their shares","A non-free zone individual establishment must be owned by a natural person and the owner's liability is unlimited","A branch has no separate legal identity, no Memorandum of Association, and must carry the parent company's name and all or some of its activities","A representative office cannot trade — it is administrative and marketing only","Maximum 50 shareholders in an LLC"],"facts":[{"label":"Maximum shareholders","value":"50","confidence":"confirmed"},{"label":"Branch name","value":"Must match the parent company name","confidence":"confirmed"},{"label":"Company manager","value":"Must be a natural person, must be a UAE resident, one manager per company","confidence":"confirmed"}],"followUps":["What is the minimum capital?","Do I need a local partner?","What licence types are there?"],"source":"https://rakez.com/en/faqs"},{"id":"freelancer-permit","persona":["setter-upper"],"questions":["freelance permit rakez","can i freelance in rakez","freelancer licence","sole practitioner permit","freelance visa"],"keywords":["freelance","freelancer","permit","sole","practitioner","independent","contractor","media","education","self","employed"],"title":"The freelancer permit","answer":"RAKEZ issues freelancer permits for media and education-related professions, for people working as sole practitioners. A freelancer is defined as an independent contractor operating as a sole practitioner in a permitted profession.","bullets":["Available for media and education-related professions","You operate as a sole practitioner, not a company","It is one of RAKEZ's ten licence categories","Ask RAKEZ which specific professions are on the permitted list for your field"],"facts":[{"label":"Eligible professions","value":"Media and education-related professions","confidence":"confirmed"},{"label":"Freelancer permit price","value":"Not published — request a quote from RAKEZ","confidence":"unconfirmed"}],"followUps":["What licence types are there?","How much does setup cost?","Can I get a visa with it?"],"source":"https://rakez.com/en/faqs"},{"id":"business-plan-approvals","persona":["setter-upper"],"questions":["do i need a business plan","what goes in a business plan","do i need approvals","regulated activity noc","third party approval"],"keywords":["business","plan","approval","approvals","noc","regulated","third","party","ministry","health","clinic","dnfbp"],"title":"Business plans and extra approvals","answer":"Not every activity needs a business plan, and RAKEZ does not require a specific format. Some regulated activities do need a No Objection Certificate from an outside authority before the licence is issued.","bullets":["A business plan is not required for all activities, and there is no prescribed format","If one is needed it covers: description of activities, scope, market segment, supply chain, management structure and recruitment plan, and financial forecasts","Regulated activities such as clinics need a third-party NOC — for example from the Ministry of Health & Prevention","DNFBP activities need a signed DNFBPs form. These are legal consultancy, real estate agents, real estate developers, account auditing, precious metals and stones trading, investment consultancy, and company service providers. All shareholders become jointly liable for AML/CFT compliance.","An Operation Fitness Certificate is mandatory before occupying pre-built warehouses and customised facilities on leased land — coworking and business centre licensees are exempt"],"facts":[{"label":"Business plan required?","value":"Not for all activities; no prescribed format","confidence":"confirmed"},{"label":"Operation Fitness Certificate","value":"Mandatory before occupying pre-built warehouses and customised facilities on leased land","confidence":"confirmed"}],"followUps":["What licence types are there?","How long does setup take?","Does my activity need a specific facility?"],"source":"https://rakez.com/en/faqs"},{"id":"contact-rakez","persona":["everyone"],"questions":["how do i contact rakez","phone number","email address rakez","who do i call","customer service number","toll free"],"keywords":["contact","phone","call","number","email","reach","customer","service","support","toll","free","800","600","whatsapp"],"title":"How to contact RAKEZ","answer":"There are two hotlines — one for new clients, one for existing clients — plus a general email.","bullets":["New clients — 800 72539 (800 RAKEZ)","Existing clients — 600 577 000","International — +971 7 204 1111","General email — info@rakez.com","Customer service email — customerservice@rakez.com","Fax — +971 7 2077120","Online — Portal 360 at eportal.rakez.com, or the RAKEZ mobile app"],"facts":[{"label":"Existing client hotline","value":"600 577 000","confidence":"confirmed"},{"label":"New client hotline","value":"800 72539","confidence":"confirmed"},{"label":"International","value":"+971 7 204 1111","confidence":"confirmed"}],"followUps":["What are your opening hours?","Where are your offices?","How do I use Portal 360?"],"source":"https://rakez.com/en/contact-us"},{"id":"opening-hours","persona":["everyone"],"questions":["what are your opening hours","when are you open","are you open on saturday","working hours rakez","office timings"],"keywords":["hours","open","opening","timing","timings","working","saturday","sunday","weekend","monday","friday","time"],"title":"Opening hours","answer":"RAKEZ offices run Monday to Friday, 8:00 to 16:00 UAE time. The Medical Fitness Centre also opens on Saturday mornings. Portal 360 is available 24/7.","bullets":["Offices and client service centres — Monday to Friday, 8:00 to 16:00 (GMT+4)","RAKEZ Medical Fitness Centre — Monday to Friday 8:00 to 16:00, Saturday 9:00 to 14:00","RAKEZ India office (Mumbai) — Monday to Friday, 9:30 to 17:00 India time","RAKEZ Germany office (Cologne) — Monday to Friday, 8:00 to 16:00 German time","Portal 360 — 24/7"],"facts":[{"label":"Standard hours","value":"Monday to Friday, 8:00–16:00 UAE time","confidence":"confirmed"},{"label":"Saturday","value":"Medical Fitness Centre only, 9:00–14:00","confidence":"confirmed"}],"followUps":["Where are your offices?","How do I contact RAKEZ?","Can I do everything online?"],"source":"https://rakez.com/en/contact-us"},{"id":"locations","persona":["everyone"],"questions":["where is rakez","office address","where are you located","rakez zones","do you have a dubai office","how do i get there"],"keywords":["where","location","locations","address","office","offices","zone","zones","dubai","abu","dhabi","mumbai","india","germany","cologne","nakheel","hamra"],"title":"Where RAKEZ is","answer":"RAKEZ is in Ras Al Khaimah in the UAE. The headquarters is at Al Nakheel and there is a second client centre at Al Hamra, plus representative offices in Dubai, Abu Dhabi, Mumbai and Cologne.","bullets":["Headquarters — Al Nakheel, Ras Al Khaimah, P.O. Box 10055. +971 7 2041111, info@rakez.com","RAKEZ Explorer Business Hub — Ground Floor, Al Hamra, Ras Al Khaimah. customerservice@rakez.com","Compass Coworking Centre — Al Shohada Road, Street C, Al Hamra Area, P.O. Box 16111. +971 7 2042000, compass@rakez.com","RAKEZ Medical Fitness Centre — Amenity Centre, Al Jazeera Al Hamra Industrial","Zones and parks: Al Nakheel Business Zone, Al Hamra Business Zone, Academic Zone, Al Hamra Industrial Zone, Al Ghail Industrial Zone, Al Hulaila Industrial Zone","GoBusiness Dubai — Boulevard Plaza Tower 2, Floor 22, Office 2203/2204. +971 4 7041821","GoBusiness Abu Dhabi — Abu Dhabi Mall, West Tower, 3rd Floor, Office 307. +971 2 6994899","India — The Capital Building, Bandra Kurla Complex, Mumbai. india@rakez.com","Germany — Hansaring 1, 50670 Cologne. europe@rakez.com"],"facts":[{"label":"Headquarters","value":"Al Nakheel, Ras Al Khaimah, UAE, P.O. Box 10055","confidence":"confirmed"},{"label":"Number of zones","value":"Six named zones and parks across business and industrial areas","confidence":"confirmed"}],"followUps":["What are your opening hours?","How do I contact RAKEZ?","What facilities do you have?"],"source":"https://rakez.com/en/contact-us"},{"id":"portal-360","persona":["everyone"],"questions":["what is portal 360","customer portal rakez","what can i do in the portal","rakez app","eportal login"],"keywords":["portal","360","eportal","customer","login","app","mobile","dashboard","online","self","service","track"],"title":"Portal 360, the customer portal","answer":"Portal 360 is RAKEZ's online account at eportal.rakez.com. You use it to submit and track every service request, renew your licence, apply for visas, download your documents and pay. It is available 24/7 and there is a mobile app.","bullets":["Submit and track service requests","Company dashboard with downloadable documents","Licence and lease renewal","Visa applications, renewals, amendments and cancellations","Company amendments and de-registration","Make payments and top up your balance","Service guides and checklists","Available on the App Store and Google Play as the RAKEZ app"],"facts":[{"label":"URL","value":"https://eportal.rakez.com/","confidence":"confirmed"},{"label":"Availability","value":"24/7","confidence":"confirmed"}],"followUps":["How do I get portal access?","How do I pay?","How do I track a request?"],"source":"https://rakez.com/en/start-a-business/portal360"},{"id":"portal-registration","persona":["everyone"],"questions":["how do i get portal access","portal login credentials","i cant log in to the portal","register for portal 360","new portal user"],"keywords":["access","login","credentials","register","registration","signup","sign","up","password","undertaking","letter","portal"],"title":"Getting Portal 360 access","answer":"You request credentials with a signed undertaking letter. Download the Undertaking Letter for Credentials form, have a shareholder or the company manager stamp and sign it, then email it to customerservice@rakez.com.","bullets":["1. Download and complete the Undertaking Letter for Credentials form","2. Get it stamped an
