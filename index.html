d signed by a company shareholder or the manager","3. Email it to customerservice@rakez.com","RAKEZ then issues your login credentials","When shareholders change, the outgoing shareholder's access is removed automatically and the new one registers separately"],"facts":[{"label":"Where to send the form","value":"customerservice@rakez.com","confidence":"confirmed"},{"label":"Who must sign","value":"A company shareholder or the manager","confidence":"confirmed"}],"followUps":["What can I do in the portal?","How do I contact RAKEZ?","How do I pay?"],"source":"https://rakez.com/en/start-a-business/portal360"},{"id":"payments","persona":["everyone"],"questions":["how do i pay rakez","payment methods","what is the e-wallet","top up my balance","can i pay by card","pay by bank transfer"],"keywords":["pay","payment","methods","wallet","e-wallet","ewallet","top","up","balance","card","bank","transfer","cashier","tabby","ansari"],"title":"Paying RAKEZ","answer":"The usual routes are topping up your portal account balance, paying a cashier at the RAKEZ Business Service Centre, or a bank transfer. For renewals RAKEZ also accepts instalments and e-wallet top-ups.","bullets":["Top up your online portal account and pay from that balance — this is the 'e-wallet'","Cashiers at the RAKEZ Business Service Centre","Bank transfer","For renewals: Tabby instalments, credit card instalments, the payment link in your quotation, direct debit, and Al Ansari Exchange e-wallet top-up","There is a Balance Top-up tutorial video linked from the Portal 360 page"],"facts":[{"label":"Core payment methods","value":"Portal account top-up, cashier at the Business Service Centre, bank transfer","confidence":"confirmed"},{"label":"Instalments","value":"Available for renewals via Tabby and credit card","confidence":"confirmed"}],"followUps":["What does renewal cost?","How do I use Portal 360?","Can I pay in instalments?"],"source":"https://rakez.com/en/faqs"},{"id":"ekyc-video-kyc","persona":["everyone"],"questions":["what is e-kyc","why am i being asked for kyc","video kyc","verify my identity rakez","kyc verification","why do you need my passport again"],"keywords":["kyc","ekyc","e-kyc","video","verification","verify","identity","id","check","know","your","customer","why","asked","selfie","face"],"title":"e-KYC and video verification","answer":"KYC means Know Your Customer. RAKEZ has to keep verified, current identity records for the shareholders, directors and managers of every company it licenses. That is why you get asked for a fresh passport copy or an identity check even when nothing has changed on your side.","bullets":["It keeps your company records accurate with the regulatory authorities","It is normally triggered when a passport is renewed, a name or nationality changes, or your contact details change","Traditionally this meant an appointment and a visit to a RAKEZ desk","RAKEZ is introducing a video-based e-KYC in the customer portal so the check can be done from a phone: photograph your passport and Emirates ID, record a short video of your face, and submit","If you are asked for KYC and are not sure the request is genuine, call 600 577 000 before sending anything"],"facts":[{"label":"Why it is asked","value":"To keep shareholder, director and manager identity records current with the regulatory authorities","confidence":"confirmed"},{"label":"Video KYC in the portal","value":"In development at RAKEZ as a mobile flow (passport photo, Emirates ID photo, face video). Not confirmed as live on a public RAKEZ page — do not promise a launch date.","confidence":"unconfirmed"}],"followUps":["How do I update my details?","What documents do you need?","How do I contact RAKEZ?"],"source":"https://rakez.com/en/service-cards/contact-details-amendment-kyc-update/kyc-update-free-zone"},{"id":"kyc-update-details","persona":["everyone","renewer"],"questions":["how do i update my details","change my passport number","update my email and phone","kyc update cost","my passport was renewed","change of address"],"keywords":["update","change","details","passport","number","renewed","email","mobile","phone","address","nationality","name","kyc","1999"],"title":"Updating your details with RAKEZ","answer":"The KYC Update service is how you change personal details on file — name, nationality, address, passport number, renewed passport data, mobile number and email. It costs AED 1,999 and takes 3 to 5 working days.","bullets":["AED 1,999 for a personal details change, including the immigration file amendment","AED 500 for the Chamber of Commerce update","30% discount on subsequent amendments","3 to 5 working days","Documents: authorisation letter signed by an authorised representative, and a coloured passport copy of the person concerned","Corporate shareholders also need amended association documents, name change certificates, incumbency certificates and updated trade licences, notarised and legalised as applicable","You get back an amended e-licence, updated e-partner list, MOA amendment and Chamber of Commerce certificate where applicable","Submit through Portal 360"],"facts":[{"label":"Fee","value":"AED 1,999 (personal details) + AED 500 Chamber of Commerce","confidence":"confirmed"},{"label":"Processing time","value":"3 to 5 working days","confidence":"confirmed"}],"followUps":["What is e-KYC?","How do I change my company name?","How do I amend a visa?"],"source":"https://rakez.com/en/service-cards/contact-details-amendment-kyc-update/kyc-update-free-zone"},{"id":"deregistration","persona":["everyone","renewer"],"questions":["how do i close my company","deregistration","liquidate my company","shut down my business rakez","deregistration cost","cancel my licence"],"keywords":["close","closing","shut","down","deregister","deregistration","de-registration","liquidate","liquidation","cancel","exit","3000","4500","clearance"],"title":"Closing a company (de-registration)","answer":"De-registration is the proper way out, and it is not instant. You cancel the employee visas first, clear the facility, apply on Portal 360, pass an inspection and publish a notice, then you get a cancellation certificate.","bullets":["1. Cancel employee visas — except investors, partners and the company manager","2. Empty the facility and return it to its original condition","3. Apply for de-registration on Portal 360","4. Upload documents and confirm the digital signature","5. Facility inspection","6. Pay the invoice","7. Receive the cancellation certificate","Documents include facility clearances (Etihad WE, customs, telecoms, civil defence, environment where applicable), a notarised shareholders' resolution, the general manager's resignation letter, and termination of the local service agent agreement if you used one"],"facts":[{"label":"Fee","value":"AED 3,000 base; AED 4,500 for industrial licences, plus external party charges","confidence":"confirmed"},{"label":"Processing time","value":"5 working days, plus 14 days of newspaper publication","confidence":"confirmed"},{"label":"Prerequisite","value":"Employee visas must be cancelled first","confidence":"confirmed"}],"followUps":["How do I cancel a visa?","What happens if I just stop renewing?","Can a struck-off company be restored?"],"source":"https://rakez.com/en/service-cards/de-registration-and-exit-procedures/de-registration-physical-facility"},{"id":"track-request","persona":["everyone"],"questions":["how do i track my application","where is my request","status of my service request","track transaction rakez","how long is my application taking"],"keywords":["track","tracking","status","request","application","transaction","where","progress","pending","waiting"],"title":"Tracking a service request","answer":"Every request you submit through Portal 360 can be tracked there. There is also a standalone tracker at eservices.rakez.com. If something seems stuck, call 600 577 000 with your request reference.","bullets":["Track inside Portal 360 at eportal.rakez.com","Standalone tracker: https://eservices.rakez.com/apex/rak_track_transaction","For anything stuck, call the existing-client hotline on 600 577 000"],"facts":[{"label":"Where to track","value":"Portal 360, or the track service request page on eservices.rakez.com","confidence":"confirmed"}],"followUps":["How do I contact RAKEZ?","What is Portal 360?","How long does my application take?"],"source":"https://rakez.com/en/service-cards/company-services"},{"id":"vat","persona":["everyone","setter-upper"],"questions":["what is vat","do i need to register for vat","vat threshold uae","is my company vat registered","vat 5 percent"],"keywords":["vat","value","added","tax","register","registration","threshold","fta","5","percent","indirect"],"title":"VAT","answer":"VAT is an indirect tax on taxable goods and services in the UAE. It is administered by the Federal Tax Authority, not by RAKEZ. RAKEZ can help with registration as a service, and several of its packages bundle VAT registration support.","bullets":["Administered by the Federal Tax Authority at www.tax.gov.ae","RAKEZ offers VAT registration as part of its accounting and compliance services","VAT and corporate tax are different taxes with different rules","Businesses in a designated zone get special VAT treatment on qualifying goods activities","Check the registration threshold and your own obligation directly with the FTA"],"facts":[{"label":"Who administers VAT","value":"Federal Tax Authority (tax.gov.ae)","confidence":"confirmed"},{"label":"Registration threshold","value":"Not stated on RAKEZ's pages — confirm with the FTA","confidence":"unconfirmed"}],"followUps":["What is corporate tax?","What is a designated zone?","Do I need audited accounts?"],"source":"https://rakez.com/en/faqs"},{"id":"employee-rights-basics","persona":["everyone","visa-seeker"],"questions":["end of service gratuity","how much annual leave","probation period uae","working hours law","can my employer charge me for my visa"],"keywords":["gratuity","end","service","eosb","leave","annual","holiday","probation","working","hours","labour","law","notice","employer","charge","recruitment"],"title":"Basic UAE employment rules","answer":"RAKEZ publishes the main points of UAE labour law in its FAQ. These come from Federal Decree-Law No. 33 of 2021. If you have a dispute, RAKEZ has a Labour Affairs Section.","bullets":["End-of-service gratuity: 21 days' basic wage per year for the first five years, 30 days per year after that, based on the last basic salary only","Maximum working hours: 8 hours a day or 48 hours a week","Maximum probation: 6 months, and it counts towards total service","Annual leave: 30 days a year; 2 days a month if you have worked 6 to 12 months","Notice: 30 to 90 days written notice, with pay during the notice period","Employers cannot charge workers for recruitment or employment costs, including visa costs","An employee's claim for dues cannot be heard more than 2 years after the work relationship ended","If an employer refuses to renew a labour card, report it to RAKEZ's Labour Affairs Section"],"facts":[{"label":"Gratuity","value":"21 days per year for years 1–5, 30 days per year thereafter, on basic salary","confidence":"confirmed"},{"label":"Maximum probation","value":"6 months","confidence":"confirmed"},{"label":"Can an employer charge visa costs to the employee?","value":"No","confidence":"confirmed"}],"followUps":["How do I cancel a visa?","How do I contact RAKEZ?","What is a non-sponsored employee?"],"source":"https://rakez.com/en/faqs"}]};

// engine.js — Agent K2
//
// Turning what a person typed into the right answer, with no backend and no LLM.
//
// READ THIS BEFORE CHANGING ANYTHING BELOW
// ----------------------------------------
// There is no server, no API key and no model at runtime. Everything the assistant
// knows is in data/knowledge.json. This file is therefore the whole intelligence of
// the assistant, and it obeys four honesty rules that are not negotiable:
//
//   1. It never asserts a fact that is not in the knowledge base.
//   2. It never says "I don't know" and never dead-ends. A weak match still says what
//      it CAN help with, offers the nearest entries as chips, and gives a real next
//      step (the RAKEZ hotline, read out of the knowledge base, not hardcoded).
//   3. It honours the `confidence` flag on every fact:
//        confirmed   -> stated plainly
//        varies      -> presented as a range or as "it depends", never as one number
//        unconfirmed -> never stated as fact; the person is routed to RAKEZ
//   4. Where two RAKEZ pages disagree about a figure (AED 14,000 vs 16,500, E-Channel
//      AED 2,200 vs 2,300, and so on) it gives the range and names the disagreement,
//      or quotes both pages. It never picks one and calls it the price.
//
// Rules 3 and 4 are implemented as data-driven behaviour in the "confidence layer"
// section: the engine reads the confidence flags and the figures in the fact text and
// works out what it is allowed to say. Nothing about a specific price is hardcoded
// here, so a corrected knowledge.json changes the behaviour with no code change.
//
// Scoring is deliberately plain and readable. VKB.engine.explain(query) returns the
// ranked candidates with the component scores, which is how it was tuned.
//
// Public API:
//   VKB.engine.personas               the persona list, for the opening chips
//   VKB.engine.ask(query, context)    -> { text, bullets, facts, chips, source, entryId, matchType, ... }
//   VKB.engine.starters(personaId)    -> [ { label, value } ]  opening questions
//   VKB.engine.explain(query, ctx)    -> ranked candidates with scores, for tuning
//   VKB.engine.init(knowledge)        optional explicit data injection

(function (global) {
  'use strict';

  var VKB = global.VKB = global.VKB || {};

  // ===========================================================================
  // 1. CONFIG — every tunable number in one place
  // ===========================================================================

  var CFG = {
    // How the three signals are mixed into one score (they sum to 1).
    W_PHRASE: 0.60,   // best near-phrase match against the entry's `questions`
    W_KEYWORD: 0.32,  // idf-weighted token overlap against `keywords`
    W_TITLE: 0.08,    // small nudge from the entry title

    // Inside the phrase similarity.
    W_COVER: 0.68,    // idf-weighted token overlap between the two phrases
    W_BIGRAM: 0.32,   // word-order overlap, so a near-phrase match dominates

    // Persona is a boost, never a filter — a visa-path user can still ask about licences.
    PERSONA_BOOST: 0.10,   // +10% of the entry's own score

    // Weight of a query token found in each of the entry's fields.
    HIT_KEYWORD: 1.00,
    HIT_QUESTION: 0.85,
    HIT_TITLE: 0.55,

    // Decision thresholds. Tuned against test/engine-test.js — if you move them, rerun it.
    FLOOR: 0.26,        // below this, nothing is good enough: fall back
    STRONG: 0.42,       // at or above this, and clear of the runner-up, answer directly
    MARGIN: 0.06,       // how far clear of second place a strong match has to be
    AMBIG_MAX: 3,       // most "did you mean" options offered
    CHIP_MAX: 4,        // most follow-up chips offered
    NOTE_MAX: 3,        // most confidence notes appended to one answer

    // A word the knowledge base has never seen ("weather", "cricket") is treated as
    // rare, which drags coverage down and pushes the answer towards the fallback —
    // but not so rare that one chatty word ("next month") buries a real question.
    UNKNOWN_IDF: 0.55,  // as a fraction of the rarest idf in the corpus

    // A word the knowledge base has never seen anywhere is often the whole point of
    // the question ("lost", "parking", "golf", "parents"). Each one scales the score
    // down so a topically-adjacent entry cannot quietly swallow a question the
    // knowledge base has no answer to.
    UNKNOWN_PENALTY: 0.85,

      for (var p = 0; p < m.text.length; p++) {

      }
    } else if (m.text) {
      body += '<p class="msg__text">' + esc(m.text) + '</p>';
    }

    if (isArr(m.bullets) && m.bullets.length) {
      var lis = '';
      for (var b = 0; b < m.bullets.length; b++) {
        lis += '<li>' + esc(m.bullets[b]) + '</li>';
      }
      body += '<ul class="msg__bullets">' + lis + '</ul>';
    }

    body += factsHtml(m.facts, m.factsLabel);

    if (m.source) {
      body += '<p class="msg__source">Source: ' + esc(hostOf(m.source)) + '</p>';
    }

    if (isArr(m.chips) && m.chips.length) {
      // Inline follow-ups sit under the answer with no lead line — the lead
      // line belongs to the dock copy of the list.
      body += VKB.render.chips(m.chips, { label: null });
    }

    body += VKB.render.actions(m);

    return (
      '<div class="msg msg--bot" data-id="' + id + '">' +
        '<span class="msg__avatar" aria-hidden="true">' + ic('bot') + '</span>' +
        '<div class="msg__body">' + body + '</div>' +
      '</div>'
    );
  };

  // =======================================================================
  // VKB.screens.chat(state) -> HTML string for the WHOLE screen
  // (header + scrolling message list + pinned composer). 586:1751 et al.
  //
  // Reads, all optional:
  //   state.messages     [] of the message shape above
  //   state.awaiting     true -> typing indicator at the end of the list
  //   state.persona      persona id, to show that persona's starters
  //   state.speakEnabled lights the header speaker toggle
  //   state.dictating    swaps the input row for the recording panel
  //   state.draft        text already in the input
  //   state.chips        dock-level options ([string | {label,value}])
  //   state.chipsLabel   lead line for those (defaults to the Figma copy)
  //
  // OPENING SCREEN: with no messages, the greeting is rendered from
  // VKB.copy.greeting and the dock offers the four personas from
  // VKB.engine.personas; once a persona is chosen, its starters. Straight off
  // 586:1948, which is literally "What would you like to know about?" with
  // four options ending in "Something else".
  // =======================================================================
  VKB.screens.chat = function (state) {
    state = state || {};
    var msgs = isArr(state.messages) ? state.messages : [];

    // ---- message list ---------------------------------------------------
    var list = '';
    if (!msgs.length) {
      list += VKB.render.message({ who: 'bot', id: 'greeting', text: VKB.copy.greeting });
    } else {
      for (var i = 0; i < msgs.length; i++) list += VKB.render.message(msgs[i]);
    }
    if (state.awaiting) list += VKB.render.typing();

    // ---- dock-level options ---------------------------------------------
    // Priority: whatever the orchestrator/engine has put in state.chips; else
    // the persona's starters; else the four personas.
    var opts = '';
    if (isArr(state.chips) && state.chips.length) {
      opts = VKB.render.chips(state.chips, {
        label: Object.prototype.hasOwnProperty.call(state, 'chipsLabel')
          ? state.chipsLabel
          : VKB.copy.optionsLabel
      });
    } else {
      var ps = personas();
      var chosen = null;
      for (var j = 0; j < ps.length; j++) { if (ps[j] && ps[j].id === state.persona) chosen = ps[j]; }

      if (chosen && isArr(chosen.starters) && chosen.starters.length) {
        // Three or four starters, per CONTRACT.md §"The four personas".
        opts = VKB.render.chips(chosen.starters.slice(0, 4), { label: VKB.copy.optionsLabel });
      } else if (!msgs.length && ps.length) {
        var picks = [];
        for (var n = 0; n < ps.length; n++) {
          picks.push({ label: ps[n].label, value: 'persona:' + ps[n].id });
        }
        opts = VKB.render.chips(picks, { label: VKB.copy.optionsLabel });
      }
    }

    // ---- composer -------------------------------------------------------
    var dictating = !!state.dictating;

    var row =
      '<div class="chat__row"' + (dictating ? ' hidden' : '') + '>' +
        '<input id="vkb-input" class="chat__input" type="text" autocomplete="off" ' +
          'autocapitalize="sentences" spellcheck="false" enterkeyhint="send" ' +
          'aria-label="' + esc(VKB.copy.placeholder) + '" ' +
          'placeholder="' + esc(VKB.copy.placeholder) + '" ' +
          'value="' + esc(state.draft || '') + '" />' +
        // NET-NEW — no mic exists anywhere in the Figma file.
        '<button type="button" class="chat__mic" data-act="mic" ' +
          'aria-label="Dictate your question">' + ic('mic') + '</button>' +
        '<button type="button" class="chat__send" data-act="send" ' +
          'aria-label="Send">' + ic('send') + '</button>' +
      '</div>';

    // NET-NEW — the whole recording state. Agent K3 (voice.js) drives the
    // canvas and the timer; this file only lays them out and dresses them.
    // The canvas gets no fallback animation: CONTRACT.md hard rule 3 says the
    // visualiser responds to the microphone or it does not ship, so an idle
    // canvas must look idle.
    var voice =
      '<div class="chat__voice"' + (dictating ? '' : ' hidden') + '>' +
        '<span class="chat__voice-dot" aria-hidden="true"></span>' +
        '<canvas id="vkb-wave" class="chat__wave" aria-hidden="true"></canvas>' +
        '<span class="chat__voice-time" aria-live="off">0:00</span>' +
        '<button type="button" class="chat__voice-btn chat__voice-btn--cancel" ' +
          'data-act="cancelDictation" aria-label="Cancel dictation">' + ic('close') + '</button>' +
        '<button type="button" class="chat__voice-btn chat__voice-btn--stop" ' +
          'data-act="stopDictation" aria-label="Stop and put the transcript in the box">' +
          ic('stop') + '</button>' +
      '</div>' +
      '<p class="chat__voice-hint"' + (dictating ? '' : ' hidden') + '>' +
        esc(VKB.copy.voiceHint) + '</p>';

    // ---- header ---------------------------------------------------------
    // 586:1840 gives the header ONE 40px button on the right: an X. Two are
    // rendered — the speaker toggle Francis asked for, then the X. The X maps
    // to `reset` (start the conversation again), which is the only honest
    // meaning it can have in a prototype with no host app to close back to.
    // The second button is a NET-NEW addition to the design's header.
    var speakOn = !!state.speakEnabled;
    var head =
      '<header class="hdr chat__hdr">' +
        '<div class="chat__brand">' +
          '<span class="chat__brand-avatar" aria-hidden="true">' + ic('bot') + '</span>' +
          '<span class="chat__brand-name">' + esc(VKB.copy.title) + '</span>' +
        '</div>' +
        '<div class="chat__hdr-tools">' +
          '<button type="button" class="hdr__btn chat__hdr-btn' + (speakOn ? ' is-on' : '') + '" ' +
            'data-act="speak" aria-pressed="' + (speakOn ? 'true' : 'false') + '" ' +
            'aria-label="' + (speakOn ? 'Stop reading answers aloud' : 'Read answers aloud') + '">' +
            ic(speakOn ? 'speakerOn' : 'speakerOff') + '</button>' +
          '<button type="button" class="hdr__btn" data-act="reset" ' +
            'aria-label="Start again">' + ic('close') + '</button>' +
        '</div>' +
      '</header>';

    // ---- assemble -------------------------------------------------------
    return (
      '<div class="chat">' +
        head +
        '<div class="chat__list" id="vkb-list" role="log" aria-live="polite" aria-label="Conversation">' +
          list +
        '</div>' +
        '<div class="chat__dock">' +
          opts +
          row +
          voice +
          // Not escaped on purpose: this is a constant defined in this file
          // that contains a <b>, not anything a person typed. Every other
          // interpolation on this screen goes through esc().
          '<p class="disclaimer">' + VKB.copy.disclaimer + '</p>' +
        '</div>' +
      '</div>'
    );
  };

  // =======================================================================
  // VKB.screens.shareDialog(state) -> HTML string, or '' when closed.
  // 586:7291 (default) and 586:7347 ("Link copied").
  //
  // Reads:
  //   state.shareOpen   render at all
  //   state.shareCopied switch the circle + label to the copied state
  //   state.shareUrl    the link shown under the label (NET-NEW, see below)
  //
  // The orchestrator appends this AFTER screens.chat's html; it is fixed and
  // positions itself over the screen.
  // =======================================================================
  VKB.screens.shareDialog = function (state) {
    state = state || {};
    if (!state.shareOpen) return '';

    var copied = !!state.shareCopied;
    var label  = copied ? VKB.copy.shareCopied : VKB.copy.shareCopy;
    var glyph  = copied ? ic('check') : ic('link');

    // NET-NEW: 586:7291's lead says "Copy the link below" but no link is drawn
    // in either frame — the copy points at something the design does not
    // contain. Showing the URL is the honest reading. Muted, not interactive.
    var url = state.shareUrl ||
      ((window.location && window.location.href) ? String(window.location.href) : '');

    return (
      '<div class="share" role="dialog" aria-modal="true" aria-label="' +
          esc(VKB.copy.shareTitle) + '" data-act="closeShare">' +
        // The card stops the click, so tapping the card never closes the
        // dialog while tapping the scrim does. data-act on the scrim only;
        // the orchestrator's delegated handler sees the innermost [data-act].
        '<div class="share__card" data-act="noop">' +
          '<div class="share__head">' +
            '<span class="share__title">' + esc(VKB.copy.shareTitle) + '</span>' +
            '<button type="button" class="share__x" data-act="closeShare" ' +
              'aria-label="Close">' + ic('close') + '</button>' +
          '</div>' +
          '<div class="share__body">' +
            '<p class="share__lead">' + esc(VKB.copy.shareLead) + '</p>' +
            '<div class="share__action">' +
              '<button type="button" class="share__circle' + (copied ? ' is-copied' : '') + '" ' +
                'data-act="copyLink" aria-label="' + esc(label) + '">' + glyph + '</button>' +
              '<span class="share__label" aria-live="polite">' + esc(label) + '</span>' +
              (url ? '<span class="share__url">' + esc(url) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="share__foot">' +
            '<button type="button" class="btn btn--primary btn--block share__close" ' +
              'data-act="closeShare">' + esc(VKB.copy.shareClose) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  };

  // Exposed only so the orchestrator and Agent K3 can escape text the same
  // way this file does, rather than each rolling their own.
  VKB.escapeHtml = esc;
  VKB.formatTime = fmtTime;
})();


/* ===== app.js ===== */
/* ============================================================================
   RAKEZ Knowledge Assistant — orchestrator
   Design: Figma nrorp581s8x8Z4G14dmh2O node 604:11918

   Owns: state, the one delegated event handler, the conversation loop, and the
   wiring between the engine (K2), the voice module (K3) and the screens (K1).

   Honesty rules, from CONTRACT.md, enforced here as well as in the engine:
   nothing is invented, nothing dead-ends, and the assistant never says
   "I don't know". No network calls, no storage, no analytics.
   ========================================================================== */
(function () {
  'use strict';

  window.VKB = window.VKB || {};

  /* ---------------------------------------------------------------- state */

  var initialState = function () {
    return {
      messages: [],
      persona: null,
      awaiting: false,
      dictating: false,
      speakEnabled: false,   // nothing speaks at someone who did not ask it to
      shareOpen: false,
      shareCopied: false,
      shareUrl: location.href.split('#')[0],
      draft: '',
      chips: null,
      chipsLabel: null
    };
  };

  VKB.state = initialState();

  // The persona is two different things: a scoring hint that should persist for
  // the whole conversation, and a signal to the dock to show that persona's
  // starter questions. Only the second should disappear once the conversation
  // is under way, otherwise the starter list sits there eating half the screen
  // and duplicating the follow-up chips inside the answer.
  VKB.context = { persona: null };

  var seq = 0;
  function nextId() { seq += 1; return 'm' + seq; }

  /* --------------------------------------------------------------- render */

  function render() {
    var root = document.getElementById('app');
    root.innerHTML = VKB.screens.chat(VKB.state) + VKB.screens.shareDialog(VKB.state);
    scrollToEnd();
  }

  function scrollToEnd() {
    var list = document.getElementById('vkb-list');
    if (list) list.scrollTop = list.scrollHeight;
  }

  // Re-render without losing what the person is part-way through typing.
  function rerender() {
    var input = document.getElementById('vkb-input');
    if (input && !VKB.state.dictating) VKB.state.draft = input.value;
    render();
    var fresh = document.getElementById('vkb-input');
    if (fresh && !VKB.state.dictating) {
      fresh.value = VKB.state.draft || '';
    }
  }

  /* ---------------------------------------------------- the conversation */

  function pushUser(text) {
    VKB.state.messages.push({
      who: 'user', text: text, id: nextId(), ts: Date.now()
    });
  }

  function pushBot(answer) {
    var m = {
      who: 'bot',
      id: nextId(),
      ts: Date.now(),
      text: answer.text,
      bullets: answer.bullets,
      facts: answer.facts,
      factsLabel: answer.factsLabel,
      chips: answer.chips,
      source: answer.source,
      entryId: answer.entryId,
      matchType: answer.matchType
    };
    VKB.state.messages.push(m);
    return m;
  }

  // The typing indicator is not decoration. It gives the answer a beat so the
  // conversation reads as a conversation rather than a lookup table.
  function answer(query, context) {
    VKB.state.awaiting = true;
    VKB.state.chips = null;
    VKB.state.chipsLabel = null;
    rerender();

    window.setTimeout(function () {
      var a;
      try {
        a = VKB.engine.ask(query, context || { persona: VKB.context.persona });
      } catch (err) {
        // Even a broken engine must not dead-end. Fall back to the contact
        // route rather than showing the person an error.
        a = {
          text: 'Let me point you to someone who can help with that directly. ' +
                'RAKEZ customer happiness can be reached on 600 577 000, or through ' +
                'the contact form on rakez.com.',
          chips: personaChips(),
          matchType: 'weak'
        };
      }
      VKB.state.awaiting = false;
      var m = pushBot(a);
      rerender();
      if (VKB.state.speakEnabled) VKB.voice.speak(spokenForm(m));
    }, 550 + Math.round(Math.random() * 350));
  }

  // What gets read aloud: the prose and the bullets, not the labels, URLs or
  // punctuation furniture.
  function spokenForm(m) {
    var parts = [];
    if (m.text) parts.push(Array.isArray(m.text) ? m.text.join(' ') : m.text);
    if (m.bullets && m.bullets.length) parts.push(m.bullets.join(', '));
    return parts.join(' ');
  }

  function personaChips() {
    var ps = (VKB.engine && VKB.engine.personas) || [];
    return ps.map(function (p) {
      return { label: p.label, value: 'persona:' + p.id };
    });
  }

  function send(text) {
    text = (text || '').trim();
    if (!text) return;
    VKB.state.draft = '';
    // The starters have done their job once a real question has been asked.
    VKB.state.persona = null;
    pushUser(text);
    answer(text);
  }

  /* --------------------------------------------------------------- voice */

  function startDictation() {
    VKB.state.dictating = true;
    VKB.state.draft = document.getElementById('vkb-input')
      ? document.getElementById('vkb-input').value : VKB.state.draft;
    render();

    VKB.voice.startDictation({
      onInterim: function (partial) {
        var t = document.querySelector('.chat__voice-hint');
        if (t) t.textContent = partial || 'Listening…';
      },
      onLevel: function () { /* the canvas is driven inside voice.js */ }
    }).then(function (res) {
      if (res && res.ok === false && res.error === 'denied') {
        // A denied microphone is a browser event, not a failure of the
        // journey. Say so plainly and let them type.
        VKB.state.dictating = false;
        VKB.voice.cancel();
        VKB.state.draft = '';
        rerender();
        var hint = document.getElementById('vkb-input');
        if (hint) hint.placeholder = 'Microphone is off. Type your question instead.';
      }
    });

    tickTimer();
  }

  var timerHandle = null;

  function tickTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (!VKB.state.dictating) { clearInterval(timerHandle); timerHandle = null; return; }
      var s = VKB.voice.elapsed();
      var t = document.querySelector('.chat__voice-time');
      if (t) t.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
    }, 250);
  }

  function stopDictation() {
    VKB.voice.stopDictation().then(function (res) {
      VKB.state.dictating = false;
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }

      if (res && res.supported === false) {
        // Never invent words the person did not say.
        VKB.state.draft = '';
        rerender();
        var input = document.getElementById('vkb-input');
        if (input) {
          input.placeholder = 'Dictation is not available in this browser. Type your question instead.';
          input.focus();
        }
        return;
      }

      VKB.state.draft = (res && res.transcript) || '';
      rerender();
      // The transcript lands in the box so it can be corrected. It is never
      // sent on the person's behalf.
      var box = document.getElementById('vkb-input');
      if (box) { box.value = VKB.state.draft; box.focus(); }
    });
  }

  function cancelDictation() {
    VKB.voice.cancel();
    VKB.state.dictating = false;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    rerender();
  }

  /* ------------------------------------------------------------- actions */

  var actions = {
    send: function () {
      var input = document.getElementById('vkb-input');
      send(input ? input.value : VKB.state.draft);
    },

    chip: function (elm) {
      var value = elm.getAttribute('data-value') || '';
      if (value.indexOf('persona:') === 0) {
        var id = value.slice('persona:'.length);
        VKB.state.persona = id;      // dock shows this persona's starters
        VKB.context.persona = id;    // and scoring keeps it for the whole chat
        var p = (VKB.engine.personas || []).filter(function (x) { return x.id === id; })[0];
        pushUser(p ? p.label : id);
        VKB.state.awaiting = true;
        rerender();
        window.setTimeout(function () {
          VKB.state.awaiting = false;
          pushBot({
            text: p && p.blurb ? p.blurb : 'Here are the things people usually ask about.',
            chips: VKB.engine.starters(id),
            matchType: 'persona'
          });
          rerender();
        }, 450);
        return;
      }
      send(value);
    },

    mic: function () { startDictation(); },
    stopDictation: function () { stopDictation(); },
    cancelDictation: function () { cancelDictation(); },

    speak: function () {
      VKB.state.speakEnabled = !VKB.state.speakEnabled;
      VKB.voice.setSpeakEnabled(VKB.state.speakEnabled);
      if (!VKB.state.speakEnabled) VKB.voice.stopSpeaking();
      rerender();
    },

    like: function (elm) { vote(elm, 'up'); },
    dislike: function (elm) { vote(elm, 'down'); },

    copy: function (elm) {
      var m = messageById(elm.getAttribute('data-id'));
      if (!m) return;
      writeClipboard(spokenForm(m));
      flash(elm);
    },

    regenerate: function (elm) {
      // Re-ask the question that produced this answer.
      var id = elm.getAttribute('data-id');
      var idx = indexById(id);
      for (var i = idx - 1; i >= 0; i--) {
        if (VKB.state.messages[i].who === 'user') {
          var q = VKB.state.messages[i].text;
          VKB.state.messages = VKB.state.messages.slice(0, idx);
          answer(q);
          return;
        }
      }
    },

    share: function () {
      VKB.state.shareOpen = true;
      VKB.state.shareCopied = false;
      rerender();
    },

    closeShare: function () {
      VKB.state.shareOpen = false;
      VKB.state.shareCopied = false;
      rerender();
    },

    copyLink: function () {
      writeClipboard(VKB.state.shareUrl);
      VKB.state.shareCopied = true;
      rerender();
    },

    reset: function () {
      VKB.voice.cancel();
      VKB.voice.stopSpeaking();
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      VKB.state = initialState();
      VKB.context = { persona: null };
      greet();
    },

    noop: function () {}
  };

  function vote(elm, dir) {
    var m = messageById(elm.getAttribute('data-id'));
    if (!m) return;
    m.vote = m.vote === dir ? null : dir;
    rerender();
  }

  function messageById(id) {
    var i = indexById(id);
    return i === -1 ? null : VKB.state.messages[i];
  }

  function indexById(id) {
    for (var i = 0; i < VKB.state.messages.length; i++) {
      if (VKB.state.messages[i].id === id) return i;
    }
    return -1;
  }

  // Clipboard is best-effort. It is never allowed to throw at the person.
  function writeClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        return;
      }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e2) { /* nothing more we can do, and it is not worth an error */ }
  }

  function flash(elm) {
    elm.classList.add('is-on');
    window.setTimeout(function () { elm.classList.remove('is-on'); }, 900);
  }

  /* ------------------------------------------------- the one click handler */

  function onClick(ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var actEl = t.closest('[data-act]');
    if (!actEl) return;
    var name = actEl.getAttribute('data-act');
    var fn = actions[name];
    if (!fn) return;
    ev.preventDefault();
    fn(actEl);
  }

  function onKey(ev) {
    // Escape closes whatever is open. A modal with no keyboard exit is a
    // dead end for anyone not using a touchscreen.
    if (ev.key === 'Escape') {
      if (VKB.state.shareOpen) { actions.closeShare(); return; }
      if (VKB.state.dictating) { cancelDictation(); return; }
    }
    if (ev.key !== 'Enter' || ev.shiftKey) return;
    var t = ev.target;
    if (!t || t.id !== 'vkb-input') return;
    ev.preventDefault();
    actions.send(t);
  }

  /* ------------------------------------------------------------------ boot */

  function greet() {
    pushBot({
      text: (VKB.copy && VKB.copy.greeting) ||
        "Hello! I'm your AI assistant. I can help you with any query you have " +
        'related to RAKEZ. How can I help you today?',
      chips: personaChips(),
      matchType: 'persona'
    });
    VKB.state.chipsLabel = 'What would you like to know about?';
    render();
  }

  function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        VKB.voice.cancel();
        VKB.voice.stopSpeaking();
        if (VKB.state.dictating) { VKB.state.dictating = false; rerender(); }
      }
    });
    window.addEventListener('pagehide', function () {
      VKB.voice.cancel();
      VKB.voice.stopSpeaking();
    });

    greet();
  }

  VKB.send = send;
  VKB.render_ = render;
  VKB.boot = boot;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
