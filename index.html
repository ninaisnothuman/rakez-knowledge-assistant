there","which viza do i need","types of rakez viza","what kind of viza can i get","residance visa options","types of rocket visa","types of racket visa","i need to know types of rakez visa","i need to know what kind of visa can i get","can you tell me residence visa options","what is a residence visa","explain uae residency","can you explain uae residency","whats uae residency","define a residence visa","details about a residence visa","tell me about residence visas","residence visa information","meaning of a residence visa"],"keywords":["visa","visas","types","type","kind","which","residence","residency","employee","employment","investor","partner","dependent","family","golden","permit","categories","options","kinds","difference","rakez","dont","applies","between","list","shareholder","mine","mean","explain","uae","explained","whats","meaning","define","understand","information","details","through","allowed","apply","possible","qualify","eligible","eligibility","rules","conditions","viza","residance","rocket","racket"],"paraphrases":["RAKEZ sponsors UAE residence visas for people tied to a RAKEZ company.","The main visa types are investor or partner, employee, and dependent.","A single shareholder gets an investor visa; several shareholders get partner visas.","RAKEZ also handles work permits, amendments, cancellations and Golden Visa support.","A shareholder does not have to take a RAKEZ visa."],"title":"The visa types RAKEZ handles","answer":"RAKEZ sponsors UAE residence visas for people connected to a RAKEZ company. The main ones are the investor or partner visa (for shareholders), the employee visa (for staff the company hires), and the dependent visa (for a visa holder's spouse and children). RAKEZ also handles work permits, entry permit extensions, visa amendments and cancellations, and can support Golden Visa applications.","bullets":["Investor / partner visa — for a shareholder in the company. A single shareholder gets an investor visa; multiple shareholders get partner visas.","Employee visa — for staff sponsored by the company","Dependent visa — for the spouse and children of a visa holder","Work permits — temporary work permits and non-sponsored ID cards","Golden Visa — 10-year residency, applied for through RAKEZ under one of six categories"],"facts":[{"label":"Shareholder visa type","value":"Single shareholder = investor visa; multiple shareholders = partner visas","confidence":"confirmed"},{"label":"Must a shareholder take a RAKEZ visa?","value":"No. Shareholders can hold a RAKEZ visa or a non-RAKEZ visa.","confidence":"confirmed"}],"followUps":["What documents do I need for an employee visa?","How much does an investor visa cost?","Can my family come?"],"source":"https://rakez.com/en/service-cards/visa-services"},{"id":"employee-visa-documents","persona":["visa-seeker"],"questions":["what documents do i need for an employee visa","employee visa paperwork","documents for staff visa","visa documents","what do i need to give you for a visa","employment visa requirements","do i need attested certificates","how long must my passport be valid","do i need health insurance for the visa","my passport expires in 4 months is that ok","what does my employee need to give me","employment visa docs","papers for staff visa","does my degree need attestation","employment visa documents","a staff visa document list","a work visa requirements","what papers do i need for an employee visa","documents required for employment visa","a staff visa checklist","what do i have to submit for a work visa","what do you need from me for an employee visa","list of documents for employment visa","a staff visa paperwork","required documents a work visa","what should i prepare for an employee visa","what docuemnts do i need for an employee visa","employe visa paperwork","docuemnts for staff visa","what do i need to give you for a viza","employment viza requirements","i need to know documents for staff visa","i need to know what do i need to give you for a visa","can you tell me employment visa requirements"],"keywords":["documents","document","paperwork","requirements","need","employee","employment","staff","visa","passport","photo","insurance","attested","certificate","docs","degree","qualification","upload","portal","give","certificates","long","valid","health","expires","months","papers","attestation","list","work","required","checklist","submit","prepare","docuemnts","employe","viza"],"paraphrases":["For most people an employee visa needs a passport, a photo and health insurance.","The passport must have at least six months validity left.","Health insurance must come from a provider approved by immigration.","Some job levels need an attested qualification certificate.","Documents are uploaded through Portal 360."],"title":"Documents for a new employee visa","answer":"For most people it is a passport, a photo and health insurance. Some roles and some nationalities need extra papers. Everything is uploaded through Portal 360.","bullets":["Passport valid for at least 6 more months","Passport-size colour photo on a white background","Valid health insurance from an immigration-approved provider","Attested education certificate — only for medium and senior positions","National Identity Card — for nationals of Iraq, Iran, Afghanistan and Pakistan","Attested medical report — for nationals of Ethiopia, Sri Lanka and Indonesia applying from outside the UAE","Good conduct certificate — for several nationalities including Egypt, Nigeria and Kenya (attested by the UAE Embassy if you are abroad, or by UAE Police if you are already here)"],"facts":[{"label":"Passport validity needed","value":"At least 6 months","confidence":"confirmed"},{"label":"Health insurance","value":"Required, from a provider approved by immigration","confidence":"confirmed"}],"followUps":["How long does the employee visa take?","How much does it cost?","What is the medical test?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-steps","persona":["visa-seeker"],"questions":["how does the visa process work step by step","visa steps","what is the order of the visa process","what happens first medical or emirates id","visa process stages","how do i get my residence visa","what happens first","what are the stages of a visa","do i have to come to the uae for this","whats the order of the visa steps","do i need to visit an office","what comes after the entry permit","visa flow","stages in order","how many steps are there","how do i get a residence visa","how to go through the visa process","what is the process to get a residence visa","steps to go through the visa process","the visa process process","the visa procedure procedure","how does getting a residence visa work","what do i do to go through the visa process","walk me through the visa process","the visa procedure step by step","the process for getting a residence visa","where do i go to go through the visa process","guide for the visa process","how does the viza process work step by step","what is the order of the viza process","what happens first medcal or emirates id","viza process stages","how do i get my residance visa","what happens first medical or emirate id","what happens first medical or emirates i d","i need to know what happens first medical or emirates id","i need to know visa process stages","can you tell me how do i get my residence visa"],"keywords":["steps","step","process","order","stages","how","first","next","entry","permit","activate","medical","emirates","id","biometrics","stamping","residence","activation","issued","visa","work","happens","come","uae","whats","visit","office","comes","after","flow","many","through","procedure","getting","walk","guide","viza","medcal","residance","emirate"],"paraphrases":["The visa runs in six stages from application to residence visa issue.","You apply, get an entry permit, activate it, do a medical, give biometrics, then the visa is issued.","RAKEZ drives most of the process for you.","You only attend in person for the medical and, if it is your first Emirates ID, biometrics.","The e-visa entry permit is valid for 60 days from issue."],"title":"The visa process, in order","answer":"It runs in six stages and RAKEZ drives most of it. You apply, you get an entry permit, the visa is activated, you do a medical, you do Emirates ID biometrics, and then the residence visa is issued. You only need to physically turn up for the medical and the biometrics.","bullets":["1. Apply for the entry permit on Portal 360","2. Entry permit approved and the e-visa is issued (subject to immigration approval)","3. Activate the visa — RAKEZ does this if you are already inside the UAE; immigration does it on arrival if you are coming from abroad","4. Medical fitness test at the RAKEZ Medical Fitness Centre or any UAE-approved centre","5. Emirates ID and biometrics — first-time applicants only; if you already have an Emirates ID, RAKEZ submits it for you and you skip this","6. Residence visa and Emirates ID issued; you are a UAE resident"],"facts":[{"label":"e-visa (entry permit) validity","value":"60 days from the date it is issued","confidence":"confirmed"},{"label":"Do I need to visit an office?","value":"Only for the medical test and, if it is your first Emirates ID, the biometrics","confidence":"confirmed"}],"followUps":["What is the medical test like?","How long does the whole thing take?","What documents do I need?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-time","persona":["visa-seeker"],"questions":["how long does a visa take","visa processing time","how long employee visa","how fast can i get a visa","visa timeline","how many days visa","how long does the visa take","how long","my visa is taking ages is that normal","is 6 days normal for a visa","how many working days for a residence visa","when do i get my visa","vip visa speed","is there a faster option","i need the visa urgently how fast can you do it","how long does a new visa take","an employee visa processing time","a residence visa timeline","how long for the visa","a new visa duration","how many days does an employee visa take","when will a residence visa be ready","turnaround time for the visa","how long do i have to wait for a new visa","time taken for an employee visa","a residence visa how long","lead time for the visa","how quickly can i get a new visa","how long does a viza take","viza processing time","how long employe visa","how fast can i get a viza","how many days viza","i need to know how long employee visa","i need to know how fast can i get a visa","can you tell me how many days visa"],"keywords":["how","long","time","days","fast","quick","timeline","processing","speed","vip","urgent","standard","visa","working","wait","delay","take","employee","many","taking","ages","normal","residence","faster","option","urgently","new","duration","ready","turnaround","taken","lead","quickly","viza","employe"],"paraphrases":["RAKEZ quotes 3 working days for a new visa on the VIP package.","The standard package is quoted at 6 working days.","The same 3 and 6 working day timings apply to employee and investor visas.","A new dependent visa is quoted at 9 working days.","Those timings assume complete documents and no immigration queries."],"title":"How long a new visa takes","answer":"RAKEZ quotes 3 working days on the VIP package and 6 working days on the standard package, for both employee and investor/partner visas. That is RAKEZ's processing time — it assumes your documents are complete and immigration approves without questions.","bullets":["VIP package — 3 working days","Standard package — 6 working days","Dependent visas take longer: 9 working days on the normal timeline","Delays usually come from missing documents, an expiring passport, or immigration security checks"],"facts":[{"label":"New visa, VIP","value":"3 working days","confidence":"confirmed"},{"label":"New visa, standard","value":"6 working days","confidence":"confirmed"},{"label":"New dependent visa","value":"9 working days (normal)","confidence":"confirmed"}],"followUps":["What is in the VIP package?","How much does it cost?","What documents do I need?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"employee-visa-cost","persona":["visa-seeker"],"questions":["how much is an employee visa","visa cost","what does a visa cost","employee visa price","cost of residence visa rakez","visa fees","how much is the visa","what do i pay for a staff visa","is the visa price all inclusive","does the visa price include emirates id","whats the extra charge if im already in the uae","employee visa budget","how much for one visa","visa price list","how much does a new employee visa cost","what does a work visa cost","a staff visa cost","an employee visa price","a new employee visa fees","how much do i pay for a work visa","what is the fee for a staff visa","price of an employee visa","how much money do i need for a new employee visa","is a work visa expensive","what are the charges for a staff visa","total cost of an employee visa","a new employee visa pricing","how much is an employe visa","what does a viza cost","employe visa price","cost of residance visa rakez","how much is the viza","cost of residence visa rocket","cost of residence visa racket","i need to know employee visa price","i need to know cost of residence visa rakez","can you tell me how much is the visa"],"keywords":["cost","costs","price","fee","fees","how","much","aed","money","charge","expensive","visa","employee","vip","3800","985","activation","inclusive","quote","budget","vat","residence","rakez","pay","staff","all","include","emirates","whats","extra","already","uae","one","list","new","work","charges","total","pricing","employe","viza","residance","rocket","racket"],"paraphrases":["The VIP all-inclusive employee visa package is listed at AED 3,800.","An applicant already inside the UAE pays an extra AED 985 to activate the visa.","The standard package price is not shown clearly on the RAKEZ page.","Ask RAKEZ for a written quote before budgeting for a visa.","RAKEZ visa fees are quoted excluding VAT."],"title":"What a new employee visa costs","answer":"RAKEZ's VIP all-inclusive employee visa package is listed at AED 3,800. If the applicant is already inside the UAE there is an extra AED 985 to activate the visa. The standard package price is not shown clearly on the page, so ask RAKEZ for a written quote before you budget.","bullets":["VIP all-inclusive — AED 3,800","Add AED 985 if the applicant is already inside the UAE (visa activation)","VIP includes same-day medical and biometrics, the Essential health insurance plan, door delivery of the Emirates ID in 2 to 3 working days, and 20% off dependent visas","On the standard package the medical, insurance and ID delivery are charged separately","Fees are quoted excluding VAT"],"facts":[{"label":"VIP all-inclusive employee visa","value":"AED 3,800","confidence":"confirmed"},{"label":"In-country activation surcharge","value":"AED 985","confidence":"confirmed"},{"label":"Standard package price","value":"Not legible on the RAKEZ page — request a quote","confidence":"unconfirmed"}],"followUps":["What is in the VIP package?","How much is health insurance?","How much is a dependent visa?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"investor-visa","persona":["visa-seeker","setter-upper"],"questions":["investor visa","partner visa","shareholder visa","can i get a visa as the owner","how much is an investor visa","owner visa rakez","can i sponsor myself","im a shareholder what visa do i get","difference between investor and partner visa","investor visa price","how long does an investor visa take","do partners get separate visas","owner visa","visa for the company owner","i own the company which visa","what is an investor visa","what does a partner visa mea "If you are a shareholder in a RAKEZ company you can sponsor yourself. A single shareholder gets an investor visa; where there are several shareholders they get partner visas. The process is the same six stages as an employee visa.","bullets":["VIP package — AED 3,800, 3 working days","Standard charges listed as AED 4,620, 6 working days","Add AED 985 if you are already inside the UAE","You need a passport valid 6+ months, a white-background photo, and immigration-approved health insurance","Nationals of Egypt, Nigeria, Indonesia, Sri Lanka and Kenya get an approval rather than an e-visa and must visit the UAE Embassy within 45 days"],"facts":[{"label":"VIP investor/partner visa","value":"AED 3,800, 3 working days","confidence":"confirmed"},{"label":"Standard investor/partner visa","value":"AED 4,620 listed, 6 working days — confirm with RAKEZ, the VIP price reads lower than standard on the page","confidence":"varies"},{"label":"Embassy visit deadline (certain nationalities)","value":"45 days","confidence":"confirmed"}],"followUps":["What is the visa process step by step?","Can I sponsor my family?","Do I need a RAKEZ visa as a shareholder?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-investor-partner"},{"id":"medical-fitness-test","persona":["visa-seeker"],"questions":["what is the medical test","visa medical","blood test x ray visa","medical fitness test rakez","how much is the medical","where do i do my medical","do i have to do a medical","what happens in the medical test","how long do medical results take","is there a blood test","do i need an xray","how long is the medical certificate valid","medical test fee","where do i do the medical","my medical result is late","do children need a medical","what does the medical fitness test mean","explain the visa medical","tell me about the health check","the medical test","the medical fitness test explained","whats the visa medical","meaning of the health check","define the medical test","i dont understand the medical fitness test","can you explain the visa medical","the health check information","details about the medical test","how much is the medical test","how much does the medical fitness test cost","what does the visa medical cost","the health check cost","the medical test price","the medical fitness test fees","how much do i pay for the visa medical","what is the fee for the health check","price of the medical test","how much money do i need for the medical fitness test","is the visa medical expensive","what are the charges for the health check","total cost of the medical test","the medical fitness test pricing","what is the medcal test","blood test x ray viza","medcal fitness test rakez","how much is the medcal","where do i do my medcal","medical fitness test rocket","medical fitness test racket","i need to know medical fitness test rakez","i need to know how much is the medical","can you tell me where do i do my medical"],"keywords":["medical","fitness","test","blood","xray","x-ray","chest","health","screening","clinic","centre","center","medicals","results","certificate","30","300","visa","ray","rakez","much","happens","long","take","valid","fee","result","late","children","mean","explain","check","explained","whats","meaning","define","dont","understand","information","details","cost","price","fees","pay","money","expensive","charges","total","pricing","medcal","viza","rocket","racket"],"paraphrases":["Every visa applicant aged 18 and over must pass a medical fitness test.","The test is a blood test plus a chest x-ray for new visas.","Results come back within 24 hours by email and SMS.","The medical examination fee is AED 30 and form typing is AED 300.","The medical certificate is valid for 3 months from the test date."],"title":"The visa medical fitness test","answer":"Every visa applicant aged 18 and over has to pass a medical fitness test before the residence visa is issued. It is a blood test and, for new visas, a chest x-ray. It takes about 15 minutes and results come back within 24 hours by email and SMS.","bullets":["Check in, blood test, chest x-ray (new visas only), then results","Around 15 minutes at the centre; results within 24 hours by email and SMS","Medical examination AED 30; medical form typing AED 300; health card AED 285; urgent processing AED 500","You must do the medical within one month of the RAKEZ typing date","The medical certificate is valid for 3 months from the test date","RAKEZ Service Centre, Amenity Centre, Al Jazeera Al Hamra Industrial, Ras Al Khaimah. Mon–Fri 8:00–16:00, Sat 9:00–14:00. Walk-ins accepted, booking recommended."],"facts":[{"label":"Medical examination fee","value":"AED 30","confidence":"confirmed"},{"label":"Medical form typing","value":"AED 300","confidence":"confirmed"},{"label":"Results turnaround","value":"Within 24 hours","confidence":"confirmed"},{"label":"Deadline to take the test","value":"Within 1 month of the RAKEZ typing date","confidence":"confirmed"},{"label":"Certificate validity","value":"3 months from test date","confidence":"confirmed"},{"label":"Who must take it","value":"Everyone aged 18 and above","confidence":"confirmed"}],"followUps":["What happens after the medical?","What is Emirates ID biometrics?","Can I do the medical somewhere else?"],"source":"https://rakez.com/en/promotions/al-hamra-medical-centre"},{"id":"emirates-id-biometrics","persona":["visa-seeker"],"questions":["what is emirates id","do i need biometrics","emirates id fingerprints","when do i get my emirates id","emirates id card delivery","eid","do i need to give fingerprints","where do i do biometrics","when do i get my emirates id card","i already have an emirates id do i redo biometrics","emirate id delivery","how is the id card delivered","emirates i d process","id card timing","do i need to go anywhere for the id","what is the emirates id","what does emirates id mean","explain the id card","tell me about biometrics","the emirates id","emirates id explained","whats t n for you and you skip the biometrics.","bullets":["First-time applicants do biometrics in person","Existing Emirates ID holders skip this step — RAKEZ submits directly","On the VIP package the card is delivered to your door in 2 to 3 working days","On the standard package delivery is an optional extra","You receive a digital residence visa and digital Emirates ID as well as the physical card"],"facts":[{"label":"Card delivery, VIP package","value":"2 to 3 working days to your door","confidence":"confirmed"},{"label":"Biometrics needed?","value":"Only for a first Emirates ID","confidence":"confirmed"}],"followUps":["What is the medical test?","How long does the whole visa take?","What do I get at the end?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-employee"},{"id":"entry-permit","persona":["visa-seeker"],"questions":["what is an entry permit","difference between entry permit and residence visa","e-visa validity","how long is my entry permit valid","entry permit expiring","how long is the entry permit valid","my e visa expires soon","what is an evisa","is the entry permit the same as the visa","can i change my entry permit details","entry permit amendment cost","60 day visa","do i enter on the entry permit","what does the entry permit mean","explain the e-visa","tell me about entry permit vs residence visa","an entry permit","the entry permit explained","whats the e-visa","meaning of entry permit vs residence visa","define an entry permit","i dont understand the entry permit","can you explain the e-visa","entry permit vs residence visa information","details about an entry permit","difference between entry permit and residance visa","i need to know how long is my entry permit valid","i need to know entry permit expiring","can you tell me difference between entry permit and residence visa"],"keywords":["entry","permit","evisa","e-visa","difference","validity","valid","60","days","expire","expiring","extension","amendment","485","985","enter",  visa 2 years","visa term","how long can i stay on this visa","when do i find out how long my visa lasts","when should i find out how long my visa lasts","what is the deadline for uae residency","my visa deadline","when is a residence visa due","how soon do i need to find out how long my visa lasts","last date for uae residency","is there a time limit for my visa","how long does a residence visa run for","when does the visa start","how long is a residance visa valid","viza validity years","is my viza 2 years or 3","how many years residance visa","how many years is a residance visa","i need to know is my visa 2 years or 3","i need to know how many years residence visa","can you tell me how many years is a residence visa","how long is the duration of a residence visa"],"keywords":["validity","valid","duration","years","long","2","3","10","golden","how","residence","expire","expiry","term","1","5","visa","many","residency","last","rakez","stay","find","lasts","deadline","uae","due","soon","date","time","limit","timing","start","mean","explain","explained","whats","meaning","define","dont","understand","information","details","residance","viza"],"paraphrases":["Sponsored UAE residence visas are issued for 1, 2 or 3 years.","Unsponsored long-term visas such as the Golden Visa run for 5 or 10 years.","RAKEZ confirms the exact term when your visa is issued.","Staying outside the UAE for more than 180 days in a row voids a residence visa."],"title":"How long a residence visa lasts","answer":"Sponsored residence visas in the UAE are issued for 1, 2 or 3 years. Unsponsored long-term visas such as the Golden Visa run for 5 or 10 years. RAKEZ will tell you the exact term on your own visa when it is issued.","bullets":["Sponsored residence visa — 1, 2 or 3 years","Unsponsored long-term visa — 5 or 10 years","Golden Visa — 10 years","A residence visa becomes void automatically if you stay outside the UAE continuously for more than 180 days, with some exceptions"],"facts":[{"label":"Sponsored visa terms","value":"1, 2 or 3 years","confidence":"confirmed"},{"label":"Golden Visa","value":"10 years","confidence":"confirmed"},{"label":"Time you may stay outside the UAE","value":"Up to 180 days continuously, or the visa becomes void (exceptions exist for students, patients, diplomats and others)","confidence":"confirmed"}],"followUps":["What is the 180 day rule?","How do I renew my visa?","What is the Golden Visa?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"180-day-rule","persona":["visa-seeker"],"questions":["180 day rule","how long can i stay outside the uae","will my visa be cancelled if i leave","i have been abroad 6 months","visa void outside uae","will my visa be cancelled if i stay abroad","i have been out of the country for 7 months","does my visa die if i dont come back","how often do i need to enter the uae","180 days outside","is there an exception to the 180 day rule","can i keep my visa if i live abroad","my visa expired while i was overseas","what is the 180 day rule","what does staying outside the uae mean","explain being abroad too long","tell me about the six month rule","the 180 day rule","staying outside the uae explained","whats being abroad too long","meaning of the six month rule","define the 180 day rule","i dont understand staying outside the uae","can you explain being abroad too long","the six month rule information","details about the 180 day rule","can i stay outside the uae","am i allowed to leave the uae for a long time","is it possible to stay outside the uae","is the six month rule allowed","do i qualify to stay outside the uae","who can leave the uae for a long time","am i eligible to stay outside the uae","is it ok to leave the uae for a long time","eligibility for the 180 day rule","staying outside the uae eligibility","are there rules about being abroad too long","what are the conditions for the six month rule","will my viza be cancelled if i leave","viza void outside uae","i need to know will my visa be cancelled if i leave","i need to know i have been abroad 6 months","can you tell me visa void outside uae"],"keywords":["180","days","outside","abroad","away","travel","stay","void","cancelled","six","months","rule","overseas","re-entry","reentry","exception","students","day","long","uae","visa","leave","country","die","dont","come","back","often","enter","keep","live","expired","while","staying","mean","explain","being","month","explained","whats","meaning","define","understand","information","details","allowed","time","possible","qualify","eligible","eligibility","rules","conditions","viza"],"paraphrases":["Staying outside the UAE for more than 180 days in a row voids your residence visa automatically.","You must re-enter the UAE within 180 days of leaving to keep the visa alive.","Exceptions exist for students, medical patients, diplomats and some other categories.","After a visa renewal the same 180-day re-entry rule applies."],"title":"The 180-day rule","answer":"If you stay outside the UAE for more than 180 days in a row, your residence visa becomes void automatically. To keep it alive you must re-enter within 180 days of leaving. There are exceptions for students, medical patients, diplomats and some other categories.","bullets":["Re-enter the UAE within 180 days of your last exit","Beyond that the visa is void and has to be started again","RAKEZ repeats this warning on its visa and visa renewal pages","If you are already past 180 days, contact RAKEZ before booking a flight"],"facts":[{"label":"Maximum time outside the UAE","value":"180 continuous days","confidence":"confirmed"}],"followUps":["How do I renew my visa?","What happens if my visa has expired?","How do I contact RAKEZ?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"dependent-visa-eligibility","persona":["visa-seeker"],"questions":["can my family come","can i sponsor my wife","can i bring my children","dependent visa eligibility","family visa salary requirement","sponsor my husband","how much salary to sponsor family","can my wife come","what salary do i need to sponsor my family","can i sponsor my husband","dependant visa rules","minimum salary for family visa","i earn 3500 can i sponsor my wife","can i sponsor my family","am i allowed to bring my wife and children","is it possible to sponsor my family","is bringing my wife and kids allowed","do i qualify to sponsor my family","who can bring my wife and children","am i eligible to sponsor my family","is it ok to bring my wife and children","eligibility for a dependent visa","a family visa eligibility","are there rules about sponsoring my family","what are the conditions for bringing my wife and kids","what is a dependent visa","what does a family visa mean","explain sponsoring my family","tell me about bringing my wife and kids","a dependent visa","a family visa explained","whats sponsoring my family","meaning of bringing my wife and kids","define a dependent visa","i dont understand a family visa","can you explain sponsoring my family","bringing my wife and kids information","details about a dependent visa","dependant visa eligibility","family viza salary requirement","i need to know can i bring my children","i need to know dependent visa eligibility","can you tell me family visa salary requirement"],"keywords":["family","dependent","dependant","wife","husband","spouse","children","child","kids","son","daughter","sponsor","salary","4000","3000","newborn","baby","accommodation","come","bring","visa","eligibility","requirement","much","rules","parents","minimum","earn","3500","allowed","possible","bringing","qualify","eligible","sponsoring","conditions","mean","explain","explained","whats","meaning","define","dont","understand","information","details","viza"],"paraphrases":["Once you hold a valid UAE residence visa you can sponsor your spouse and children.","The sponsor needs a salary of at least AED 4,000 a month.","AED 3,000 a month is enough if the company provides accommodation.","Dependent visas are processed through Portal 360.","A dependent who enters on an entry permit has 60 days to complete the residence visa."],"title":"Bringing your family on a dependent visa","answer":"Yes, once you hold a valid UAE residence visa you can sponsor your spouse and children. You need to earn at least AED 4,000 a month, or AED 3,000 a month if your company provides your accommodation. RAKEZ processes dependent visas through Portal 360.","bullets":["You can sponsor a spouse, children of any age, and babies born in the UAE","Minimum salary AED 4,000 a month, or AED 3,000 plus company accommodation","Your own residence visa must be valid first","Family members aged 18 and over must pass the medical fitness test","If a dependent enters on an entry permit, you have 60 days to apply for their residence visa","A sponsor must cancel dependents' visas before cancelling their own"],"facts":[{"label":"Minimum sponsor salary","value":"AED 4,000 per month, or AED 3,000 plus accommodation","confidence":"confirmed"},{"label":"Deadline after dependent enters on entry permit","value":"60 days","confidence":"confirmed"},{"label":"Who can be sponsored","value":"Spouse, children, newborns born in the UAE","confidence":"confirmed"}],"followUps":["How much does a dependent visa cost?","What documents do I need for a family visa?","Can I sponsor my parents?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-dependents"},{"id":"dependent-visa-cost","persona":["visa-seeker"],"questions":["how much is a dependent visa","family visa cost","cost to bring my wife","child visa price","newborn visa cost","dependent visa fees","how much to bring my wife","cost of a child visa","family visa price","how much for my son's visa","is there a deposit for dependents","dependant visa fees","price for two children","how much does it cost to sponsor my family","how much does a family visa cost","what does a spouse visa cost","a child visa cost","a dependent visa price","a family visa fees","how much do i pay for a spouse visa","what is the fee for a child visa","price of a dependent visa","how much money do i need for a family visa","is a spouse visa expensive","what are the charges for a child visa","total cost of a dependent visa","a family visa pricing","how much is a dependant visa","family viza cost","child viza price","newborn viza cost","i need to know cost to bring my wife","i need to know child visa price","can you tell me newborn visa cost"],"keywords":["dependent","dependant","family","wife","spouse","child","children","newborn","baby","cost","price","fee","fees","aed","how","much","deposit","3375","3075","1505","3310","refundable","visa","bring","son's","dependents","two","sponsor","pay","money","expensive","charges","total","pricing","viza"],"paraphrases":["A new dependent visa is AED 3,375 for a spouse or a child aged 18 and over.","A child under 18 is AED 3,075.","A newborn already inside the UAE is AED 1,505 normal or AED 2,005 urgent.","An investor or partner sponsor also pays a refundable deposit of AED 3,310 per dependent.","Dependent visa prices exclude VAT."],"title":"What a dependent visa costs","answer":"A new dependent visa is AED 3,375 for a spouse or a child aged 18 and over, and AED 3,075 for a child under 18. A newborn already inside the UAE is AED 1,505. If the sponsor is an investor or partner there is also a refundable deposit of AED 3,310 per dependent. Prices exclude VAT.","bullets":["Spouse or child 18+ — AED 3,375","Child under 18 — AED 3,075","Newborn inside the UAE — AED 1,505, or AED 2,005 urgent","Investor or partner sponsors pay an extra AED 3,310 refundable deposit per dependent","Normal processing 9 working days","RAKEZ's VIP visa packages carry a 20% discount on dependent visas"],"facts":[{"label":"Spouse / child 18+","value":"AED 3,37 th","attested","translation","requirements","wife","child","arabic","proof","address","visa","papers","attestation","contract","submit","wife's","sponsor","son","spouse","document","list","sponsoring","required","checklist","prepare","docuemnts","viza","certificat"],"paraphrases":["A dependent visa needs the dependent's passport and photo.","You must prove you are the sponsor and prove where you live.","Health insurance is required for the dependent.","A spouse needs an attested marriage certificate translated into Arabic.","Proof of accommodation is an attested tenancy contract or property ownership document."],"title":"Documents for a dependent visa","answer":"You need the dependent's passport and photo, proof that you are their sponsor, proof of where you live, and health insurance for them. A spouse also needs an attested marriage certificate with an Arabic translation.","bullets":["Dependent's valid passport","Recent colour photo on a white background","Sponsor's passport with valid residence visa","Attested tenancy contract or proof of property ownership","Valid health insurance from an immigration-approved provider","For a spouse: attested marriage certificate with Arabic translation","Documents not in English or Arabic need a certified translation"],"facts":[{"label":"Marriage certificate","value":"Required for a spouse, attested and translated into Arabic","confidence":"confirmed"},{"label":"Accommodation proof","value":"Attested tenancy contract or property ownership document","confidence":"confirmed"}],"followUps":["How much does a dependent visa cost?","What is the salary requirement?","How long does it take?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-dependents"},{"id":"dependent-visa-renewal","persona":["visa-seeker"],"questions":["renew dependent visa","family visa renewal cost","how much to renew my wifes visa","child visa renewal","dependent renewal time","how much to renew my wife's visa","child visa renewal price","how l enew or transfer.","Overstaying past the grace period carries a daily fine.","Grace period and fine rules change, so confirm your own dates with RAKEZ or ICP.","Renewal is done on Portal 360 while you are inside the UAE."],"title":"If your visa is expiring or has expired","answer":"Start the renewal before the expiry date — that is the only clean path. If a residence visa expires or is cancelled, UAE residents get a grace period to either leave, renew or transfer, and overstaying past it carries a daily fine. Because these rules change, confirm your own dates with RAKEZ before you rely on them.","bullets":["Renew before expiry — apply on Portal 360 while you are inside the UAE","Standard employee renewal is AED 3,500 and takes 4 working days, so leave more than a week","After a residence permit expires or is cancelled, residents are given a grace period which the UAE government describes as reaching up to 6 months depending on the resident category","Overstaying carries a daily fine — the UAE government portal states AED 50 per day for residence visa overstays","If you have already overstayed, call RAKEZ on 600 577 000 before booking travel"],"facts":[{"label":"Grace period after expiry or cancellation","value":"Up to 6 months depending on resident category — confirm your own category with RAKEZ or ICP","confidence":"varies"},{"label":"Overstay fine","value":"AED 50 per day per the UAE government portal — fine levels have changed before, confirm the current rate","confidence":"varies"},{"label":"Where to renew","value":"Portal 360, while inside the UAE","confidence":"confirmed"}],"followUps":["How do I renew my visa?","How do I contact RAKEZ?","What is the 180 day rule?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/Visa-information/general-provisions-for-the-residence-visa"},{"id":"visa-cancellation","persona":["visa-seeker"],"questions":["how do i cancel a visa","visa cancellation cost","cancel employee visa","i am leaving the company","  Essential plan is AED 450 a year with AED 50,000 cover.","The Elite plan is AED 750 a year with AED 150,000 cover."],"title":"Health insurance for a visa","answer":"Valid health insurance from an immigration-approved provider is on the document list for every RAKEZ visa — new and renewal, employee, investor and dependent. RAKEZ offers three plans you can buy through the portal.","bullets":["Basic — AED 350 a year, AED 40,000 cover, emergency admission in the Northern Emirates","Essential — AED 450 a year, AED 50,000 cover, adds doctor consultation in the Northern Emirates and pre-existing conditions after a 12-month wait","Elite — AED 750 a year, AED 150,000 cover, UAE-wide emergency admission, maternity, physiotherapy and networks across the UAE and Asia","The Essential plan is included in the VIP visa package","You can use another insurer as long as immigration approves it"],"facts":[{"label":"Basic plan","value":"AED 350/year, AED 40,000 cover","confidence":"confirmed"},{"label":"Essential plan","value":"AED 450/year, AED 50,000 cover","confidence":"confirmed"},{"label":"Elite plan","value":"AED 750/year, AED 150,000 cover","confidence":"confirmed"},{"label":"Is it mandatory?","value":"Listed as a required document on RAKEZ visa applications","confidence":"confirmed"}],"followUps":["What documents do I need for a visa?","What is in the VIP package?","How do I pay?"],"source":"https://rakez.com/en/service-cards/visa-services/health-insurance-plan"},{"id":"golden-visa","persona":["visa-seeker"],"questions":["golden visa","10 year visa","long term residency uae","can i get a golden visa through rakez","golden visa eligibility","how do i get a golden visa","am i eligible for the golden visa","how long is the golden visa","does rakez do golden visas","do i need a sponsor for a golden visa","gold visa categories","can my family join me on a golden visa","golden visa through my company","what are the golden visa categories","what is the golden visa","what does golden v "much","renewal","myself","each","annel","mean","explain","explained","whats","meaning","define","dont","understand","information","details","cost","price","fees","pay","money","expensive","charges","total","pricing","imigration"],"paraphrases":["E-Channel is the UAE's unified online immigration system.","Any company with an immigration file must be registered on it.","The Ministry of Interior made E-Channel registration mandatory from 1 March 2018.","RAKEZ completes the E-Channel registration on your behalf.","RAKEZ pages quote different E-Channel fees, so confirm the current figure."],"title":"E-Channel registration","answer":"E-Channel is the UAE's unified online immigration system. Any company with an immigration file has to be registered — the Ministry of Interior made it mandatory from 1 March 2018. RAKEZ completes the registration on your behalf; you cannot do it yourself through the MOI portal.","bullets":["Mandatory for every company with an immigration file, even if you never apply for a visa","RAKEZ registers on your behalf — the MOI only gives credentials to the sponsor","Visa applications go through RAKEZ as sponsor, not directly through E-Channel","If your immigration file has already expired you can still register — you pay the renewal, the late penalty and the registration fee together","Companies in the process of closing are currently exempt"],"facts":[{"label":"Registration fee","value":"RAKEZ's FAQ says AED 2,200 plus a one-time refundable deposit of AED 5,050; the shareholder-change service page lists E-Channel registration at AED 2,300. Confirm the current figure with RAKEZ.","confidence":"varies"},{"label":"Annual renewal","value":"AED 1,200 per the FAQ; AED 1,300 per the amendments service page. Confirm with RAKEZ.","confidence":"varies"},{"label":"Mandatory since","value":"1 March 2018","confidence":"confirmed"}],"followUps":["How do I apply for a visa?","How do I pay RAKEZ?","What is Portal 360?"],"source":"https://rakez.com/en/faqs"},{"id" eed to know verify my identity rakez","i need to know why do you need my passport again","can you tell me what is kyc"],"keywords":["kyc","ekyc","e-kyc","video","verification","verify","identity","id","check","know","your","customer","why","asked","selfie","face","records","passport","shareholder","being","rakez","asking","app","update","nothing","changed","documents","live","yet","mean","explain","explained","whats","meaning","define","dont","understand","information","details","complete","process","steps","procedure","work","walk","through","step","guide","rocket","racket"],"paraphrases":["KYC means Know Your Customer.","RAKEZ must keep verified, current identity records for shareholders, directors and managers.","That is why you are asked for a fresh passport copy or an identity check even when nothing changed.","A mobile video KYC flow is in development at RAKEZ and is not confirmed live on a public page."],"title":"e-KYC and video verification","answer":"KYC means Know Your Customer. RAKEZ has to keep verified, current identity records for the shareholders, directors and managers of every company it licenses. That is why you get asked for a fresh passport copy or an identity check even when nothing has changed on your side.","bullets":["It keeps your company records accurate with the regulatory authorities","It is normally triggered when a passport is renewed, a name or nationality changes, or your contact details change","Traditionally this meant an appointment and a visit to a RAKEZ desk","RAKEZ is introducing a video-based e-KYC in the customer portal so the check can be done from a phone: photograph your passport and Emirates ID, record a short video of your face, and submit","If you are asked for KYC and are not sure the request is genuine, call 600 577 000 before sending anything"],"facts":[{"label":"Why it is asked","value":"To keep shareholder, director and manager identity records current with the regulatory authorities","confidence":"confirmed"},{"label":"Video KYC in the portal","value":"In development at RAKEZ as a mobile flow (passport photo, Emirates ID photo, face video). Not confirmed as live on a public RAKEZ page — do not promise a launch date.","confidence":"unconfirmed"}],"followUps":["How do I update my details?","What documents do you need?","How do I contact RAKEZ?"],"source":"https://rakez.com/en/service-cards/contact-details-amendment-kyc-update/kyc-update-free-zone"},{"id":"kyc-update-details","persona":["everyone","renewer"],"questions":["how do i update my details","change my passport number","update my email and phone","kyc update cost","my passport was renewed","change of address","how do i change my address","how do i update my phone number","i have a new passport how do i update it","how much is a kyc update","how long does a details update take","change email on my licence","update my nationality","kyc update fee","my contact details are wrong","how to change my address on file","what is the process to update my details","steps to change my address on file","updating my details process","a kyc update procedure","how does changing my contact details work","what do i do to change my address on file","walk me through updating my details","a kyc update step by step","the process for changing my contact details","where do i go to change my address on file","guide for updating my details","how much is updating my details","how much does a kyc update cost","what does changing my contact details cost","updating my records cost","updating my details price","a kyc update fees","how much do i pay for changing my contact details","what is the fee for updating my records","price of updating my details","how much money do i need for a kyc update","is changing my contact details expensive","what are the charges for updating my records","total cost of updating my details","a kyc update pricing","i need to know update my email and phone","i need to know kyc update cost","can you tell me my passport was renewed"],"keywords":["update","change","details","passport","number","renewed","email","mobile","phone","address","nationality","name","kyc","1999","contact","500","chamber","cost","new","much","long","take","licence","fee","wrong","file","process","steps","updating","procedure","changing","work","walk","through","step","guide","records","price","fees","pay","money","expensive","charges","total","pricing"],"paraphrases":["The KYC Update service changes personal details on file with RAKEZ.","It covers name, nationality, address, passport number, renewed passport data, mobile and email.","It costs AED 1,999 plus AED 500 Chamber of Commerce.","It takes 3 to 5 working days."],"title":"Updating your details with RAKEZ","answer":"The KYC Update service is how you change personal details on file — name, nationality, address, passport number, renewed passport data, mobile number and email. It costs AED 1,999 and takes 3 to 5 working days.","bullets":["AED 1,999 for a personal details change, including the immigration file amendment","AED 500 for the Chamber of Commerce update","30% discount on subsequent amendments","3 to 5 working days","Documents: authorisation letter signed by an authorised representative, and a coloured passport copy of the person concerned","Corporate shareholders also need amended association documents, name change certificates, incumbency certificates and updated trade licences, notarised and legalised as applicable","You get back an amended e-licence, updated e-partner list, MOA amendment and Chamber of Commerce certificate where applicable","Submit through Portal 360"],"facts":[{"label":"Fee","value":"AED 1,999 (personal details) + AED 500 Chamber of Commerce","confidence":"confirmed"},{"label":"Processing time","value":"3 to 5 working days","confidence":"confirmed"}],"followUps":["What is e-KYC?","How do I change my company name?","How do I amend a visa?"],"source":"https://rakez.com/en/service-cards/contact-details-amendment-kyc-update/kyc-update-f ure","how does uae vat work","what do i do to deal with vat","walk me through vat","value added tax step by step","the process for uae vat","where do i go to deal with vat","guide for vat","vat treshold uae","is my compnay vat registered","i need to know vat threshold uae","i need to know is my company vat registered","can you tell me vat 5 percent"],"keywords":["vat","value","added","tax","register","registration","threshold","fta","5","percent","indirect","trn","federal","authority","uae","company","registered","rate","handles","rakez","included","prices","charge","free","zone","companies","pay","mean","explain","sales","explained","whats","meaning","define","dont","understand","information","details","deal","process","steps","procedure","work","walk","through","step","guide","treshold","compnay"],"paraphrases":["VAT is an indirect tax on taxable goods and services in the UAE.","It is administered by the Federal Tax Authority, not by RAKEZ.","RAKEZ can help with VAT registration as a service.","Several RAKEZ packages bundle VAT registration support."],"title":"VAT","answer":"VAT is an indirect tax on taxable goods and services in the UAE. It is administered by the Federal Tax Authority, not by RAKEZ. RAKEZ can help with registration as a service, and several of its packages bundle VAT registration support.","bullets":["Administered by the Federal Tax Authority at www.tax.gov.ae","RAKEZ offers VAT registration as part of its accounting and compliance services","VAT and corporate tax are different taxes with different rules","Businesses in a designated zone get special VAT treatment on qualifying goods activities","Check the registration threshold and your own obligation directly with the FTA"],"facts":[{"label":"Who administers VAT","value":"Federal Tax Authority (tax.gov.ae)","confidence":"confirmed"},{"label":"Registration threshold","value":"Not stated on RAKEZ's pages — confirm with the FTA","confidence":"unconfirmed"}],"followUps":["What is corporate tax?","Wh ","expensive","charges","total","pricing","rocket","racket"],"paraphrases":["RAKEZ sells a guided bank account opening service but does not open the account itself.","The standard service is priced at AED 2,999 on one RAKEZ page and AED 2,749 on another.","RAKEZ promises your money back if the account opening is unsuccessful.","The bank decides whether to accept your company, not RAKEZ.","The service covers bank selection, documents and liaison with the bank."],"title":"Opening a business bank account","answer":"RAKEZ does not open the account itself. It sells a guided service where a partner walks you through bank choice, documents and submission, and acts as your contact with the bank. Two RAKEZ pages price the standard service differently: AED 2,999 on the RAKEZ Value Added Services site and AED 2,749 on the RAKEZ promotions page. Both pages promise your money back if the account is not opened. The bank, not RAKEZ, decides whether to accept you.","bullets":["The service covers bank selection, document preparation and liaison with the bank","It is delivered by a third party, facilitated and verified by RAKEZ","Both pages state: money back if the account opening is unsuccessful","You can apply online from outside the UAE, but you sign in person","A VIP version exists at a higher price with a stated turnaround"],"facts":[{"label":"Standard service price","value":"AED 2,999 on vas.rakez.com; AED 2,749 on rakez.com/en/promotions/uae-business-bank-account. Two official RAKEZ pages, two prices — confirm which applies before paying.","confidence":"varies"},{"label":"Money-back promise","value":"Guaranteed money back if the account opening is unsuccessful","confidence":"confirmed"},{"label":"Who approves the account","value":"The bank. RAKEZ facilitates; it does not guarantee approval.","confidence":"confirmed"},{"label":"Minimum balance","value":"Not published on either RAKEZ page — ask the bank","confidence":"unconfirmed"}],"followUps":["What documents does the bank nee gister regardless of value","The Federal Tax Authority runs registration; RAKEZ sells help with it"],"facts":[{"label":"VAT rate","value":"5%","confidence":"confirmed"},{"label":"Mandatory registration threshold","value":"AED 375,000 of taxable supplies and imports per year","confidence":"confirmed"},{"label":"Voluntary registration threshold","value":"AED 187,500 of supplies and imports, or expenses above that level","confidence":"confirmed"},{"label":"VAT introduced","value":"1 January 2018","confidence":"confirmed"}],"followUps":["How do I register for VAT?","What is the designated zone?","Do free zone companies pay VAT?"],"source":"https://u.ae/en/information-and-services/finance-and-investment/taxation/vat/valueaddedtaxvat"},{"id":"corporate-tax-registration","persona":["renewer","setter-upper","everyone"],"questions":["do i have to register for corporate tax","how do i register for corporate tax","how much is corporate tax registration","do free zone companies need to register","what is a corporate tax registration number","corprate tax registeration","is there a deadline to register for corporate tax","can rakez register me for tax","ct registration","how to get a corporate tax number","what is the process to register for corporate tax","steps to get a corporate tax number","corporate tax registration process","registering for corporate tax procedure","how does a corporate tax number work","what do i do to get a corporate tax number","walk me through corporate tax registration","registering for corporate tax step by step","the process for a corporate tax number","where do i go to get a corporate tax number","guide for corporate tax registration","how much does registering for corporate tax cost","what does a corporate tax number cost","corporate tax sign up cost","corporate tax registration price","registering for corporate tax fees","how much do i pay for a corporate tax number","what is the fee for corporate tax sign up","price of corporate tax registration","how much money do i need for registering for corporate tax","is a corporate tax number expensive","what are the charges for corporate tax sign up","total cost of corporate tax registration","registering for corporate tax pricing","do i have to register for corprate tax","how do i register for corprate tax","how much is corprate tax registration","what is a corprate tax registration number","i need to know how much is corporate tax registration","i need to know do free zone companies need to register","can you tell me what is a corporate tax registration number"],"keywords":["corporate","tax","registration","register","trn","number","1249","3599","fta","taxable","person","much","free","zone","companies","corprate","registeration","deadline","rakez","process","steps","registering","procedure","work","walk","through","step","guide","cost","sign","price","fees","pay","fee","money","expensive","charges","total","pricing"],"paraphrases":["Every taxable person, free zone companies included, must register for corporate tax.","Registration produces a Corporate Tax Registration Number.","The Federal Tax Authority handles registration.","RAKEZ sells corporate tax registration help at AED 1,249.","A registration and banking bundle is offered at AED 3,599."],"title":"Registering for corporate tax","answer":"Every taxable person, free zone companies included, has to register for corporate tax and get a corporate tax registration number. That is a Federal Tax Authority process. RAKEZ sells help with it through its Value Added Services at AED 1,249, and bundles corporate tax registration with banking support at AED 3,599.","bullets":["All taxable persons, including free zone persons, must register","Registration gives you a Corporate Tax Registration Number","The Federal Tax Authority runs it","RAKEZ VAS corporate tax registration: AED 1,249","Corporate tax registration and banking bundle: AED 3,599, reduced from AED 3,999"],"facts":[{"label":"Who must register","value":"All tax ,"whats","meaning","define","dont","understand","information","details","allowed","hire","possible","qualify","eligible","eligibility","conditions","viza","residance"],"paraphrases":["A standard UAE work permit requires the worker to be at least 18.","Ages 15 to 18 are covered by juvenile or student training permits.","Everyone aged 18 and over must take the visa medical fitness test.","RAKEZ refers to charges for employees over 60 but does not publish the rule."],"title":"Age limits on visas","answer":"For a work permit the UAE rule is that the worker must be at least 18, unless it is a juvenile permit or a student training permit, which can cover ages 15 to 18. On the upper end, RAKEZ's own visa FAQ has a question about charges for employees over 60, which suggests extra conditions apply — but the answer is not readable on the public page. If you are hiring someone over 60, ask RAKEZ before you commit.","bullets":["Minimum age for a standard work permit: 18","Ages 15 to 18 need a juvenile or student training permit","Everyone aged 18 and over takes the visa medical fitness test","Extra charges or conditions for employees over 60 are referred to on the RAKEZ visa FAQ but not published"],"facts":[{"label":"Minimum working age","value":"18, except under a juvenile or student training permit","confidence":"confirmed"},{"label":"Medical test age","value":"Everyone aged 18 and above","confidence":"confirmed"},{"label":"Upper age limit or surcharge","value":"RAKEZ's visa FAQ lists a question on charges for employees over 60; the answer is not published. Confirm with RAKEZ on 600 577 000.","confidence":"unconfirmed"}],"followUps":["What documents do I need for an employee visa?","What is the medical fitness test?","How do I contact RAKEZ?"],"source":"https://u.ae/en/information-and-services/jobs/Sector-of-employment/employment-in-the-private-sector/work-permits"},{"id":"visa-activation-inside-uae","persona":["visa-seeker"],"questions":["what is the 985 charge","do i have .","The e-visa entry permit is valid for 60 days from issue."],"title":"Activating a visa if you are already in the UAE","answer":"If the applicant is already inside the UAE, RAKEZ activates the visa on their behalf and there is an extra charge of AED 985. If the applicant is outside, UAE immigration activates it when they land, and there is no activation charge. The e-visa entry permit is valid for 60 days from issue, so the person has to travel or be activated within that window.","bullets":["Applicant inside the UAE: RAKEZ performs the activation, extra AED 985","Applicant outside the UAE: immigration activates it on arrival","The e-visa is valid for 60 days from the date of issue","The activation charge is on top of the visa package price"],"facts":[{"label":"In-country activation charge","value":"AED 985","confidence":"confirmed"},{"label":"e-visa validity","value":"60 days from issue","confidence":"confirmed"},{"label":"Who activates","value":"RAKEZ if the applicant is inside the UAE; UAE immigration on arrival if outside","confidence":"confirmed"}],"followUps":["What does an employee visa cost?","What is an entry permit?","How long does a visa take?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-investor-partner"},{"id":"nationality-specific-rules","persona":["visa-seeker"],"questions":["does my nationality need extra documents","i am from nigeria what do i need","do indians need extra documents","why do i have to go to the embassy","what is an approval instead of an entry permit","can egyptians get a tourist visa","do i need a police clearance certificate","good conduct certificate visa","extra rules for pakistani applicants","which nationalities are restricted","what is nationality rules","what does extra requirements for my nationality mean","explain country specific visa rules","tell me about nationality restrictions","nationality rules","extra requirements for my nationality explained","whats country specific visa rules","meaning o ies."],"title":"Rules that depend on your nationality","answer":"Some nationalities go through extra steps. Applicants from Egypt, Nigeria, Indonesia, Sri Lanka and Kenya receive an Approval instead of an entry permit and must visit a UAE embassy within 45 days. Iraqi nationals have to add a national identity card when renewing. Several nationalities need good conduct certificates, national ID cards or attested medical reports. Tourist visa services are temporarily stopped for a list of countries.","bullets":["Egypt, Nigeria, Indonesia, Sri Lanka, Kenya: Approval instead of entry permit, UAE embassy visit within 45 days","Iraqi nationals: national identity card required at renewal","Some nationalities need good conduct certificates or attested medical reports","Tourist visas are temporarily stopped for a published list of countries","Kenya needs a 6-month bank statement and Egypt an attested conduct certificate for a tourist visa"],"facts":[{"label":"Embassy visit deadline","value":"45 days, for Egypt, Nigeria, Indonesia, Sri Lanka and Kenya","confidence":"confirmed"},{"label":"Iraqi nationals at renewal","value":"National identity card required in addition to the standard documents","confidence":"confirmed"},{"label":"Tourist visa suspensions","value":"Temporarily stopped for Uganda, Cameroon, Benin, Yemen, Somalia, Bangladesh, Sudan, Nigeria, Sierra Leone, Libya, Ghana, Congo, Togo, Burundi, Ivory Coast, Afghanistan and Palestine","confidence":"confirmed"},{"label":"Full nationality matrix","value":"RAKEZ does not publish one — confirm your own nationality's requirements with RAKEZ","confidence":"unconfirmed"}],"followUps":["What documents do I need for an employee visa?","How much is a tourist visa?","How long does a visa take?"],"source":"https://rakez.com/en/service-cards/visa-services/new-visa-investor-partner"},{"id":"tourist-visa","persona":["visa-seeker","everyone"],"questions":["how much is a tourist visa","can i bring my mother to visit","how long is a vi years.","Outstanding students get 5 or 10 years depending on level."],"title":"Golden Visa investment thresholds","answer":"The UAE government publishes the thresholds, not RAKEZ. A public investment of at least AED 2 million gets a 10-year Golden Visa. A real estate route gives 5 years, through property ownership or a contribution to an establishment paying at least AED 250,000 a year in taxes. Entrepreneurs get 5 years on proof of an innovative project. Exceptional talent and humanitarian categories run 10 years, and outstanding students 5 or 10.","bullets":["Public investment of at least AED 2 million: 10 years","Real estate route: 5 years, with property ownership or an establishment paying AED 250,000 a year in taxes","Entrepreneurs: 5 years, with proof of an innovative or technical project and an incubator letter","Exceptional talent and rare specialisations: 10 years","Outstanding students: 5 years for school, 10 years for top university students","Humanitarian pioneers and frontline heroes: 10 years"],"facts":[{"label":"Public investment threshold","value":"Minimum capital of AED 2 million, 10-year visa","confidence":"confirmed"},{"label":"Real estate route","value":"5 years; property ownership, or contribution to an establishment paying at least AED 250,000 annually in taxes","confidence":"confirmed"},{"label":"Entrepreneur threshold","value":"No minimum capital figure is published — the requirement is documentary proof of the project","confidence":"confirmed"},{"label":"Salary thresholds for specialists and professionals","value":"Not published on the UAE government Golden Visa page — requirements vary by subcategory","confidence":"unconfirmed"}],"followUps":["What is the Golden Visa?","How do I apply through RAKEZ?","How long does a Golden Visa last?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visas/golden-visa"},{"id":"sponsor-parents","persona":["visa-seeker"],"questions":["can i sponsor my parents","can i bring my mother to live with me","how long is a parent visa","what salary do i need to sponsor my father","is a parent visa yearly","sponsering parents uae","can i sponsor my mother in law","do my parents need a medical","parents residence visa rules","am i allowed to bring my mother to live here","is it possible to sponsor my parents","is a visa for my father allowed","do i qualify to sponsor my parents","who can bring my mother to live here","am i eligible to sponsor my parents","is it ok to bring my mother to live here","eligibility for sponsoring my parents","a parent visa eligibility","are there rules about bringing my mother","what are the conditions for a visa for my father","how do i sponsor my parents","how to bring my mother to live here","what is the process to sponsor my parents","steps to bring my mother to live here","sponsoring my parents process","a parent visa procedure","how does bringing my mother work","what do i do to bring my mother to live here","walk me through sponsoring my parents","a parent visa step by step","the process for bringing my mother","where do i go to bring my mother to live here","guide for sponsoring my parents","how long is a parent viza","is a parent viza yearly","i need to know how long is a parent visa","i need to know what salary do i need to sponsor my father","can you tell me is a parent visa yearly"],"keywords":["parents","parent","mother","father","mum","dad","sponsor","yearly","annual","4000","3000","icp","bring","live","long","visa","salary","sponsering","uae","law","medical","residence","rules","allowed","possible","qualify","eligible","eligibility","sponsoring","bringing","conditions","process","steps","procedure","work","walk","through","step","guide","viza"],"paraphrases":["A UAE resident can sponsor their parents for a residence visa.","A parent's visa is granted on a yearly basis regardless of the sponsor's visa term.","The sponsor needs AED 4,000 a month, or AED 3,000 with accommodation.","Family members aged 18 and over take the medical fitness test.","Parent sponsorship conditions change, so confirm them with ICP or RAKEZ."],"title":"Sponsoring your parents","answer":"A UAE resident can sponsor their parents. The residence visa for a parent is granted on a yearly basis, regardless of how long the sponsor's own visa runs. The general family sponsorship salary rule applies: AED 4,000 a month, or AED 3,000 with accommodation. Parent sponsorship conditions change from time to time, so check the current rules with RAKEZ or the ICP before you plan.","bullets":["A resident can sponsor their parents","A parent's residence visa is granted yearly, whatever the sponsor's visa term","Family sponsorship salary rule: AED 4,000, or AED 3,000 plus accommodation","Family members aged 18 and over take the medical fitness test","Conditions are subject to change — confirm with ICP or GDRFA"],"facts":[{"label":"Parent visa duration","value":"Granted on a yearly basis regardless of the sponsor's visa duration","confidence":"confirmed"},{"label":"Sponsor salary","value":"AED 4,000 per month, or AED 3,000 plus accommodation","confidence":"confirmed"},{"label":"Extra conditions for parents such as deposits or medical insurance level","value":"Not stated on the UAE government page — confirm with ICP","confidence":"unconfirmed"}],"followUps":["Can I bring my wife and children?","What does a dependent visa cost?","What documents do I need?"],"source":"https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visas/residence-visa-for-family-members/sponsorship-requirements"},{"id":"emirates-id-renewal","persona":["visa-seeker","renewer"],"questions":["how do i renew my emirates id","does my emirates id renew with my visa","my emirate id expired","do i need biometrics again for renewal","how long for a new id card","emirates i d renewal","is emirates id separate from the visa","where do i collect my id card","id card delivery time","how to get a new id card","what is the process to renew my ered to your door in 2 to 3 working days.","bullets":["Emirates ID renewal is a step inside visa renewal, not a separate application","Order: portal application, medical test, Emirates ID renewal, visa and card issued","VIP package delivers the card to your door in 2 to 3 working days","You must be inside the UAE to renew"],"facts":[{"label":"When the ID is renewed","value":"During the residence visa renewal process","confidence":"confirmed"},{"label":"VIP card delivery","value":"2 to 3 working days to your door","confidence":"confirmed"},{"label":"Standalone Emirates ID renewal fee","value":"Not published on the RAKEZ renewal pages — it is bundled into the renewal package","confidence":"unconfirmed"}],"followUps":["How much is visa renewal?","Do I need to redo biometrics?","How long does renewal take?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-renewal-investor-partner"},{"id":"visa-renewal-when","persona":["visa-seeker","renewer"],"questions":["how early can i renew my visa","when should i start my visa renewal","my visa expires in 3 weeks","can i renew my visa from abroad","how many days before expiry can i renew","renew viza early","do i have to be in the country to renew","is there a renewal window","what if i leave it too late","when do i renew my visa","what is the deadline for starting my visa renewal","the visa renewal window deadline","when is visa renewal timing due","how soon do i need to start my visa renewal","last date for starting my visa renewal","is there a time limit for the visa renewal window","visa renewal timing timing","when does when to renew my visa start","how early can i renew my viza","when should i start my viza renewal","my viza expires in 3 weeks","can i renew my viza from abroad","i need to know my visa expires in 3 weeks","i need to know can i renew my visa from abroad","can you tell me how many days before expiry can i renew"],"keywords":["when","early","window","before","expiry","renew","inside","abroad","timing","days","visa","start","renewal","expires","weeks","many","viza","country","leave","late","deadline","starting","due","soon","last","date","time","limit"],"paraphrases":["RAKEZ does not publish how early a visa renewal can be started.","You must be inside the UAE to apply for a visa renewal.","Standard renewal takes 4 working days and VIP 1 working day.","Start early and confirm your own dates with RAKEZ."],"title":"When to start a visa renewal","answer":"RAKEZ does not publish a renewal window on its visa renewal pages. What it does state is that you must be inside the UAE to apply, and that a standard renewal takes 4 working days while VIP takes 1. Because there is no published grace period arithmetic, start early and confirm your own dates with RAKEZ rather than cutting it fine.","bullets":["No renewal window is published on the RAKEZ visa renewal pages","You must be inside the UAE to apply","Standard renewal takes 4 working days, VIP 1 working day","After renewal, you must re-enter the UAE within 180 days of any exit","Confirm your own dates with RAKEZ on 600 577 000"],"facts":[{"label":"Must be in the UAE","value":"Yes, the applicant must be inside the UAE to apply","confidence":"confirmed"},{"label":"Renewal processing","value":"1 working day VIP, 4 working days standard","confidence":"confirmed"},{"label":"How many days before expiry renewal opens","value":"Not published on the RAKEZ visa renewal pages — confirm with RAKEZ","confidence":"unconfirmed"}],"followUps":["How much is visa renewal?","What if my visa has expired?","What is the 180-day rule?"],"source":"https://rakez.com/en/service-cards/visa-services/visa-renewal-employee"},{"id":"after-submitting-documents","persona":["setter-upper","everyone"],"questions":["what happens after i submit my documents","i sent my documents what now","when do i get my invoice","what do i get when the licence is issued","when does the visa start after the licence","whats next after payment","i paid what happens now", st changes are a paid amendment with a resolution signed by all shareholders. Activity or licence amendments are AED 1,999 and take 5 to 7 working days. A trade name change is AED 1,999 over 7 to 10 working days. A shareholder structure change is AED 4,000 plus AED 500 Chamber of Commerce and takes 8 to 10 working days. Updating personal details is AED 1,999 plus AED 500. RAKEZ gives a 30% discount on a second amendment.","bullets":["Licence or activity amendment: AED 1,999, 5 to 7 working days","Trade name change: AED 1,999, 7 to 10 working days including publication","Shareholder structure change: AED 4,000 plus AED 500 Chamber of Commerce, 8 to 10 working days","KYC or personal details update: AED 1,999 plus AED 500","30% discount on a second amendment","A shareholders' resolution, notarised, is needed for most amendments"],"facts":[{"label":"Second amendment discount","value":"30%","confidence":"confirmed"},{"label":"Resolution requirement","value":"Signed by all shareholders; notarised by a UAE notary, or legalised to UAE embassy level for non-UAE parties","confidence":"confirmed"},{"label":"E-Channel charges on a shareholder change","value":"E-Channel registration AED 2,300 and renewal AED 1,300 are listed on the shareholder change page, which differs from the RAKEZ FAQ figures of AED 2,200 and AED 1,200","confidence":"varies"}],"followUps":["How do I add a shareholder?","How do I change my company name?","How do I add an activity?"],"source":"https://rakez.com/en/service-cards/company-amendments/license-amendment-free-zone"},{"id":"newspaper-publication","persona":["renewer","everyone"],"questions":["why do i need a newspaper notice","how long is the publication period","does a name change go in the newspaper","who pays for the newspaper ad","is publication part of the processing time","newspapper notice rakez","which changes need publishing","14 days publication","do i have to advertise the closure","what is newspaper publication","what does a newspaper noti here a time limit for getting an noc","an noc timing","when does a no objection certificate start","i need to know can i be a manager in two companies","i need to know who issues the noc","can you tell me do i need a letter from my current employer"],"keywords":["noc","objection","certificate","letter","sponsor","manager","two","regulated","authority","customs","approval","companies","issues","current","employer","activities","agree","second","company","mean","explain","requirement","getting","explained","whats","meaning","define","dont","understand","information","details","obtain","deadline","due","soon","last","date","time","limit","timing","start"],"paraphrases":["An NOC is a letter from another party stating no objection.","You need an NOC from your current sponsor to be a manager in a second company.","An incoming shareholder on an employee or dependent visa needs an NOC from the current sponsor.","Regulated activities need an NOC from the regulating authority.","Land and warehouse amendments can need NOCs from RAK Customs and Public Services."],"title":"When you need a No Objection Certificate","answer":"An NOC is a letter from someone else saying they do not object. You need one from your current sponsor if you want to be a manager in more than one company, or if you are joining as a shareholder while holding an employee or dependent visa. Regulated activities need an NOC from the authority that regulates them before RAKEZ will add the activity. Companies with land or a warehouse need NOCs from RAK Customs and the Public Services Department for some amendments.","bullets":["NOC from your current sponsor to be a manager in a second company","NOC from your current sponsor if you join as a shareholder on an employee or dependent visa","NOC from the regulating authority for regulated activities","NOC from RAK Customs and Public Services for land or warehouse amendments","NOC from regulatory authorities may also be asked for at renewal"],"facts":[{"label":"Manage
